name: Bug report
description: Something in loopboard is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npx loopboard` in a repo with …
        2. Drag #0012 to In review
        3. …
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: loopboard version
      placeholder: e.g. 1.0.0 (or commit SHA)
  - type: input
    id: environment
    attributes:
      label: OS, Node version and browser
      placeholder: e.g. macOS 15, Node 22, Chrome 140
  - type: textarea
    id: files
    attributes:
      label: Relevant issue/PRD file (optional)
      description: Paste the frontmatter or the part of the markdown file involved.
      render: markdown
