name: Feature request
description: Suggest an improvement to loopboard or its workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
