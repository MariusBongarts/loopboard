      function buildFeed() {
        const items = [];
        for (const p of P) for (const s of p.sessions) items.push({ k: "s|" + p.slug + "|" + s.d, kind: "session", slug: p.slug, d: s.d, n: s.n });
        for (const i of DATA.issues) if (i.c && i.c >= "2026-06-15") items.push({ k: "i|" + i.id, kind: "issue", slug: i.p, d: i.c, id: i.id });
        return items.sort((a, b) => b.d.localeCompare(a.d) || (a.kind === "session" ? -1 : 1));
      }
      const FEED = buildFeed();
      function filtered() {
        return FEED.filter((e) => {
          if (state.slug && e.slug !== state.slug) return false;
          if (state.filter === "you") return e.kind === "issue" && I[e.id].w === "human" && !["done", "backlog"].includes(I[e.id].s);
          if (state.filter === "sessions") return e.kind === "session";
          if (state.filter === "issues") return e.kind === "issue";
          return true;
        });
      }
      function grouped(list) {
        const days = []; let cur = null;
        for (const e of list) { if (!cur || cur.d !== e.d) { cur = { d: e.d, items: [] }; days.push(cur); } cur.items.push(e); }
        return days;
      }
      function itemTitle(e) {
        if (e.kind === "issue") return I[e.id].t;
        return splitNote(e.n)[0];
      }
      function splitNote(n) {
        const s = plain(n);
        const m = s.match(/^(.{30,140}?[.!?;])(\s|$)/);
        if (m) return [m[1], s.slice(m[1].length).trim()];
        if (s.length <= 120) return [s, ""];
        const cut = s.lastIndexOf(" ", 110);
        return [s.slice(0, cut) + "…", "…" + s.slice(cut + 1)];
      }
      function itemRow(e, dense) {
        const p = proj(e.slug); const on = state.sel === e.k; const fresh = ago(e.d) <= 1;
        const unread = `<span class="unread" style="background:${fresh ? "var(--ember)" : "transparent"}"></span>`;
        const kind = e.kind === "session" ? `<span class="kind">${ICONS.session.replace("<svg", '<svg width="11" height="11"')}Session</span>` : `<span class="kind mono">#${e.id}</span>`;
        const rest = e.kind === "session" ? splitNote(e.n)[1] : "";
        const sub = e.kind === "session" ? (rest ? `<div class="x">${esc(rest)}</div>` : "") : `<div class="x" style="display:flex;gap:6px;align-items:center">${st(I[e.id].s)}${who(I[e.id].w)}</div>`;
        if (dense) {
          const right = e.kind === "issue" ? st(I[e.id].s) : `<span class="kind">Session</span>`;
          return `<button class="item ${on ? "on" : ""}" data-act="sel" data-k="${e.k}">${unread}<span class="l1">${sq(p)}<span class="pn">${esc(p ? p.title : "Standalone")}</span></span><span class="t">${e.kind === "issue" ? `<span class="muted mono" style="font-weight:400">#${e.id}</span> ` : ""}${esc(itemTitle(e))}</span><span>${right}</span><span class="tm">${rel(e.d)}</span></button>`;
        }
        return `<button class="item ${on ? "on" : ""}" data-act="sel" data-k="${e.k}">${unread}<span style="min-width:0"><span class="l1">${sq(p)}<span class="pn">${esc(p ? p.title : "Standalone")}</span>${kind}</span><div class="t">${esc(itemTitle(e))}</div>${sub}</span><span class="tm">${rel(e.d)}</span></button>`;
      }
      function feedList(dense, sticky) {
        const days = grouped(filtered());
        const shown = days.slice(0, state.days);
        const html = shown.map((d) => `<div class="day" style="--sticky:${sticky || 88}px"><span>${dayLabel(d.d)}</span><span>${d.items.length} ${d.items.length === 1 ? "item" : "items"}</span></div>${d.items.map((e) => itemRow(e, dense)).join("")}`).join("");
        const end = shown.length < days.length ? `<div class="more" data-more><span class="spin"></span>Loading earlier days…</div>` : `<div class="more">That's everything since mid-June.</div>`;
        return (html || `<div class="more">Nothing here.</div>`) + end;
      }
      const findItem = (k) => FEED.find((e) => e.k === k);

      /* ---------- rail ---------- */
      function rail() {
        const views = [["all", "Inbox", ICONS.inbox, FEED.length], ["you", "Needs you", ICONS.you, humanOpen().length], ["sessions", "Sessions", ICONS.session, FEED.filter((e) => e.kind === "session").length], ["issues", "New issues", ICONS.issue, FEED.filter((e) => e.kind === "issue").length]];
        const active = P.filter((p) => p.status !== "paused");
        const paused = P.filter((p) => p.status === "paused");
        const pr = (p) => `<button class="nav ${state.slug === p.slug && !state.open ? "on" : ""} ${state.open === p.slug ? "on" : ""}" data-act="railp" data-slug="${p.slug}">${sq(p)}<span class="nm">${esc(p.title)}</span><span class="n">${rel(p.last)}</span></button>`;
        return `<nav class="pane rail"><button class="search" data-act="palette">${ICONS.search.replace("<svg", '<svg width="14" height="14"')}Search<kbd>⌘K</kbd></button>${views.map(([k, l, ic, n]) => `<button class="nav ${state.filter === k && !state.slug && !state.open ? "on" : ""}" data-act="view" data-f="${k}">${ic}<span class="nm">${l}</span><span class="n ${k === "you" ? "hot" : ""}">${n}</span></button>`).join("")}<div class="sec">Projects · last session</div>${active.map(pr).join("")}${paused.length ? `<div class="sec">Paused</div>${paused.map(pr).join("")}` : ""}</nav>`;
      }
      function listHead(title, extra) {
        const chips = [["all", "All"], ["you", "Needs you"], ["sessions", "Sessions"], ["issues", "Issues"]];
        return `<div class="list-h"><div class="row1"><h2>${esc(title)}</h2>${extra || ""}</div><div class="filters">${chips.map(([k, l]) => `<button class="fchip ${state.filter === k ? "on" : ""}" data-act="chip" data-f="${k}">${l}</button>`).join("")}</div></div>`;
      }
      const listTitle = () => state.slug ? proj(state.slug).title : { all: "Inbox", you: "Needs you", sessions: "Sessions", issues: "New issues" }[state.filter];

      /* ---------- project view (board) ---------- */
      function projectView(slug, opts = {}) {
        const p = proj(slug);
        const iss = DATA.issues.filter((i) => i.p === slug);
        const total = COLS.reduce((s, k) => s + p.c[k], 0);
        const tabs = [["board", "Board", total], ["prd", "PRD", ""], ["activity", "Activity", p.sessions.length]];
        const head = `<div class="pv-h" style="--tone:${p.tone[0]};--tone-soft:${p.tone[1]}"><div class="r1">${opts.back ? `<button class="btn" data-act="back">${ICONS.back}${esc(opts.back)}</button>` : ""}${sq(p)}<h1>${esc(p.title)}</h1><span class="meta">${esc(p.status === "unknown" ? "active" : p.status)} · last session ${rel(p.last)}</span><span class="sp"></span>${opts.close ? `<button class="btn" data-act="close">${ICONS.x}Close</button>` : ""}</div>
          ${p.focus ? `<div class="pv-focus" style="--clamp:${state.focusOpen ? 20 : 2}"><b>Current focus</b><p>${rich(p.focus)}</p><button class="x" data-act="focus">${state.focusOpen ? "Less" : "More"}</button></div>` : ""}
          <div class="ptabs">${tabs.map(([k, l, n]) => `<button class="${state.tab === k ? "on" : ""}" data-act="tab" data-tab="${k}">${l}${n !== "" ? `<span>${n}</span>` : ""}</button>`).join("")}</div></div>`;
        let body;
        if (state.tab === "prd") body = prdDoc(p);
        else if (state.tab === "activity") body = p.sessions.map((s) => `<div class="log"><span class="d">${dayLabel(s.d)}</span><p>${rich(s.n)}</p></div>`).join("") || `<p class="muted">No sessions since mid-June.</p>`;
        else body = board(p, iss, opts.hl);
        return `<div class="pv">${head}<div class="pv-b">${body}</div></div>`;
      }
      function board(p, iss, hl) {
        const q = state.q.trim().toLowerCase();
        const vis = iss.filter((i) => (state.who === "all" || i.w === state.who) && (!q || (i.t + " " + i.id).toLowerCase().includes(q)));
        const mine = iss.filter((i) => i.w === "human" && !["done", "backlog"].includes(i.s)).length;
        const head = `<div class="bh"><div class="seg"><button class="${state.who === "all" ? "on" : ""}" data-act="who" data-w="all">Everyone</button><button class="${state.who === "human" ? "on" : ""}" data-act="who" data-w="human">Mine${mine ? ` · ${mine}` : ""}</button><button class="${state.who === "agent" ? "on" : ""}" data-act="who" data-w="agent">Agent</button></div><input class="bsearch" id="bq" placeholder="Filter this board" value="${esc(state.q)}" /><span class="sp"></span>${p.c.backlog ? `<span class="count">Backlog ${p.c.backlog}</span>` : ""}<div style="width:180px">${barC(p.c)}</div></div>`;
        const cols = COLS.map((s) => {
          const items = vis.filter((i) => i.s === s).sort((a, b) => (b.id === hl) - (a.id === hl) || b.c.localeCompare(a.c));
          const rest = state.who === "all" && !q ? p.c[s] - items.length : 0;
          return `<section class="col"><div class="col-h"><span class="d" style="background:${SC[s]}"></span>${SL[s]}<span class="n">${p.c[s]}</span></div>${items.map((i) => `<div class="card ${i.id === hl ? "hl" : ""}" role="button" tabindex="0" data-act="issue" data-id="${i.id}"><div class="c1"><span class="mono">#${i.id}</span>${who(i.w)}<span class="cat">${esc(i.cat)}</span></div><div class="t">${esc(i.t)}</div></div>`).join("") || (p.c[s] ? "" : `<div class="empty">Empty</div>`)}${rest > 0 ? `<div class="rest">+ ${rest} older, on the full board</div>` : ""}</section>`;
        }).join("");
        return head + `<div class="board">${cols}</div>`;
      }
      function prdDoc(p) {
        return `<div class="prd-doc"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span class="path">ai/projects/${esc(p.slug)}/prd.md</span><button class="btn">${DOC}Open in editor</button></div><h3>Problem statement</h3><p>${rich(p.problem) || "<span class='muted'>No problem statement.</span>"}</p><h3>Solution</h3><p>${rich(p.solution) || "<span class='muted'>—</span>"}</p><h3>Current focus · wip.md</h3><p>${rich(p.focus)}</p></div>`;
      }

      /* ---------- item preview ---------- */
      function preview(k, opts = {}) {
        const e = findItem(k);
        if (!e) return `<div class="rd"><p class="muted">Select an item.</p></div>`;
        const p = proj(e.slug);
        if (e.kind === "session") {
          return `<div class="rd"><div class="rd-top">${ptag(e.slug)}<span>Session · ${dayLabel(e.d)}</span></div><div class="label" style="margin-top:14px">From the activity log</div><p style="font-size:16px;color:var(--ink);margin-top:6px">${rich(e.n)}</p>${p.focus ? `<div class="callout" style="background:${p.tone[1]};border-color:transparent"><div class="h"><span class="label" style="color:${p.tone[0]}">Current focus</span></div><p>${rich(p.focus)}</p></div>` : ""}${barC(p.c)}<div style="display:flex;gap:8px;margin-top:18px"><button class="btn primary" data-act="prd" data-slug="${p.slug}">${DOC}Open PRD & board</button></div></div>`;
        }
        const i = I[e.id];
        return `<div class="rd"><div class="rd-top">${ptag(i.p)}<span>Filed ${dayLabel(i.c)}</span></div><h1>${esc(i.t)}</h1><div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">${st(i.s)}${who(i.w)}<span class="muted">${i.w === "human" ? "You" : "Agent"}</span><span class="muted mono">#${i.id}</span><span class="muted">· ${esc(i.cat)}</span></div>${p ? `<div class="callout"><div class="h"><span class="label">Part of ${esc(p.title)}</span>${prdBtn(p.slug, "Open PRD & board")}</div><p style="color:var(--ink-2)">${rich(p.problem).slice(0, 2000)}</p></div>` : `<div class="callout"><p class="muted">Standalone issue — no project, so no PRD or board.</p></div>`}<p class="muted" style="font-size:13px">The issue's markdown body renders here, as in today's drawer.</p></div>`;
      }
      function issueDrawer(id) {
        const i = I[id]; const p = proj(i.p);
        return `<div class="dr"><div class="rd-top">${ptag(i.p)}<button class="btn" data-act="closedrawer">${ICONS.x}Close</button></div><h1>${esc(i.t)}</h1><div style="display:flex;gap:8px;align-items:center">${st(i.s)}${who(i.w)}<span class="muted mono">#${i.id}</span><span class="muted">· filed ${dayLabel(i.c)}</span></div>${p ? `<div class="callout" style="margin-top:18px"><div class="h"><span class="label">Project</span>${prdBtn(p.slug, "Open PRD & board")}</div><p>${esc(p.title)}</p></div>` : ""}<p class="muted">The issue's markdown body renders here.</p></div>`;
      }

      /* ---------- prototypes ---------- */
      function classic() {
        const right = state.open ? projectView(state.open, { back: "Back to item", hl: state.sel && findItem(state.sel) && findItem(state.sel).id }) : preview(state.sel);
        return `<div class="shell" style="grid-template-columns:248px 420px minmax(0,1fr)">${rail()}<section class="pane" data-scroll>${listHead(listTitle())}${feedList()}</section><section class="pane reader">${right}</section></div>`;
      }
      function context() {
        const e = findItem(state.sel);
        const slug = state.open || (e && e.slug) || P[1].slug;
        const p = proj(slug);
        const pin = e && e.slug === slug ? `<div style="padding:12px 24px 0"><div class="callout" style="margin:0;display:flex;gap:12px;align-items:flex-start"><div style="flex:1;min-width:0"><div class="label" style="margin-bottom:4px">${e.kind === "session" ? "Session · " + dayLabel(e.d) : "Selected issue · #" + e.id}</div><p style="font-size:13.5px">${e.kind === "session" ? rich(e.n) : esc(I[e.id].t)}</p></div>${e.kind === "issue" ? st(I[e.id].s) : ""}</div></div>` : "";
        const view = p ? projectView(slug, { hl: e && e.kind === "issue" ? e.id : null }) : `<div class="rd"><p class="muted">Standalone issue — no board.</p></div>`;
        return `<div class="shell" style="grid-template-columns:248px 380px minmax(0,1fr)">${rail()}<section class="pane" data-scroll>${listHead(listTitle())}${feedList()}</section><section class="pane reader">${e && !e.slug ? preview(state.sel) : view.replace('<div class="pv-b">', pin + '<div class="pv-b">')}</section></div>`;
      }
      function takeover() {
        if (state.open) {
          const p = proj(state.open);
          const side = `<aside class="pane" style="background:var(--bg-2);padding:18px 20px 40px"><button class="btn" data-act="back">${ICONS.back}Inbox</button><div class="label" style="margin-top:22px">PRD · problem</div><p style="font-size:13.5px;line-height:1.55;color:var(--ink-2);margin:6px 0 0">${rich(p.problem)}</p><div class="label" style="margin-top:18px">Solution</div><p style="font-size:13.5px;line-height:1.55;color:var(--ink-2);margin:6px 0 0">${rich(p.solution)}</p><div class="label" style="margin-top:18px">Recent sessions</div>${p.sessions.slice(0, 4).map((s) => `<div style="padding:9px 0;border-top:1px solid var(--line)"><div style="font-size:12px;color:var(--ink-3);font-weight:500">${dayLabel(s.d)}</div><div style="font-size:12.5px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(plain(s.n))}</div></div>`).join("")}</aside>`;
          const hl = state.sel && findItem(state.sel) && findItem(state.sel).id;
          return `<div class="shell" style="grid-template-columns:248px 300px minmax(0,1fr)">${rail()}${side}<section class="pane">${projectView(state.open, { hl })}</section></div>`;
        }
        return `<div class="shell" style="grid-template-columns:248px 460px minmax(0,1fr)">${rail()}<section class="pane" data-scroll>${listHead(listTitle())}${feedList()}</section><section class="pane reader">${preview(state.sel)}</section></div>`;
      }
      function threads() {
        const list = filtered();
        const by = new Map();
        for (const e of list) { const key = e.slug || "_"; if (!by.has(key)) by.set(key, []); by.get(key).push(e); }
        const ths = [...by.entries()].slice(0, state.days + 4);
        const html = ths.map(([slug, items]) => {
          const p = proj(slug); const last = items[0]; const on = state.open === slug;
          const exp = state.expanded[slug] ?? on;
          const sessions = items.filter((e) => e.kind === "session").length, issues = items.length - sessions;
          const head = `<button class="thread-h" data-act="thread" data-slug="${slug}">${sq(p)}<span style="min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><span class="nm">${esc(p ? p.title : "Standalone")}</span><span class="muted" style="font-size:11.5px;white-space:nowrap">${rel(last.d)}</span></div><div class="x">${esc(itemTitle(last))}</div><div class="meta">${sessions ? `<span class="count">${sessions} session${sessions > 1 ? "s" : ""}</span>` : ""}${issues ? `<span class="count">${issues} new issue${issues > 1 ? "s" : ""}</span>` : ""}${p && humanOpen(slug).length ? `<span class="count" style="background:var(--ember-soft);color:var(--ember-deep)">${humanOpen(slug).length} need you</span>` : ""}</div></span><span></span></button>`;
          const body = exp ? `<div class="thread-items">${items.slice(0, 8).map((e) => `<button class="titem" data-act="${e.kind === "issue" ? "issue" : "sel"}" data-id="${e.id || ""}" data-k="${e.k}"><span class="dd">${short(e.d)}</span><span class="tt">${e.kind === "issue" ? `<span class="mono muted">#${e.id}</span> ` : ""}${esc(itemTitle(e))}</span></button>`).join("")}${items.length > 8 ? `<div class="titem"><span></span><span class="muted">+ ${items.length - 8} more</span></div>` : ""}</div>` : "";
          return `<div class="thread ${on ? "on" : ""}">${head}${body}</div>`;
        }).join("");
        const more = ths.length < by.size ? `<div class="more" data-more><span class="spin"></span>Loading more threads…</div>` : `<div class="more">All threads shown.</div>`;
        const right = state.open && proj(state.open) ? projectView(state.open, {}) : state.sel ? preview(state.sel) : `<div class="rd"><h1 style="font-size:18px">Pick a thread</h1><p>Each thread is one project's activity since mid-June — sessions from its wip.md and the issues filed under it.</p></div>`;
        return `<div class="shell" style="grid-template-columns:248px 400px minmax(0,1fr)">${rail()}<section class="pane" data-scroll>${listHead(state.slug ? listTitle() : "Threads")}${html}${more}</section><section class="pane reader">${right}</section></div>`;
      }
      function peek() {
        const hint = `<div class="hint"><span><kbd>j</kbd> <kbd>k</kbd> move</span><span><kbd>↵</kbd> open PRD</span><span><kbd>⌘K</kbd> search</span></div>`;
        return `<div class="shell" style="grid-template-columns:248px minmax(0,1fr) 420px">${rail()}<section class="pane dense" data-scroll>${listHead(listTitle(), hint)}${feedList(true)}</section><section class="pane reader">${preview(state.sel)}</section></div>`;
      }

      /* ---------- palette ---------- */
      function palResults() {
        const q = state.pal.q.trim().toLowerCase(); const m = (s) => !q || s.toLowerCase().includes(q);
        const ps = P.filter((p) => m(p.title + " " + p.slug)).slice(0, 5).map((p) => ({ a: "prd", slug: p.slug, ic: sq(p), l: p.title, s: "PRD & board · last session " + rel(p.last), r: "Project", g: "Projects & PRDs" }));
        const is = DATA.issues.filter((i) => m("#" + i.id + " " + i.t)).slice(0, 8).map((i) => ({ a: "issue", id: i.id, ic: ICONS.issue.replace("<svg", '<svg width="14" height="14"'), l: "#" + i.id + " " + i.t, s: proj(i.p) ? proj(i.p).title : "Standalone", r: SL[i.s], g: "Issues" }));
        return [...ps, ...is];
      }
      function renderPalette() {
        const el = $("palette");
        if (!state.pal.open) { el.classList.remove("on"); el.innerHTML = ""; return; }
        const res = palResults(); state.pal.i = Math.min(state.pal.i, Math.max(0, res.length - 1));
        let g = "";
        const list = res.map((r, n) => { const gh = r.g !== g ? `<div class="g">${r.g}</div>` : ""; g = r.g; return `${gh}<button class="it ${n === state.pal.i ? "sel" : ""}" data-pal="${n}"><span style="display:grid;place-items:center">${r.ic}</span><span style="min-width:0"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.l)}</div><small style="display:block">${esc(r.s)}</small></span><small>${esc(r.r)}</small></button>`; }).join("");
        el.classList.add("on");
        el.innerHTML = `<div class="pal"><input id="palq" placeholder="Search projects, PRDs and issues…" value="${esc(state.pal.q)}" autocomplete="off" /><div class="res">${list || `<div class="g">No matches</div>`}</div><div class="foot"><span>↑↓ move</span><span>↵ open</span><span>esc close</span></div></div>`;
        const inp = $("palq"); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
        el._res = res;
      }

      /* ---------- actions ---------- */
      function openPrd(slug) {
        state.q = ""; state.who = "all"; state.tab = "board"; state.focusOpen = false;
        state._sheet = null;
        if (state.proto === "peek") { state.drawer = { k: "sheet", slug }; return; }
        state.open = slug; state.drawer = null;
      }
      function closeDrawer() {
        if (state.drawer && state.drawer.k === "issue" && state._sheet) { state.drawer = state._sheet; state._sheet = null; }
        else { state.drawer = null; state._sheet = null; }
      }
      function renderDrawer() {
        const d = state.drawer, dr = $("drawer"), sc = $("scrim");
        if (!d) { dr.classList.remove("on"); sc.classList.remove("on"); return; }
        if (d.k === "sheet") {
          const p = proj(d.slug);
          dr.className = "wide";
          dr.innerHTML = `<div class="sheet"><aside class="side"><div style="display:flex;justify-content:space-between;align-items:center">${ptag(p.slug)}<button class="btn" data-act="closedrawer">${ICONS.x}Esc</button></div><h1>${esc(p.title)}</h1><div class="label">Problem</div><p style="font-size:13.5px;line-height:1.55;color:var(--ink-2);margin:6px 0 0">${rich(p.problem)}</p><div class="label" style="margin-top:16px">Solution</div><p style="font-size:13.5px;line-height:1.55;color:var(--ink-2);margin:6px 0 0">${rich(p.solution)}</p><div class="label" style="margin-top:16px">Last session · ${p.sessions[0] ? dayLabel(p.sessions[0].d) : "—"}</div><p style="font-size:13px;line-height:1.55;color:var(--ink-2);margin:6px 0 0">${p.sessions[0] ? rich(p.sessions[0].n) : ""}</p><div style="margin-top:18px"><span class="path mono muted" style="font-size:11.5px">ai/projects/${esc(p.slug)}/prd.md</span></div></aside><div class="main">${projectView(p.slug, { hl: state.sel && findItem(state.sel) && findItem(state.sel).id })}</div></div>`;
        } else { dr.className = ""; dr.innerHTML = issueDrawer(d.id); }
        requestAnimationFrame(() => { dr.classList.add("on"); sc.classList.add("on"); });
      }
      function render(keep) {
        const cur = PROTOS.find((p) => p.id === state.proto);
        $("switch").innerHTML = `<span class="logo"><i></i>Tracker Inbox</span><div class="tabs">${PROTOS.map((p, n) => `<button class="tab ${p.id === state.proto ? "on" : ""}" data-act="proto" data-p="${p.id}"><b>${n + 1}</b>${p.name}</button>`).join("")}</div><span class="pitch">${esc(cur.pitch)}</span><span class="kbd">1–5 · ⌘K</span>`;
        if (!state.sel && state.proto !== "threads") { const f = filtered()[0]; if (f) state.sel = f.k; }
        const sc = document.querySelector("[data-scroll]"); const top = keep && sc ? sc.scrollTop : 0;
        const bq = document.activeElement && document.activeElement.id === "bq";
        $("app").innerHTML = { classic, context, takeover, threads, peek }[state.proto]();
        const nsc = document.querySelector("[data-scroll]"); if (nsc) { nsc.scrollTop = top; nsc.addEventListener("scroll", onScroll, { passive: true }); }
        if (bq) { const b = $("bq") || document.querySelector("#drawer #bq"); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }
        renderDrawer(); renderPalette();
        queueMicrotask(onScroll);
      }
      let loading = false;
      function onScroll() {
        const sc = document.querySelector("[data-scroll]"); const m = sc && sc.querySelector("[data-more]");
        if (!m || loading) return;
        if (m.getBoundingClientRect().top < sc.getBoundingClientRect().bottom + 240) { loading = true; setTimeout(() => { state.days += 6; render(true); loading = false; }, 300); }
      }
      function setProto(id) { Object.assign(state, { proto: id, open: null, sel: null, slug: null, filter: "all", days: 8, drawer: null, tab: "board", q: "", who: "all", expanded: {} }); render(); }

      document.addEventListener("click", (ev) => {
        const pb = ev.target.closest("[data-pal]");
        if (pb) { const r = $("palette")._res[Number(pb.dataset.pal)]; state.pal.open = false; if (r.a === "prd") openPrd(r.slug); else state.drawer = { k: "issue", id: r.id }; render(true); return; }
        const t = ev.target.closest("[data-act]"); if (!t) return;
        const a = t.dataset.act;
        if (a === "palbg") { if (ev.target === t) { state.pal.open = false; renderPalette(); } return; }
        ev.stopPropagation();
        if (a === "proto") return setProto(t.dataset.p);
        if (a === "view") { state.filter = t.dataset.f; state.slug = null; state.open = null; state.sel = null; state.days = 8; render(); return; }
        if (a === "chip") { state.filter = t.dataset.f; state.sel = null; state.days = 8; if (state.proto !== "context") state.open = null; render(); return; }
        if (a === "railp") { if (state.proto === "threads") { state.open = t.dataset.slug; state.expanded = { [t.dataset.slug]: true }; state.tab = "board"; render(true); return; } state.slug = t.dataset.slug; state.filter = "all"; state.sel = null; state.days = 8; state.open = state.proto === "context" ? null : null; render(); return; }
        if (a === "sel") { state.sel = t.dataset.k; if (state.proto !== "context") state.open = null; else state.open = null; state.drawer = null; render(true); return; }
        if (a === "prd") { openPrd(t.dataset.slug); render(true); return; }
        if (a === "back") { state.open = null; render(true); return; }
        if (a === "issue") { if (state.drawer && state.drawer.k === "sheet") state._sheet = state.drawer; state.drawer = { k: "issue", id: t.dataset.id }; render(true); return; }
        if (a === "close" || a === "closedrawer") { closeDrawer(); render(true); return; }
        if (a === "tab") { state.tab = t.dataset.tab; render(true); return; }
        if (a === "who") { state.who = t.dataset.w; render(true); return; }
        if (a === "focus") { state.focusOpen = !state.focusOpen; render(true); return; }
        if (a === "thread") { const s = t.dataset.slug; if (state.open === s) state.expanded[s] = !(state.expanded[s] ?? true); else { state.open = s === "_" ? null : s; state.expanded[s] = true; state.tab = "board"; state.q = ""; state.who = "all"; } render(true); return; }
        if (a === "palette") { state.pal = { open: true, q: "", i: 0 }; renderPalette(); return; }
      });
      document.addEventListener("input", (ev) => {
        if (ev.target.id === "palq") { state.pal.q = ev.target.value; state.pal.i = 0; renderPalette(); }
        if (ev.target.id === "bq") { state.q = ev.target.value; render(true); }
      });
      document.addEventListener("keydown", (ev) => {
        if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); state.pal = { open: !state.pal.open, q: "", i: 0 }; renderPalette(); return; }
        if (state.pal.open) {
          const res = $("palette")._res || [];
          if (ev.key === "Escape") { state.pal.open = false; renderPalette(); }
          else if (ev.key === "ArrowDown") { ev.preventDefault(); state.pal.i = Math.min(res.length - 1, state.pal.i + 1); renderPalette(); }
          else if (ev.key === "ArrowUp") { ev.preventDefault(); state.pal.i = Math.max(0, state.pal.i - 1); renderPalette(); }
          else if (ev.key === "Enter" && res[state.pal.i]) { ev.preventDefault(); const r = res[state.pal.i]; state.pal.open = false; if (r.a === "prd") openPrd(r.slug); else state.drawer = { k: "issue", id: r.id }; render(true); }
          return;
        }
        if (ev.key === "Escape") { if (state.drawer) closeDrawer(); else if (state.open) state.open = null; render(true); return; }
        if (ev.target.tagName === "INPUT") return;
        if (ev.key === "Enter" && ev.target.closest && ev.target.closest(".card")) { ev.target.click(); return; }
        if (ev.key === "/") { ev.preventDefault(); state.pal = { open: true, q: "", i: 0 }; renderPalette(); return; }
        if (["j", "k", "ArrowDown", "ArrowUp"].includes(ev.key) && !state.drawer) {
          const list = filtered(); const idx = list.findIndex((e) => e.k === state.sel);
          const next = list[Math.max(0, Math.min(list.length - 1, idx + (ev.key === "j" || ev.key === "ArrowDown" ? 1 : -1)))];
          if (next) { ev.preventDefault(); state.sel = next.k; state.open = null; render(true); const el = document.querySelector(".item.on"); if (el) el.scrollIntoView({ block: "nearest" }); }
          return;
        }
        if (ev.key === "Enter" && state.sel && !state.drawer) { const e = findItem(state.sel); if (e && e.slug) { openPrd(e.slug); render(true); } return; }
        const n = Number(ev.key); if (n >= 1 && n <= 5) setProto(PROTOS[n - 1].id);
      });
      render();
    </script>
  </body>
