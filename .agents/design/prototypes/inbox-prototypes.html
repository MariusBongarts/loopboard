<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracker Inbox — five variants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: oklch(0.985 0.006 80);
        --bg-2: oklch(0.97 0.007 80);
        --bg-3: oklch(0.95 0.009 80);
        --line: oklch(0.9 0.01 75);
        --line-2: oklch(0.935 0.008 75);
        --ink: oklch(0.2 0.012 60);
        --ink-2: oklch(0.36 0.01 60);
        --ink-3: oklch(0.52 0.01 60);
        --ink-4: oklch(0.68 0.008 70);
        --ember: oklch(0.6 0.16 50);
        --ember-deep: oklch(0.53 0.16 48);
        --ember-soft: oklch(0.95 0.035 70);
        --blue: oklch(0.5 0.11 245);
        --blue-soft: oklch(0.95 0.025 245);
        --moss: oklch(0.55 0.1 150);
        --moss-soft: oklch(0.95 0.03 150);
        --rose: oklch(0.6 0.15 25);
        --rose-soft: oklch(0.95 0.03 25);
        --plum: oklch(0.52 0.13 320);
        --amber: oklch(0.64 0.13 78);
        --teal: oklch(0.56 0.09 195);
        --sans: "Geist", -apple-system, system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, Menlo, monospace;
        --top: 52px;
        --shadow: 0 1px 2px oklch(0.2 0.012 60 / 0.06), 0 8px 24px -12px oklch(0.2 0.012 60 / 0.18);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
      body { font-family: var(--sans); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
      button, input { font: inherit; color: inherit; }
      button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
      button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; border-radius: 6px; }
      .muted { color: var(--ink-3); }
      .mono { font-family: var(--mono); }
      .label { font-size: 11.5px; font-weight: 600; color: var(--ink-3); }

      #switch { height: var(--top); background: var(--ink); color: oklch(0.92 0.01 80); display: flex; align-items: center; gap: 16px; padding: 0 16px; position: relative; z-index: 50; }
      #switch .logo { font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
      #switch .logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--ember); display: inline-block; }
      #switch .tabs { display: flex; gap: 2px; background: oklch(0.27 0.012 60); padding: 3px; border-radius: 9px; }
      #switch .tab { padding: 5px 11px; border-radius: 7px; font-size: 13px; color: oklch(0.78 0.01 80); white-space: nowrap; }
      #switch .tab b { font-family: var(--mono); font-weight: 400; color: oklch(0.58 0.01 80); margin-right: 6px; font-size: 11px; }
      #switch .tab.on { background: var(--bg); color: var(--ink); }
      #switch .tab.on b { color: var(--ember-deep); }
      #switch .pitch { flex: 1; min-width: 0; font-size: 12.5px; color: oklch(0.75 0.01 80); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #switch .kbd { font-family: var(--mono); font-size: 11px; color: oklch(0.7 0.01 80); border: 1px solid oklch(0.36 0.01 60); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
      #app { height: calc(100vh - var(--top)); overflow: hidden; }

      /* layout */
      .shell { display: grid; height: 100%; min-height: 0; }
      .pane { min-width: 0; min-height: 0; overflow: auto; }
      .pane + .pane { border-left: 1px solid var(--line); }

      /* rail */
      .rail { background: var(--bg-2); padding: 12px 8px 24px; }
      .rail .search { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: var(--ink-3); margin-bottom: 10px; }
      .rail .search kbd { margin-left: auto; font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
      .rail .sec { padding: 14px 10px 5px; font-size: 11px; font-weight: 600; color: var(--ink-4); letter-spacing: 0.02em; }
      .nav { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 10px; border-radius: 7px; color: var(--ink-2); }
      .nav:hover { background: var(--bg-3); }
      .nav.on { background: var(--bg); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--line), 0 1px 2px oklch(0.2 0.012 60 / 0.05); }
      .nav svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--ink-3); }
      .nav .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .nav .n { margin-left: auto; font-size: 11.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 6px; }
      .nav .n.hot { background: var(--ember); color: white; border-radius: 999px; padding: 0 7px; font-weight: 600; }
      .sq { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }

      /* list */
      .list-h { position: sticky; top: 0; z-index: 3; background: oklch(0.985 0.006 80 / 0.92); backdrop-filter: blur(10px); padding: 14px 16px 10px; border-bottom: 1px solid var(--line-2); }
      .list-h .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .list-h h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
      .seg { display: inline-flex; padding: 2px; background: var(--bg-3); border-radius: 8px; gap: 2px; }
      .seg button { padding: 4px 10px; border-radius: 6px; font-size: 12.5px; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
      .seg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px oklch(0.2 0.012 60 / 0.1); }
      .filters { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      .fchip { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
      .fchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      .fchip b { font-weight: 500; opacity: 0.7; margin-left: 3px; }
      .day { position: sticky; top: var(--sticky, 88px); z-index: 2; background: var(--bg); padding: 12px 16px 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); display: flex; justify-content: space-between; }
      .day span:last-child { font-weight: 500; color: var(--ink-4); }
      .item { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 11px; width: 100%; padding: 10px 16px 10px 12px; border-bottom: 1px solid var(--line-2); align-items: start; }
      .item:hover { background: var(--bg-2); }
      .item.on { background: var(--ember-soft); }
      .item .unread { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; }
      .item .l1 { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); min-width: 0; }
      .item .l1 .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item .t { font-weight: 500; margin: 2px 0 2px; line-height: 1.35; color: var(--ink); }
      .item .x { color: var(--ink-3); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .item .tm { font-size: 11.5px; color: var(--ink-4); white-space: nowrap; padding-top: 1px; }
      .kind { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 5px; background: var(--bg-3); color: var(--ink-2); white-space: nowrap; }
      .more { padding: 18px 16px 30px; color: var(--ink-4); font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
      .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ember); animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* pills */
      .st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 1px 7px 1px 6px; border-radius: 999px; white-space: nowrap; }
      .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .st-todo { color: var(--ink-3); background: var(--bg-3); }
      .st-blocked { color: var(--rose); background: var(--rose-soft); }
      .st-progress { color: var(--blue); background: var(--blue-soft); }
      .st-review { color: var(--ember-deep); background: var(--ember-soft); }
      .st-done { color: var(--moss); background: var(--moss-soft); }
      .st-backlog { color: var(--ink-4); background: var(--bg-3); }
      .who { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 10px; font-weight: 700; flex: 0 0 auto; }
      .who.human { background: var(--ember-soft); color: var(--ember-deep); }
      .who.agent { background: var(--blue-soft); color: var(--blue); }
      .idl { font-family: var(--mono); font-size: 0.9em; color: var(--ember-deep); background: var(--ember-soft); padding: 0 4px; border-radius: 4px; white-space: nowrap; }
      .idl:hover { background: oklch(0.9 0.06 65); }
      .prd { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--ember-deep); white-space: nowrap; padding: 3px 8px 3px 6px; border-radius: 6px; background: var(--ember-soft); }
      .prd:hover { background: oklch(0.91 0.06 65); }
      .prd svg { width: 13px; height: 13px; }
      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 500; font-size: 12.5px; white-space: nowrap; }
      .btn:hover { border-color: var(--ink-4); }
      .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      .btn svg { width: 14px; height: 14px; }
      .bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--bg-3); }
      .bar i { display: block; height: 100%; }

      /* reader */
      .reader { background: var(--bg); }
      .rd { max-width: 780px; padding: 26px 34px 60px; }
      .rd-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--ink-3); }
      .rd h1 { margin: 12px 0 10px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
      .rd p { margin: 0 0 12px; color: var(--ink-2); font-size: 14.5px; line-height: 1.6; }
      .callout { margin: 18px 0; padding: 14px 16px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line-2); }
      .callout .h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .callout p { margin: 0; font-size: 14.5px; color: var(--ink); line-height: 1.55; }
      .ptag { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
      .ptag:hover { color: var(--ink); }

      /* project view */
      .pv { display: flex; flex-direction: column; min-height: 100%; }
      .pv-h { padding: 18px 24px 0; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 4; }
      .pv-h .r1 { display: flex; align-items: center; gap: 10px; }
      .pv-h h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
      .pv-h .meta { font-size: 12.5px; color: var(--ink-3); }
      .pv-h .sp { flex: 1; }
      .pv-focus { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--tone-soft); display: flex; gap: 10px; align-items: flex-start; }
      .pv-focus b { font-size: 11.5px; font-weight: 600; color: var(--tone); white-space: nowrap; padding-top: 1px; }
      .pv-focus p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink); display: -webkit-box; -webkit-line-clamp: var(--clamp, 2); -webkit-box-orient: vertical; overflow: hidden; }
      .pv-focus button.x { margin-left: auto; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
      .ptabs { display: flex; gap: 2px; margin-top: 12px; }
      .ptabs button { padding: 8px 10px; font-weight: 500; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
      .ptabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
      .ptabs button span { color: var(--ink-4); font-size: 11.5px; margin-left: 4px; font-variant-numeric: tabular-nums; }
      .pv-b { padding: 16px 24px 40px; flex: 1; }
      .bh { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
      .bh .sp { flex: 1; }
      .bsearch { border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; background: var(--bg); width: 200px; font-size: 12.5px; }
      .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(236px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
      .col { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px; min-height: 120px; }
      .col-h { display: flex; align-items: center; gap: 7px; padding: 4px 6px 10px; font-weight: 600; font-size: 12.5px; }
      .col-h .d { width: 8px; height: 8px; border-radius: 50%; }
      .col-h .n { margin-left: auto; font-weight: 500; color: var(--ink-4); font-size: 12px; }
      .card { display: block; width: 100%; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 10px 9px; margin-bottom: 7px; box-shadow: 0 1px 1px oklch(0.2 0.012 60 / 0.04); cursor: pointer; }
      .card:hover { border-color: var(--line); box-shadow: var(--shadow); }
      .card.hl { border-color: var(--ember); box-shadow: 0 0 0 3px oklch(0.6 0.16 50 / 0.18); }
      .card .c1 { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-4); }
      .card .c1 .cat { margin-left: auto; }
      .card .t { font-size: 13px; font-weight: 500; line-height: 1.38; margin-top: 4px; color: var(--ink); }
      .col .rest { font-size: 12px; color: var(--ink-3); padding: 4px 6px; }
      .empty { font-size: 12px; color: var(--ink-4); padding: 10px 6px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
      .prd-doc { max-width: 720px; }
      .prd-doc h3 { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 22px 0 6px; }
      .prd-doc h3:first-child { margin-top: 4px; }
      .prd-doc p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }
      .prd-doc .path { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
      .log { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-2); }
      .log .d { font-size: 12px; color: var(--ink-3); font-weight: 500; }
      .log p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }

      /* threads (P4) */
      .thread { border-bottom: 1px solid var(--line); }
      .thread-h { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; width: 100%; padding: 12px 16px 12px 14px; align-items: start; }
      .thread-h:hover { background: var(--bg-2); }
      .thread.on .thread-h { background: var(--ember-soft); }
      .thread-h .nm { font-weight: 600; font-size: 14px; }
      .thread-h .x { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .thread-h .meta { display: flex; gap: 8px; margin-top: 7px; align-items: center; flex-wrap: wrap; }
      .thread-items { padding: 0 0 8px 34px; }
      .titem { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; width: 100%; padding: 6px 16px 6px 0; font-size: 12.5px; }
      .titem:hover .tt { color: var(--ember-deep); }
      .titem .dd { color: var(--ink-4); }
      .titem .tt { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .count { font-size: 11.5px; color: var(--ink-3); background: var(--bg-3); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }

      /* peek (P5) */
      .dense .item { grid-template-columns: 8px 190px minmax(0, 1fr) 110px 70px; align-items: center; padding: 8px 16px 8px 12px; }
      .dense .item .unread { margin-top: 0; }
      .dense .item .t { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dense .item .x { -webkit-line-clamp: 1; }
      .dense .hint { font-size: 12px; color: var(--ink-4); display: flex; gap: 12px; }
      .dense .hint kbd { font-family: var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }

      /* sheet + drawer */
      #scrim { position: fixed; inset: var(--top) 0 0 0; background: oklch(0.2 0.012 60 / 0.22); opacity: 0; pointer-events: none; transition: opacity 0.18s; z-index: 30; }
      #scrim.on { opacity: 1; pointer-events: auto; }
      #drawer { position: fixed; top: var(--top); right: 0; bottom: 0; width: min(520px, 100vw); background: var(--bg); z-index: 32; transform: translateX(103%); transition: transform 0.2s cubic-bezier(0.2, 0.7, 0.2, 1); overflow: auto; box-shadow: -24px 0 48px -24px oklch(0.2 0.012 60 / 0.35); }
      #drawer.on { transform: none; }
      #drawer.wide { width: min(1320px, 94vw); }
      .dr { padding: 22px 28px 50px; }
      .dr h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3; margin: 12px 0 10px; }
      .sheet { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 100%; }
      .sheet .side { background: var(--bg-2); border-right: 1px solid var(--line); padding: 22px 22px 40px; }
      .sheet .side h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; margin: 10px 0 12px; }
      .sheet .main { min-width: 0; }

      #palette { position: fixed; inset: 0; z-index: 60; display: none; place-items: start center; padding-top: 13vh; background: oklch(0.2 0.012 60 / 0.28); }
      #palette.on { display: grid; }
      .pal { width: min(620px, 92vw); background: var(--bg); border-radius: 14px; box-shadow: 0 40px 80px -30px oklch(0.2 0.012 60 / 0.5); overflow: hidden; }
      .pal input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 16px 18px; font-size: 16px; outline: none; }
      .pal .res { max-height: 54vh; overflow: auto; padding: 6px; }
      .pal .g { padding: 10px 12px 4px; font-size: 11px; font-weight: 600; color: var(--ink-4); }
      .pal .it { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 8px 12px; border-radius: 8px; }
      .pal .it.sel, .pal .it:hover { background: var(--bg-2); }
      .pal .it small { color: var(--ink-3); font-size: 12px; }
      .pal .foot { display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-3); }
    </style>
  </head>
  <body>
    <header id="switch"></header>
    <main id="app"></main>
    <div id="scrim" data-act="close"></div>
    <aside id="drawer"></aside>
    <div id="palette" data-act="palbg"></div>
    <script>
      const DATA = {"projects":[{"slug":"40-selective-blog-and-docs-i18n","title":"Selective blog and docs localization","status":"active","last":"2026-09-23","focus":"PRD drafted from the 2026-09-22 decision brief. Sequencing is locked: the next session improves the four existing localized pages and records baselines. Blog routing waits until that pass is in review. No issues filed yet. The open call is what \"improved\" means for those four pages, because they are not the same kind of gap.","problem":"People already find Web Highlights through searches in their own language, and a handful of localized tutorials and tools earn those visits. The blog and the product docs do not. A reader in Brazil or Japan who is comparing bookmark managers, reader modes, or PDF highlighters lands on an English article, and a customer who needs to install the product or highlight a PDF opens English documentation.","solution":"A reader in Brazilian Portuguese or Japanese can open a small set of comparison articles written for the search they actually typed, on a URL in their language, linked to the English original and to any other language that really exists. A Brazilian customer can install the product and highlight a webpage or a PDF by following documentation in Portuguese.","sessions":[{"d":"2026-09-23","n":"PRD and WIP opened from the decision brief. No product code. Issues not filed."}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":0,"done":0}},{"slug":"07-keyword-analysis","title":"Keyword Analysis","status":"active","last":"2026-09-22","focus":"New (2026-07-22): competitive-landscape research pass (OpenSEO) mapped the core highlighter/annotation and bookmark/read-later markets and ran a Raindrop deep dive — reports in ai/seo/competitors/ (core landscape, learning cluster, 260722-raindrop-deep-dive.md).","problem":"Web Highlights has hundreds of organic keywords across docs, blog, and programmatic SEO pages, but the analysis work is reactive and lives in scattered markdown files. Cycle insights, position regressions, and content opportunities are not anchored to a single source of truth, so decisions about _what to write next_ drift away from measurable opportunity and key regressions can sit un-investigated for weeks.","solution":"A repeatable bi-weekly analysis cycle anchored to one living roadmap. After each cycle the maintainer sees, in one place: new keyword opportunities scored by potential, regressions flagged for audit, and a prioritized content backlog with target volumes. Past cycles remain visible as archived issues so the institutional record is complete.","sessions":[{"d":"2026-09-22","n":"[[0167]] closed as wontfix. The live US SERP for export bookmarks chrome has an AI Overview at rank 1 and Google Chrome Support's exact export guide as the first organic result (rank 2), with another Google Support result at rank 9."},{"d":"2026-09-21","n":"Shipped the five Tier-1 issues from cycle 260921 in one pass: [[0868]] (vpn extension search title/description), [[0867]] (six authority links + a three-page holdout), [[0869]] (pdf highlighter ownership + welcome-page noindex), [[0703]] (bookmark-guide titles…"},{"d":"2026-09-04","n":"Cycle ran against ai/data/seo/260904-ahrefs.csv vs. ai/data/seo/260803-ahrefs.csv (32-day interval). 378 keywords tracked (−58), 49 Ahrefs #1s (−42); on-strategy 338 / 42, listicle feeders 40 / 7. Draft at _drafts/260904-keyword-analysis.md."},{"d":"2026-08-03","n":"Cycle ran against ai/data/seo/260803-ahrefs.csv vs. ai/data/seo/260728-ahrefs.csv (6-day interval). 436 keywords tracked (−11), 91 #1s (−9); on-strategy 365 / 69 (was 379 / 78). Draft at _drafts/260803-keyword-analysis.md."},{"d":"2026-07-28","n":"Corpus audit found ~35 articles asserting limitations we removed. Batch 1 fixed 10 (8 folder Cons bullets + the phantom CSV export) — [[0353]], in-review."},{"d":"2026-07-22","n":"[[0157]] implemented as an evergreen refresh of the ranking pocket-shutdown article (Marius's call — keeps URL authority): past tense, export-window-closed answer + saved-export-file import wedge, 10 tools re-verified alive (Matter/Recall live-fetched), read-l…"},{"d":"2026-07-21","n":"Two programmatic tutorials under /tutorials/pdf-web-highlighter/: export (multi-method: notebook one-click / My Clippings / Amazon email export → PDF/Markdown/Notion) and see-your-highlights (3 storage places → one searchable place)."},{"d":"2026-07-12","n":"Cycle ran against ai/data/seo/260712-ahrefs.csv vs. ai/data/seo/260611-ahrefs.csv (31-day interval). 444 keywords tracked (+39 vs. previous); #1 positions 47→97, top-10 338→394."}],"c":{"backlog":0,"todo":10,"blocked":0,"progress":1,"review":25,"done":3}},{"slug":"22-flashcards-learning-hub","title":"Flashcards & Learning Hub","status":"active","last":"2026-09-22","focus":"2026-09-20 — library scale-up (phase 7): [[0838]] holds the SEO potential analysis (37 deck families × 5 markets, book-library deep-dive, traffic model, app + website library proposals) and the map of 16 follow-up candidates. Decisions are recorded (both pillars at full speed, school literature as a pillar, create-now / publish-on-schedule, website + app on one API); next step is slicing F0–F16.","problem":"Learning sessions today only replay raw highlights and ask \"Know it\" / \"Don't know\" — a learner can never practice real active recall with a question, can't add knowledge that wasn't highlighted on some page, and can't control which highlights a session draws from, so the dashboard feels messy and sessions feel shallow.","solution":"A learner can turn any highlight into a true Q/A flashcard right inside the session: cards with a question show the question first, flip to the answer with a 3D animation, and are graded with \"Correct\" / \"Incorrect\" (plain highlights keep \"Know it\" / \"Don't know\"). From the learning dashboard they can create standalone flashcards into a default \"Flashcards\" deck or into named decks they create themselves (e.g.","sessions":[{"d":"2026-09-22","n":"Maintainer verified and closed [[0870]], [[0872]] and [[0873]] (his failed-spec Cypress rerun is green against 563b5421c, which already carried the fixture + spec fixes), plus the content wave [[0854]]– [[0858]] — those ship themselves on 2026-09-28 / 2026-10-…"},{"d":"2026-09-21","n":"[[0854]], [[0855]], [[0856]], [[0857]], [[0858]]: pt-br authored across all five issues via a background agent — literatura- brasileira (Dom Casmurro + O Cortiço, both PD-verified, 80 cards), ingles (irregulares + falsos-cognatos, 72 cards), 2 new ditados/cara…"},{"d":"2026-09-20","n":"[[0847]], [[0849]], [[0851]], [[0852]], [[0850]]: the publishAt gate, the app gallery's language bug, registry pagination, leaf-page retirement, and the auto-discovery/fact-check pipeline are all shipped and verified (full test/tsc/i18n/prettier gate green, li…"},{"d":"2026-07-20","n":"[[0276]]: standalone page notes now carry the Create-flashcard toolbar button (answer prefills from the note text) and the on-page popup toolbox gained the same brain button (existing slot before delete;"},{"d":"2026-07-19","n":"[[0275]]: deck bars now render the configured slots + ✎ like every bookmark, prepended by fixed extras (primary Start learning, Edit flashcards) with start-learning/flashcards slots deduped;"},{"d":"2026-07-17","n":"[[0273]]: chunked map-reduce generation — the source is split into ~4000-token sections (splitIntoTokenChunks) and cards are spread across them (distributeCardsAcrossChunks, sampled end-to-end when chunks > cards), a session per chunk with the dedup list carri…"},{"d":"2026-07-15","n":"[[0271]]: all 12 articles for the flashcard/learning cluster drafted in ai/blog/content/drafts/ (+ status files), verified (blacklist, echo, HTML, SEO lengths, links) and flipped in-review."},{"d":"2026-07-14","n":"[[0269]]: deep branch review (9 finder angles → adversarial verify) confirmed 22 findings; the top 10 fixed in one slice (free-plan filter bypass, quick-actions read ":65}},{"slug":"29-android-app-release","title":"Android App Release (Google Play)","status":"active","last":"2026-09-21","focus":"Phase 0 + Phase 1 in parallel. The maintainer starts the three human tickets that gate everything — the Play developer account ([[0481]]), the upload keystore ([[0482]]) and Firebase Pass 1 ([[0454]]) — while an agent builds the release pipeline ([[0483]]).","problem":"The Android app exists, but nobody can install it: it is not on Google Play, and the maintainer has never published a Play Store app. Even sideloaded, a person cannot sign in with Google (the WebView pops a blocked window or escapes to the system browser), cannot upgrade (the Paddle overlay does not run inside the WebView), and links to app.web-highlights.com do not open the app.","solution":"Web Highlights is listed on Google Play as \"Web Highlights\" by Web Highlights GmbH. A person installs it, signs in with Google or email, shares pages into it, highlights and reads, and — on the free plan — upgrades in their browser and returns to the app already premium. Links to the web app open the app.","sessions":[{"d":"2026-09-21","n":"Go-live run, guided: release 12 (1.0.0) on Internal testing and on the phone (11 was burned by a draft upload) — [[0484]]; reviewer account seeded (10 pages / 3 collections, PDF, deck), first login unblocked → in-review — [[0494]]."},{"d":"2026-09-15","n":"Ultimate benefits panel rebuilt: each slide now lists the PLAN_FEATURES it unlocks as a scannable two-column grid (tooltip + docs link, no new strings to translate), sync promoted to slide 2, the pictures are the Chrome Web Store tiles' devices on a transparen…"},{"d":"2026-09-13","n":"Release 10 built and rebuilt (18:46, awaiting upload — [[0484]]); signed-out emulator pre-pass: capture browser de + ja and ProfitWell rows ticked ([[0728]], [[0488]]); landscape sign-in footer under the gesture bar fixed ([[0729]]);"},{"d":"2026-09-11","n":"Bottom edge of edge-to-edge fixed (learning session, to customer value, paid acquisition is ~5–15× underwater and selling ads against the audience is uneconomical — the business cannot buy growth. At the same time, the largest revenue stream is not subscriptions at all: the GiveFreely affiliate SDK earned $6,018 in Aug 2026 (all-time high, +125% vs.","solution":"A numbers-driven strategy decision, delivered as a pitch deck (running HTML document) that models every credible direction — the AI Workspace, other high-tier products, and base-price changes — with forecasts grounded in owned data (ProfitWell, Paddle, reviews, feedback CSVs) and market evidence (competitor pricing, documented price-increase and credit-model outcomes).","sessions":[{"d":"2026-09-18","n":"[[0681]] → in-review: new prices entered in Paddle on the announced day and verified, 0 differences across 180 prices (yarn pricing:verify --direct); the check caught two typos and an unsaved plan first."},{"d":"2026-09-17","n":"[[0828]] filed + built → in-review (founder: \"one document in the repo we copy prices from, synced, with history\"): ai/pricing/ price book effective Sep 18, history baseline captured from live Paddle, generated copy-from view, changelog;"},{"d":"2026-09-02","n":"[[0697]] filed + implemented → in-review (founder: \"add a notification for non paying users\"): the notifications centre now shows the lock-in notice, driven by the same /config announcement as the pricing banner (new notifications surface, one kill switch), co…"},{"d":"2026-09-01","n":"[[0682]] founder prod-verified the targeting + moved last call to Thu Sep 10; deadlineMap renamed to what it is (signup cutoffs, now in campaign-audience.ts, spec-covered) and the last call cut off at its own window start — late-window signups get exactly one…"},{"d":"2026-08-31","n":"T locked = Oct 1: EN campaign emails drafted (campaign/emails-en.md), lifetime rescaled to €149.99 (+25%), BF40 confirmed first-period-only, [[0683]]/[[0684]]/[[0685]] filed, Workspace + Sync Studio mockups added to deck (§07)."}],"c":{"backlog":1,"todo":0,"blocked":0,"progress":2,"review":13,"done":2}},{"slug":"32-website-multi-language","title":"Multi-Language","status":"unknown","last":"2026-09-15","focus":"[[0720]] landed 2026-09-09 → in-review: /support localized into the full roster, reversing [[0486]]'s English-only exclusion — the copy moved into the page-copy pipeline and every link resolves through useLocalizedNav, so D5 holds by construction. Four independent review roles plus role A in rounds 2 and 3 (the cap); the corpus evidence changed two page names (es Soporte → Ayuda, zh-CN 支持 → 帮助). Four follow-ups filed: [[0721]] [[0722]] [[0723]] [[0724]].","problem":"Most people who use Web Highlights do not read English as a first language, but web-highlights.com speaks English on every page except one. Project 27 localized the Learning Hub into German, Spanish and Brazilian Portuguese and stopped there on purpose — the rest of the site had no locale infrastructure worth the risk.","solution":"A reader arriving in German, Spanish or Brazilian Portuguese finds the site in their language: the homepage, the free tools, the extension and install pages, the guides, the FAQ, the use-case hub and the integrations pages all read natively, with search-engine metadata written for what people actually search in that market rather than translated from English.","sessions":[{"d":"2026-09-15","n":"zh-cn 账户 → 账号 everywhere; ko/ja/pt-br \"sign up\" in its create-account sense → the pinned 계정 만들기 / アカウントを作成 (ja \"Sign up with Google\" = 「Google で登録」, exception recorded in ja.md) / criar conta; pt-br and vi show verb; ko 을 particle and 해요체 fixes."},{"d":"2026-09-02","n":"The i18n watch build never re-emitted dist/catalog-assets, so hosts copied pre-merge JSON and the Capacities settings section threw on its first new key."},{"d":"2026-08-28","n":"Phase-7 batch landed in one session: [[0553]] (listing source reconciled onto project 36's ai/seo/store/listings/, product-keyed, pins + gates, deos follow.","problem":"Web Highlights has no independent video coverage and only a handful of hand-made videos, because recording a tutorial by hand takes hours and never happens alongside product work. Every feature page in the user documentation is a keyword-rich video that does not exist, and the founder has no overview of which videos exist, which are planned, and which are published on YouTube.","solution":"Every VitePress documentation page (features first, SEO tutorials later) gets a tutorial video generated from a storyboard: the built extension is driven by Playwright as the demo user on our own pages, composed with title, close-ups, captions (later narration) in Remotion, and rendered to mp4 unattended.","sessions":[{"d":"2026-09-14","n":"Project opened from the [[0776]] → [[0779]] → [[0780]] thread; PRD records the existing recorder/composition and locks registry, library, roadmap-from-docs-nav, Remotion stills and manual publishing."}],"c":{"backlog":1,"todo":0,"blocked":0,"progress":0,"review":0,"done":33}},{"slug":"28-idiom-taxonomy-and-direction","title":"Proverbs, Idioms & Card Direction","status":"active","last":"2026-09-08","focus":"All issues are implemented and awaiting maintainer review. The German hub carries two subjects — Sprichwörter (5 categories / 16 levels / 192 cards) and Redewendungen (4 / 12 / 162) — card direction is a page view rather than a taxonomy axis, and 11 high-demand proverbs have their own page.","problem":"The German idiom subject shipped in project 27 was built in a single pass around one axis — which way a card is asked. Everything that did not fit that axis ended up hidden or in the wrong place: proverbs and idioms share a subject although they are different things learned differently, the example sentence a learner needs never reaches the flashcard, and the language selector offers languages that do not have the deck in front of you.","solution":"A reader looking for proverbs and a reader looking for idioms land on their own hub, each with categories named after what the entries actually are — the funny ones, the typically German ones, the ones you quote to make a point. Which way a card is asked stops being a property of where it lives and becomes something the reader chooses on the page.","sessions":[{"d":"2026-09-08","n":"[[0716]] implemented → in-review: [[0472]]'s CTA default reversed every deck, not just the pair decks it was designed for, so quiz decks were practised inverted (\"Brazil\" → \"Which country has this flag? 🇧🇷\"). Card format is now declared per category."},{"d":"2026-08-18","n":"[[0475]] implemented → in-review as an opt-in tier: a card earns a page only by carrying real depth, so 11 pages shipped rather than 354 thin ones."}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":8,"done":2}},{"slug":"37-capacities-api-v1-migration","title":"Capacities API v1 Migration","status":"active","last":"2026-09-02","focus":"Blocker cleared 2026-09-02. Steffen sent the public PKCE client capacities_api_webhighlights (redirects https://app.web-highlights.com/oauth/capacities","problem":"Capacities is replacing its beta API with API v1 and shuts the beta API down on 2026-09-01. Our \"Export to Capacities\" integration is built entirely on beta-only surface: a personal API token the user pastes into settings, an HMAC-signed hidden import endpoint, and server-side duplicate detection. After the shutdown every export fails and every connected user is silently broken.","solution":"Users connect Capacities with one click via OAuth — no more copying a personal token. The token is bound to the Capacities space the user picks on the Capacities authorize page. Exports keep working exactly as before from the user's point of view: first export creates the weblink with all highlights, later exports append only the new highlights (no duplicates), notes travel with their highlight, colors match.","sessions":[{"d":"2026-09-02","n":"Steffen's email: client_id capacities_api_webhighlights, public client, PKCE only, redirects prod + http://localhost:5173/oauth/capacities, scopes api:read api:write offline_access, resource https://api.capacities.io."},{"d":"2026-08-30","n":"Merged claude/frosty-chandrasekhar-f4841b (cut 2026-06-10) into main. Nine conflicting files; four needed real re-integration rather than a side pick: - Ids renumbered."}],"c":{"backlog":0,"todo":0,"blocked":1,"progress":0,"review":5,"done":0}},{"slug":"36-store-listing-aso","title":"Store Listing ASO","status":"active","last":"2026-08-28","focus":"All four issues are in-review — the pipeline is live end to end. The store holds 132 keyword rows across 7 backfilled cycles (260604–260827), the Internal Hub renders it at /internal/seo/store, and the first analysis sits in the Reports library. Nothing is blocked.","problem":"Roughly 200k of our ~220k users arrive through a store listing, yet nothing in the repo measures how those listings perform. We track 436 Google keywords across eight cycles and can say exactly what moved and why; for the Chrome, Edge and Firefox listings we have no keyword list, no history, and no way to tell whether a description edit helped or hurt.","solution":"A store-side sibling of the web SEO cycle. Every two weeks, in the same sitting as keyword-analysis, we capture where each listing ranks for every keyword the store associates with it, diff it against the previous cycle, and read the result as a sortable table with sparklines in the Internal Hub. Listing copy lives in the repo, so a rank move points at a specific, dated copy change rather than at a guess.","sessions":[{"d":"2026-08-28","n":"Project 32's store-listing slice ([[0553]]–[[0556]]) landed on top of this project's data store: listings moved to listings/<product>/<store>.<locale>.md (reader + youtube-highlighter captured;"},{"d":"2026-08-27","n":"Project opened from a /grill session — 15 decisions locked in prd.md, incl. keyword rank (not installs) as the KPI, REST over MCP, the rank: 0 sentinel, and the protected-keyword edit guard."}],"c":{"backlog":1,"todo":0,"blocked":0,"progress":1,"review":5,"done":0}},{"slug":"35-self-served-ads","title":"Self-Served Ads & First-Party Analytics","status":"active","last":"2026-08-24","focus":"The PRD is drafted, every decision is locked (grilling session 2026-08-24, 16 decisions — see the PRD's \"Implementation decisions\" and analysis/technical-design.md for the file-level contract), and the work is cut into 14 issues below. Nothing is blocked.","problem":"The recommendation feed built in project 04 works end-to-end — cards render on three surfaces, plan gating and the kill switch are solid — but it has been dark in production since 2026-07-29 and the vendor relationship behind it is over: the revenue never materialised, and what did arrive came through an opaque middleman on a 70/30 split. So the free cohort (~234k of ~260k users) once again generates nothing, while fully-built serving, rendering and gating machinery sits unused.","solution":"Web Highlights becomes its own ad network for its own surfaces. Recommendation cards keep looking and behaving exactly as they do today, but the content comes from a catalogue the maintainer controls, and every view and click is counted by Web Highlights itself instead of a third party. Nothing about who sees ads changes: free, expired and signed-out users see them; every paid plan and the active trial stay ad-free;","sessions":[{"d":"2026-08-24","n":"Project opened. PRD drafted from a /grill-with-docs session (16 decisions locked: vendor removal, own catalogue, unchanged wire contract, ads as code, cadence + catalogue order, direct click targets, daily dimensional counters with cache-side reach estimation,…"}],"c":{"backlog":1,"todo":1,"blocked":0,"progress":0,"review":11,"done":1}},{"slug":"33-shared-lib-bundle","title":"shared-lib Bundle — Break the Barrel Cycle","status":"active","last":"2026-08-20","focus":"Shipped in Release 13.0.37 (main ddc2c54ae); every gate is now green. Cypress passed (maintainer), Playwright passed 5/5 against the real built extension, and the corrections plus ADR 0015 have landed.","problem":"Importing a single string constant from @webhighlights/shared-lib costs 604 KB (162 KB gzipped) and pulls in 136 modules. Importing the entire use-case article corpus costs 500 bytes more. Tree-shaking against this package is not partially working — it is off, and every consumer pays the full price on every page: the website, the web app, and the extension.","solution":"A consumer that imports one symbol gets one symbol. import { CONSTANTS } costs kilobytes instead of hundreds of them; a page that never shows a blog card never downloads 134 blog cards; test fixtures stop shipping to users entirely. The import line every consumer writes today keeps working unchanged — the package simply stops handing over its whole contents with every request.","sessions":[{"d":"2026-08-20","n":"Shipped in Release 13.0.37 (ddc2c54ae) after a green Cypress run by the maintainer."},{"d":"2026-08-19","n":"Project opened. Root cause traced to packages/shared-lib/src/actions/index.ts:1 importing from '..' — the package's own barrel — via url-helper -> actions -> index.ts. 19 files carry the same pattern; several import only types."}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":0,"done":4}},{"slug":"27-website-i18n-learning-hub","title":"Website i18n — Learning Hub First","status":"active","last":"2026-08-19","focus":"All issues are implemented and awaiting maintainer review. The hub is live in four languages — English unprefixed at /learning, plus /de/learning, /es/learning and /pt-br/learning — with counterpart-driven hreflang, a deck language selector, browser-language routing, per-locale sitemap entries, and no deck data in the client bundle.","problem":"Most people who use Web Highlights do not read English as a first language, but every page on web-highlights.com is English-only. A German, Spanish or Brazilian visitor who searches for the very thing the Learning Hub already offers — a ready-made flags or capitals deck — never finds us, because the page that would answer them does not exist in their language. The decks themselves are already tagged with a language they cannot yet vary.","solution":"The website serves four locales. English keeps every URL it has today; German, Spanish and Brazilian Portuguese get their own prefixed, fully localized Learning Hub with native URLs, native copy, and search-engine signals that correctly describe which pages do and do not have a counterpart in another language.","sessions":[{"d":"2026-08-19","n":"Maintainer reported landing on /de with a German navbar over the English homepage. Root cause was the i18n module's redirectOn: 'root' plus the locale root sitting in the allowlist — fixed structurally so a prefix exists only where the page is localized, and t…"},{"d":"2026-08-18","n":"Project opened from a grill-with-docs session. Locales, scope, URL shape, content split, Sprichwörter structure and the legal-page exception locked as D1–D12 in the PRD; issues [[0459]]–[[0464]] filed."}],"c":{"backlog":0,"todo":1,"blocked":0,"progress":0,"review":8,"done":0}},{"slug":"30-ios-app-release","title":"iOS App Release (App Store)","status":"paused","last":"2026-08-18","focus":"Paused until the Android app is in production (project 29). The single active task is the maintainer's Apple Developer Program enrolment ([[0505]]) — it takes days–weeks and needs the same D-U-N-S number as the Play account, so it starts now. When project 29 reaches Phase 5, flip this project to in-progress and pick [[0381]].","problem":"Web Highlights has no iOS app. iPhone and iPad readers cannot capture, highlight or read on their device beyond the mobile web app, and the product is invisible in the App Store. The Capacitor iOS platform has never been added, and Apple's review is stricter than Google's on payments (Guideline 3.1), sign-in (Guideline 4.8 — Sign in with Apple when other third-party logins exist), minimum functionality (Guideline 4.2) and privacy (privacy manifest, nutrition labels, DSA trader status).","solution":"Web Highlights is listed on the App Store as \"Web Highlights\" by Web Highlights GmbH with the same capture / highlight / reader / learning experience as Android: share a URL or text from any app, capture it in the in-app browser, highlight in the reader, sync everywhere. Sign-in offers Google (native) and Sign in with Apple. Payment UI is hidden on iOS at launch (login-only app;","sessions":[{"d":"2026-08-18","n":"Project opened (paused). Split out of project 21 during its close-out; [[0381]]–[[0383]] migrated unchanged, [[0505]]–[[0513]] filed. Only [[0505]] (Apple enrolment) is scheduled now."}],"c":{"backlog":2,"todo":10,"blocked":0,"progress":0,"review":0,"done":0}},{"slug":"31-mobile-ux-polish","title":"Mobile UX Polish","status":"active","last":"2026-08-18","focus":"Low priority by design — pick from here between release phases of project 29. Suggested first pick: [[0452]] (sheet dialog contract) right after project 29's [[0451]] lands, because both touch BottomSheetController; then [[0514]] so the mobile suite is trustworthy before the store QA sweep leans on it.","problem":"The mobile app's touch UI shipped fast (Phase 3/3b of project 21) and the deep branch review ([[0446]]) left a known list of rough edges: bottom sheets that declare role=\"dialog\" without honouring focus/Escape, sheet rows drifting across four components, page-note seams that touch users cannot reach, a capture flow that struggles with multi-megabyte or shadow-DOM pages, a mobile Playwright suite that asserts less than it appears to, and a capture-browser bridge that is injected more broadly than it needs to be.","solution":"Each item is a small, independently verifiable slice against the mobile spec (§ 13) or the shared bottom-sheet contract; the maintainer picks them up between release phases or delegates them to an agent when a device-QA round is running anyway.","sessions":[{"d":"2026-08-18","n":"Project opened during the project-21 close-out. [[0380]], [[0425]], [[0452]], [[0453]] re-homed from project 21 (statuses kept; [[0425]]/[[0453]] sent to backlog); [[0514]]–[[0517]] filed from [[0446]]'s \"smaller open items\" list."}],"c":{"backlog":5,"todo":4,"blocked":0,"progress":0,"review":0,"done":0}},{"slug":"26-server-legacy-schema-decommission","title":"Server legacy-schema decommission","status":"paused","last":"2026-08-13","focus":"Nothing in flight. The project is parked until project 21 (mobile app) ships. The PRD's inventory is verified as of 2026-08-13; re-verify at kickoff (the @deprecated blocks move rarely, but the migration-state distribution in prod only moves in one direction, so the Phase-1 numbers can only get better).","problem":"The server tells two persistence stories at once. Since v12 (\"action-based sync\") every syncable user entity lives in the actions event log, but the pre-v12 per-entity collections, schemas, CRUD helpers and /sync endpoints are still in the tree — deprecated, yet indistinguishable from live code at a glance.","solution":"One persistence story. The legacy layer is first *measured* (how many users are still un-migrated, how much old-client traffic still hits /sync), then *drained* (server-side batch migration for stragglers, so correctness no longer depends on a user happening to log in), and finally *deleted* — deprecated methods, entity schemas, migration machinery, legacy collections, and the /sync endpoints — each behind its own ev…","sessions":[{"d":"2026-08-13","n":"Project filed from the [[0446]] persistence correction. Maintainer caught the review treating bookmark.schema.ts as live; deep verification confirmed all entity reads/writes (incl."}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":0,"done":0}},{"slug":"25-internal-hub-seo-dashboard","title":"Internal Hub + SEO Dashboard","status":"active","last":"2026-07-29","focus":"Phase 4: the Content & Publish Queue page showed the same drafts twice (queue + inventory tab) and could not show or set a thumbnail. [[0359]]–[[0363]] merge it into one slug-joined content console and make it a write surface for draft metadata, article SEO fields and thumbnails.","problem":"Since project 24 the blog lives in the repo, so SEO work (keyword research, article updates, internal linking) happens directly in the codebase — but the SEO *state* is scattered: a 105 KB markdown roadmap tracker, six Ahrefs CSV snapshots, free-form .status.txt sidecars (keyword info in only 33 of 51, in two incompatible formats), link-report JSON, and prose reports spread over ai/seo/.","solution":"A dev-only Internal Hub served by the Nuxt website at localhost:2000/internal — a Tailwind-styled operations hub with a sidebar — whose first resident is the SEO Dashboard: the single source of truth for keyword tracking, content inventory + publish queue, the internal-link graph, past analyses, and Search Console snapshots.","sessions":[{"d":"2026-07-29","n":"Phase 4 opened: [[0359]]–[[0363]] filed after a duplication review of /internal/seo/content (queue and drafts tab render the same slugs)."},{"d":"2026-07-28","n":"Project kicked off from a /grill-with-docs session (decisions locked in the PRD); issues [[0339]]–[[0346]] filed."}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":15,"done":0}},{"slug":"24-blog-serve-from-nuxt","title":"Serve the blog from Nuxt, retire Ghost CMS","status":"active","last":"2026-07-27","focus":"LIVE IN PRODUCTION (2026-07-28): web-highlights.com/blog is served by Nuxt — Ghost no longer serves readers. Both cutovers (pre [[0320]], prod [[0321]]) rehearsed + gated: parity 203/0, cypress 11/11, visual sweep 134 pages / 0 real breakages, llms.txt live at the root. Ghost idles on :2368 (instant rollback until decommission). Remaining: Marius verifies the in-review stack → done + archive; watch GSC Sitemaps/Coverage for a few days;","problem":"The blog at web-highlights.com/blog is served by a self-hosted Ghost CMS that must be maintained (updates, backups, a MySQL instance, a systemd service) while the repo only holds a read-only mirror of its content. Every AI-assisted article edit has to be manually pasted back into the Ghost admin, and a routine re-fetch has already overwritten pending local edits once. The content that drives a major organic-traffic channel is effectively owned by a database on a droplet, not by version control.","solution":"The Nuxt website serves the entire blog itself from content that lives in the repo. ai/blog/content/ becomes the single source of truth: articles, pages, metadata, and images are versioned files that agents edit directly, and publishing is an ordinary merge + deploy.","sessions":[{"d":"2026-07-27","n":"Project kicked off from the grill-with-docs planning session: PRD drafted, issues [[0308]]–[[0323]] filed, glossary terms + ADR 0008 + architecture topology documented."}],"c":{"backlog":0,"todo":1,"blocked":1,"progress":0,"review":28,"done":0}},{"slug":"23-feature-voting-board","title":"Feature Voting Board","status":"active","last":"2026-07-22","focus":"All four issues implemented in one session (2026-07-21) and flipped to in-review — Marius verifies (seed wording/statuses, the generated FEATURE_VOTE_IP_HASH_SALT in production.env, privacy-policy line) and flips to done, then the ship gate runs. Detail lives in each issue's ## Memory.","problem":"Web Highlights users keep asking for features — in support emails, uninstall surveys, upgrade surveys, and store reviews — but there is no public place where they can see what has already been asked, add their own +1, or learn whether it will ever be built. For Marius (solo maintainer), the same wishes arrive again and again across channels, each gets a one-off answer, and the demand signal stays fragmented. He can neither point a user to \"follow it here\" nor show transparently what he has decided _not_ to build.","solution":"A public \"Feature Requests\" board at web-highlights.com. Visitors browse a curated list of feature requests written in plain user language, grouped by honest statuses (open for voting, in progress, done, not planned), upvote what they need (once per feature, revocable), and read Marius's personal replies on each request — including honest \"we won't build this\" explanations.","sessions":[{"d":"2026-07-22","n":"Marius round 2: native-mobile-app → IN_PROGRESS with copy sourced from the capacitor-native-app branch docs; every DONE entry now links its release note (\"Shipped in v<x>\", integrity-test-required anchors from release-notes.html);"},{"d":"2026-07-21","n":"All four slices implemented end-to-end and verified → [[0239]], [[0240]], [[0241]], [[0242]] all in-review."},{"d":"2026-07-08","n":"Project kicked off from a planning session that designed the board end-to-end. Product decisions locked with Marius: route /feature-requests; statuses OPEN / IN_PROGRESS / DONE / DECLINED;"}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":4,"done":0}},{"slug":"21-user-feedback-ideas","title":"User Feedback Ideas","status":"active","last":"2026-07-02","focus":"Backlog project — no issue in flight. Idea 1 (share / bulk-export an entire Collection, requested by Alejandro) is noted and on Marius's agenda, awaiting prioritization. Next step when prioritized: grill-me on the open snapshot-vs- live question, then to-issues.","problem":"Users regularly send feature ideas by email that are bigger than a single fix but not yet ready to build — they need collecting, shaping, and prioritizing first. Today those ideas have no shared home: they live in the inbox, get a \"good idea, noted\" reply, and risk being forgotten. (The user-request-intake pipeline shapes *actionable* requests into issues; this project is the backlog for larger ideas that are noted but not yet committed.)","solution":"A living PRD that collects user-feedback-driven feature ideas. Each idea is recorded with its source (who asked, when, verbatim excerpt), the underlying use case, what exists today, and the gap. When Marius decides to build one, the idea graduates: its user stories are broken into vertical-slice issues via to-issues (either inside this project or as its own project if large).","sessions":[{"d":"2026-07-02","n":"Project kicked off from Alejandro's email (share a Collection with YouTube livestream patrons). Verified against specs: single-bookmark public share and full-library JSON backup exist; Collection-level share/export does not."}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":0,"done":0}},{"slug":"20-free-pdf-highlighter","title":"Free Online PDF Highlighter","status":"active","last":"2026-06-29","focus":"Autonomous build pass complete (2026-06-20). 11 of 12 issues are in-review ([[0192]]–[[0201]], [[0203]]) with unit/type/format verification green; [[0202]] is flipped assignee: human for the one thing the agent shouldn't finalize alone — the legally-binding German privacy-policy wording for processing non-account visitors' data (a draft + an Art. 6(1)(f) basis are in place but NOT served, pending your sign-off → then a shared-components dist rebuild).","problem":"A visitor who has not installed the extension or created an account has no way to try Web Highlights' core PDF workflow — read a PDF and highlight it. PDFs are the second-largest complaint cluster in the leaving-feedback tracker, and the existing Free Tools (Website Highlighter, Notes, Website Reader, YouTube) already prove the product's value before sign-up for every surface *except* the most-requested one.","solution":"A visitor uploads a PDF on a public Free Tools page (\"Free Online PDF Highlighter\") and is taken straight into the full in-app PDF viewer, where they can read and highlight the document — no install, no account. The file is stored transiently: a transparency banner in the viewer shows it will be deleted within 1 hour unless the visitor signs up.","sessions":[{"d":"2026-06-29","n":"The spec was green-on-paper but never actually uploaded: cy.wait('@anonUpload') timed out, \"no request ever occurred\". Root-caused live (ran npm run cypress:specific, screenshots + in-page tracing): two issues, neither in product code."},{"d":"2026-06-20","n":"Viewer public boot ([[0197]]) + expired state ([[0198]]). Added a pure, jest-tested getViewerBootMode(fileUrl, jwt) to shared-lib (anonymous URL → public boot even with a JWT;"},{"d":"2026-06-19","n":"Anonymous upload + capability-URL read landed. Built the backend foundation end-to-end: - shared-lib (file-uploads/index.ts) — the capability-URL contract, in one tested place reused by every later phase: ANONYMOUS_UPLOAD_TTL_HOURS (24) + _MS, ANONYMOUS_FILE_U…"}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":1,"review":16,"done":0}},{"slug":"12-standalone-notes","title":"Standalone Notes","status":"active","last":"2026-06-26","focus":"Phases 1–4 ([[0114]]–[[0118]]) are done. Phases 5–8 ([[0287]]–[[0206]]) are all in-review — the entire backlog is implemented and awaiting the maintainer's verification. The one outstanding gate before shipped is a green yarn test:cypress run of page-notes.cy.ts on the maintainer's dev-server stack (the worktree can't run it) — that single run validates the new [[0295]]/[[0296]]/[[0297]]/[[0204]] assertions AND generates the three docs screenshots the [[02…","problem":"Today every note in Web Highlights is attached to a Highlight — to add a thought about a page, the user must first select arbitrary text to anchor the note to. A user who simply wants to jot \"ignore the intro — the real argument starts at section 3\" has no way to do it without first inventing a highlight that does not earn its place. The result is either highlights the user never wanted, or thoughts that go uncaptured.","solution":"The user can capture page-level thoughts from the sidebar without first selecting text on the page. Each thought becomes a Standalone page note — a Mark with type: 'note', empty text, empty imageSrc, and populated notes, with no DOM anchor. Standalone page notes render as note-only cards (folded top-right corner, beige tint) in the sidebar list alongside Highlights, in the same manually-reorderable order.","sessions":[{"d":"2026-06-26","n":"Maintainer found the empty-state CTA and the inline \"Add note\" inserter were invisible in the web app (app.web-highlights.com bookmark detail)."},{"d":"2026-06-25","n":"Drove all ten open tickets through the implement loop (code → verify → in-review). Verified locally with scoped tsc:check (shared-lib + shared-components, both clean), jest page-note.test.ts highlight-marks.test.ts (44 pass), and prettier --check (clean)."},{"d":"2026-06-24","n":"Maintainer verified the feature in-browser across the broader polish pass (design-token migration, the redesigned mark-anchored note-plus inserter, the rich-text formatting toolbar on page notes + highlight notes + the in-page popup, the merged colour/page-not…"}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":16,"done":5}},{"slug":"20-keyboard-shortcuts","title":"Custom Keyboard Shortcut System","status":"active","last":"2026-06-22","focus":"Project just kicked off. No issues filed yet — run /to-issues against the PRD's user stories to seed Phase 1. The first vertical slice is the shared-lib shortcut engine (registry + canonical chord normalizer + in-page dispatcher with the editable-target guard) with \"take a note → ⌥N\" as its first real consumer, since that's the gap that prompted the project.","problem":"Web Highlights users can only reach four keyboard shortcuts, and only in the browser extension. Chrome caps an extension at four commands with a default binding, and the highlighter extension already uses all four — so every new shortcut idea (taking a page note, jumping between highlights, opening search) is dead on arrival. Worse, the Vue web app has no keyboard shortcuts at all, because the Chrome Commands API simply does not exist outside the extension.","solution":"Web Highlights gains a single, browser-independent keyboard-shortcut system that works identically in the extension and the web app. Users get more than four shortcuts, can take a page note with a key, and can remap any shortcut from inside the app instead of digging through chrome://extensions/shortcuts. Every shortcut shown in the UI reflects the user's real, working binding.","sessions":[{"d":"2026-06-22","n":"Project created. Drafted the PRD for a custom, browser-independent shortcut system after hitting Chrome's hard 4-suggested-key cap while trying to add a ⌥N \"take a note\" shortcut to the (already-full) highlighter manifest."}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":0,"done":0}},{"slug":"14-pdf-upload","title":"PDF Upload","status":"active","last":"2026-06-19","focus":"[[0131]] — project ship gate. All AC implementation landed: sign-up gate on PDF tab (defensive currentSessionCan check), plan-aware over-cap dialog (showPremiumDialog({ triggeringFeatureId: 'pdf-upload' }) for Basic/Premium; toast-only for Ultimate), glossary + plan matrix updated, specs (03-highlighting.md + 04-organize-library.md) carry the new scenarios, VitePress upload-pdf.md ships with cross-link from highlight-pdfs.md, Cypress adds over-cap + sign-u…","problem":"The AddContent dialog has shown a \"PDF upload coming soon\" placeholder for a long time, so users who want to bring their own PDF into Web Highlights have no path to do so. PDFs are also the second-largest complaint cluster in the leaving-feedback tracker (116 mentions on a 1,147-sample baseline), and several blog articles already promise PDF features. The product highlights _third-party_ PDFs found on the web for every plan, but does not let users upload one of their own.","solution":"A signed-in user can pick a PDF from disk inside the AddContent dialog, see a preview card with title and page count, save it, and view + highlight the PDF inside an in-app PDF viewer hosted at app.web-highlights.com. The uploaded file lives in Cloudflare R2 only and counts against the user's existing Document storage cap. Offline (not-signed-in) users are nudged to sign up.","sessions":[{"d":"2026-06-19","n":"Issue 0180 — in-review. Raised the per-file upload cap 10 MB → 30 MB and bundled two adjacent AddContent / Documents fixes. (1) Cap: consolidated FILE_UPLOAD_MAX_BYTES to a single source of truth in shared-lib/src/file-uploads/index.ts (30 MB);"},{"d":"2026-06-17","n":"Issue 0128/0131 — fixup (add-content-pdf.cy.ts repair, 5/10 → 10/10). The spec had accumulated several failures (test-code only — no app bugs found)."}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":8,"done":5}},{"slug":"19-sync-reliability","title":"Cross-Device Sync Reliability","status":"active","last":"2026-06-19","focus":"Phase 1 ([[0177]] cache fix, [[0179]] dashboard refresh) and Phase 2 ([[0178]] sync-delivery hardening) are all implemented and in-review, verified at the unit/type level. Remaining before done: maintainer manual passes — the two-device on-page render check ([[0177]]), the dashboard-refresh-on-sync check ([[0179]]), and the three-profile delivery E2E ([[0178]]) — plus Park's diagnostics to confirm [[0178]] addresses the deletion report.","problem":"Users who highlight on more than one computer expect a highlight made (or removed) on one device to appear (or disappear) on every other device after a normal page reload. Multiple users report this silently fails: a highlight created on PC-A does not render when the same page is reloaded on PC-B, even though the Web Highlights dashboard on PC-B shows the correct, synced state. The only workaround is to open the dashboard, find the highlight, and click through to the page.","solution":"After a device syncs, on-page highlights reflect the synced state on the next page reload — with no manual dashboard step. Sync delivery is robust to multi-device accounts and to client/server clock differences, so no synced change is silently skipped.","sessions":[{"d":"2026-06-19","n":"Kicked off from a user (Park) sync report. Traced the primary symptom — a synced highlight never renders on reload until the dashboard is opened — to a stale persisted bookmarkIndexKeys fast-path cache in DbQueries that is not invalidated when sync ingests new…"}],"c":{"backlog":0,"todo":1,"blocked":0,"progress":0,"review":3,"done":0}},{"slug":"04-affiliate-ads-setup","title":"Affiliate Ads Setup","status":"paused","last":"2026-06-15","focus":"Nothing. The Userwave/Taboola partnership is over and this project is closed for new work. The feed has been off in production since 2026-07-29 (ENABLE_RECOMMENDATION_FEED=false); the revenue never materialised, and owning the inventory outright is worth more than a 70/30 split through a vendor with no verifiable public track record.","problem":"Free-tier users (~234k out of ~260k total) have no monetization surface today. A 2026 March–April market scan of 10+ ad networks confirmed there is no turn-key path for browser extensions: EthicalAds rejected the application, JS-tag networks (Carbon, Outbrain, Taboola direct, Monetag) cannot pierce the extension's Shadow DOM, and intrusive formats would damage the brand of a productivity tool. As a result, a large free cohort generates zero passive revenue and the maintainer carries 100% of the runtime cost.","solution":"Free users see a small number of native \"recommended content\" cards interleaved into the Pages feed, visually indistinguishable from a bookmark card except for a clearly labelled \"Sponsored\" disclosure. The cards are populated by a partner content network through a server-mediated channel — the extension itself never talks to the ad vendor. Paid users on the ad-free tier see nothing.","sessions":[{"d":"2026-06-15","n":"GO received from Simon to take the feed live. Filed + implemented two cleanups, both in-review: - [[0175]] — removed the temporary ENABLE_RECOMMENDATION_FEED_PROD / isRecommendationFeedEnabledProd rollout flag end-to-end: the client hostname/prod short-circuit…"}],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":0,"done":0}},{"slug":"16-pdf-print-download-highlights","title":"PDF Print & Download with Highlights","status":"active","last":"2026-06-08","focus":"All five issues ([[0147]]–[[0151]]) are implemented and in-review — the feature is code-complete. Geometry is persisted on the mark (pdfRects, normalised page-box fractions, captured at creation + backfilled on render); the marks bridge ships rects + colour + note to the main world; print draws them on the scratch canvas and download writes one real /Highlight annotation per highlight (multi-quad) with the note as /Contents.","problem":"When a reader highlights text in a PDF and then prints it or downloads/saves the file, their highlights disappear from the output — the printed or saved PDF looks unmarked. This is one of the most-requested PDF capabilities, and it makes the viewer feel lossy: the marks a reader spent time creating can't leave the app.","solution":"A reader who has highlighted a PDF can press the viewer's Print or Download button and get a PDF whose highlights are visible, in their original colours. Printing (or \"Save as PDF\") shows the highlights baked onto the pages.","sessions":[],"c":{"backlog":0,"todo":0,"blocked":0,"progress":0,"review":5,"done":0}}],"issues":[{"id":"0128","t":"Client FileUpload helpers + AddContent PDF tab uses them","s":"review","w":"agent","cat":"user-story","c":"2026-05-19","p":"14-pdf-upload"},{"id":"0129","t":"In-app PDF viewer (read-only) + build-time asset sync","s":"review","w":"agent","cat":"user-story","c":"2026-05-19","p":"14-pdf-upload"},{"id":"0130","t":"In-app PDF viewer — highlighting (sidebar + shared-lib context)","s":"review","w":"agent","cat":"user-story","c":"2026-05-19","p":"14-pdf-upload"},{"id":"0131","t":"PDF upload — plan gating, sign-up gate, storage cap UX, specs and docs","
