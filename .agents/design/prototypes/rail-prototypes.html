        border-bottom: 1px solid var(--ink);
        background: var(--paper);
        position: sticky;
        top: 0;

      .sw-btn { border: 1px solid var(--rule); padding: 5px 9px 4px; min-width: 92px; }

      .item .d { font-family: var(--mono); font-size: 10px; color: var(--ink-4); }

          { kind: "issue", id: "0627", title: "userinfo is unauthenticated and leaks profile data", slug: "32-website-multi-language", state: "todo" },
        ]},
        { date: "2026-09-14", items: [
          { kind: "session", slug: "39-youtube-tutorial-videos", text: "The last seven pipeline videos went up. All thirteen are linked from the docs." },
        ]},
        { date: "2026-09-08", items: [
          { kind: "session", slug: "28-idiom-taxonomy-and-direction", text: "The German hub now teaches proverbs and idioms as separate subjects. The implementation is waiting on review." },
        ]},
        { date: "2026-08-28", items: [
          { kind: "session", slug: "36-store-listing-aso", text: "The listing pipeline is live end to end. The open question is whether the Chrome name should lead with Web Highlighter." },
          { kind: "issue", id: "0725", title: "Chrome store name leads with Web Highlighter", slug: "36-store-listing-aso", state: "in progress" },
        ]},
        { date: "2026-08-24", items: [
          { kind: "session", slug: "35-self-served-ads", text: "The PRD’s decisions are locked. Turning the feed on in production is the remaining human step." },
        ]},
        { date: "2026-08-18", items: [
          { kind: "session", slug: "30-ios-app-release", text: "Paused until Android is in production. Enrolment is the single open task." },
          { kind: "session", slug: "21-mobile-app", text: "Shipped in 13.0.36. The folder stays as the record." },
          { kind: "issue", id: "0505", title: "Apple Developer Program enrolment", slug: "30-ios-app-release", state: "todo" },
        ]},
      ];

      const ISSUES = {
        "0357": { title: "Apple Notes article freshness", slug: "07-keyword-analysis", state: "in progress", who: "agent" },
        "0163": { title: "Recover reader mode #1", slug: "07-keyword-analysis", state: "todo", who: "agent" },
        "0165": { title: "Recover lost #1s on annotation examples", slug: "07-keyword-analysis", state: "todo", who: "agent" },
        "0838": { title: "Learning library SEO potential", slug: "22-flashcards-learning-hub", state: "in review", who: "agent" },
        "0481": { title: "Google Play developer account", slug: "29-android-app-release", state: "done", who: "human" },
        "0482": { title: "Release upload keystore", slug: "29-android-app-release", state: "todo", who: "human" },
        "0454": { title: "Firebase Android app and certificates", slug: "29-android-app-release", state: "in progress", who: "human" },
        "0484": { title: "Play Console app record and internal release", slug: "29-android-app-release", state: "in progress", who: "human" },
        "0495": { title: "Store listing and content declarations", slug: "29-android-app-release", state: "in progress", who: "human" },
        "0864": { title: "ToS refund window contradicts the pricing UI", slug: "29-android-app-release", state: "in progress", who: "human" },
        "0681": { title: "Execute the +50% price increase in Paddle", slug: "38-monetization-strategy", state: "in review", who: "human" },
        "0682": { title: "Announce the increase", slug: "38-monetization-strategy", state: "in progress", who: "agent" },
        "0720": { title: "Localize the support page", slug: "32-website-multi-language", state: "in review", who: "agent" },
        "0627": { title: "userinfo is unauthenticated and leaks profile data", slug: "32-website-multi-language", state: "todo", who: "human" },
        "0807": { title: "Auth page, full-bleed on desktop", slug: "29-android-app-release", state: "in review", who: "agent" },
        "0808": { title: "yarn dev skips the website when i18n is on", slug: "", state: "in review", who: "agent" },
        "0821": { title: "Feature Guide reuses the hand-made videos", slug: "39-youtube-tutorial-videos", state: "done", who: "agent" },
        "0505": { title: "Apple Developer Program enrolment", slug: "30-ios-app-release", state: "todo", who: "human" },
        "0725": { title: "Chrome store name leads with Web Highlighter", slug: "36-store-listing-aso", state: "in progress", who: "agent" },
      };

      const state = { proto: "lead", view: "today", slug: null, days: 4, openRest: false, drawer: null };
      const $switcher = document.getElementById("switcher");
      const $rail = document.getElementById("rail");
      const $stage = document.getElementById("stage");
      const $drawer = document.getElementById("drawer");
      let rendering = false;

      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }
      function project(slug) {
        return PROJECTS.find((p) => p.slug === slug) || null;
      }
      function shortDate(iso) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const [y, m, d] = iso.split("-").map(Number);
        return { d, m: months[m - 1], wd: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][new Date(iso + "T12:00:00").getDay()] };
      }
      function rich(src) {
        return esc(src).replace(/\[\[(\d{4})\]\]/g, (_, id) => `<button class="id" data-act="prd" data-id="${id}">#${id}</button>`);
      }
      function idsIn(src) {
        return [...src.matchAll(/\[\[(\d{4})\]\]/g)].map((m) => m[1]);
      }

      function rail() {
        const groups = [
          ["Active", PROJECTS.filter((p) => p.status === "active")],
          ["Paused", PROJECTS.filter((p) => p.status === "paused")],
          ["Shipped", PROJECTS.filter((p) => p.status === "shipped")],
        ];
        const todayOn = state.view === "today" && state.proto !== "days" || (state.proto === "days" && !state.slug);
        return `<button class="rail-today ${todayOn ? "on" : ""}" data-act="today"><div class="kicker">Across projects</div><strong>Today</strong></button>` +
          groups.map(([label, items]) => `<div class="sec kicker">${label}</div>` + items.map((p) => {
            const on = state.slug === p.slug && (state.view === "project" || state.proto === "days");
            const dt = shortDate(p.last);
            return `<button class="item ${on ? "on" : ""}" data-act="project" data-slug="${p.slug}"><span class="t">${esc(p.title)}</span><span class="d">${dt.d} ${dt.m}</span></button>`;
          }).join("")).join("");
      }

      function bar(p) {
        return `<div class="bar"><h1>${esc(p.title)}</h1><span class="meta">${p.status} · ${shortDate(p.last).d} ${shortDate(p.last).m}</span><span class="grow"></span><button class="textlink" data-act="prd-project" data-slug="${p.slug}">PRD</button><button class="textlink" data-act="wip" data-slug="${p.slug}">WIP</button></div>`;
      }

      function issueRows(p) {
        const ids = [...new Set(p.phases.flatMap((ph) => ph.items.map((i) => i.id)))];
        if (!ids.length) return "";
        return `<div class="work"><h2 class="kicker">Phases</h2>${ids.map((id) => {
          const i = ISSUES[id];
          return `<div class="row"><button class="id" data-act="issue" data-id="${id}">#${id}</button><button class="ttl" data-act="issue" data-id="${id}">${esc(i.title)}</button><span class="side">${esc(i.state)} · <button class="prd-link" data-act="prd" data-id="${id}">PRD</button></span></div>`;
        }).join("")}</div>`;
      }

      function stream(maxWidth) {
        const shown = DAYS.slice(0, state.days);
        const body = shown.map((day) => {
          const dt = shortDate(day.date);
          const entries = day.items.map((it) => {
            if (it.kind === "session") {
              const p = project(it.slug);
              const name = p ? p.title : it.slug;
              return `<article class="entry"><div class="kind">Session</div><div><button data-act="project" data-slug="${esc(it.slug)}"><strong>${esc(name)}</strong></button><p>${esc(it.text)}</p><div class="links"><button class="prd-link" data-act="prd-project" data-slug="${esc(it.slug)}">Open PRD</button></div></div></article>`;
            }
            const p = project(it.slug);
            const prd = p
              ? `<button class="prd-link" data-act="prd" data-id="${it.id}">${esc(p.title)} PRD</button>`
              : `<span class="kicker">No project, so no PRD</span>`;
            return `<article class="entry"><div class="kind">#${it.id}</div><div><button data-act="issue" data-id="${it.id}"><strong>${esc(it.title)}</strong></button><p>${esc(it.state)}</p><div class="links">${prd}</div></div></article>`;
          }).join("");
          return `<section class="day"><header class="day-h"><span class="n">${dt.d}</span><span class="m">${dt.m}<br>${dt.wd}</span></header><div>${entries}</div></section>`;
        }).join("");
        const end = state.days >= DAYS.length
          ? `<div class="end">End of the activity log in this sample.</div>`
          : `<div class="end">Scroll for earlier sessions.</div>`;
        return `<div class="stream ${maxWidth || ""}">${body}${end}</div>`;
      }

      function renderLead() {
        if (state.view === "today") {
          return `<div class="bar"><h1>Today</h1><span class="meta">Grouped by activity-log date</span></div>` + stream();
        }
        const p = project(state.slug);
        return bar(p) + `<div class="lead-wrap"><p class="lead">${rich(p.lead)}</p><button class="more" data-act="rest">${state.openRest ? "Hide the rest of this section" : "Rest of Current focus"}</button>${state.openRest && p.rest ? `<p class="rest">${esc(p.rest)}</p>` : ""}</div>` + issueRows(p);
      }

      function renderSentence() {
        if (state.view === "today") {
          return `<div class="sentence"><p class="lead">What changed, by the day it was written.</p><div class="byline"><span class="name">Today</span><span class="meta">activity log, newest first</span></div></div>` + stream();
        }
        const p = project(state.slug);
        const more = p.lead.startsWith(p.sentence) ? p.lead.slice(p.sentence.length).replace(/^\.?\s*/, "") : p.lead;
        return `<div class="sentence"><p class="lead">${esc(p.sentence)}</p><div class="byline"><span class="name">${esc(p.title)}</span><span class="meta">${p.status} · ${shortDate(p.last).d} ${shortDate(p.last).m}</span><button class="textlink" data-act="prd-project" data-slug="${p.slug}">PRD</button><button class="textlink" data-act="wip" data-slug="${p.slug}">WIP</button></div></div>${more ? `<div class="lead-wrap"><p class="rest" style="font-size:17px;color:var(--ink)">${rich(more)}</p></div>` : ""}` + issueRows(p);
      }

      function renderSplit() {
        if (state.view === "today") {
          return `<div class="bar"><h1>Today</h1><span class="meta">Sessions and new issues share a date</span></div>` + stream();
        }
        const p = project(state.slug);
        const chips = idsIn(p.lead).map((id) => {
          const i = ISSUES[id];
          return `<button class="chip" data-act="prd" data-id="${id}"><b>#${id}</b><span>${esc(i.title)}</span></button>`;
        }).join("");
        return bar(p) + `<div class="split"><p class="lead">${rich(p.lead)}</p><div class="cited"><div class="kicker">Cited in that paragraph</div>${chips || `<p class="rest">No issue ids in the first paragraph.</p>`}</div></div><p class="from-prd"><em>Problem statement, from the PRD</em>${esc(p.problem)}</p>` + issueRows(p);
      }

      function renderMargin() {
        if (state.view === "today") {
          return `<div class="bar"><h1>Today</h1><span class="meta">The dates are the map</span></div>` + stream();
        }
        const p = project(state.slug);
        const phases = p.phases.map((ph) => `<section class="phase"><div class="ph">${esc(ph.name.split("—")[0])}</div><h3>${esc(ph.name.split("—")[1] || ph.name)}</h3>${ph.items.map((it) => `<div class="check"><span class="box ${it.done ? "done" : ""}"></span><button data-act="issue" data-id="${it.id}">#${it.id} ${esc(it.title)}</button><button class="prd-link" data-act="prd" data-id="${it.id}">PRD</button></div>`).join("")}</section>`).join("");
        return bar(p) + `<div class="spread"><div class="pull"><p class="lead">${rich(p.lead)}</p><button class="more" data-act="rest">${state.openRest ? "Hide the rest" : "Rest of the section"}</button>${state.openRest && p.rest ? `<p class="rest">${esc(p.rest)}</p>` : ""}</div><div>${phases || `<p class="rest">No phase list in this sample.</p>`}</div></div>`;
      }

      function renderDays() {
        const p = state.slug ? project(state.slug) : null;
        const pin = p ? `<div class="pin"><p>${esc(p.sentence)}</p><span class="who">${esc(p.title)} · ${p.status}</span><button class="prd-link" data-act="prd-project" data-slug="${p.slug}">PRD</button><button class="textlink" data-act="today">Clear</button></div>` : "";
        return pin + `<div class="days-stream">${stream("days-stream")}</div>`;
      }

      function renderStage() {
        if (state.proto === "lead") return renderLead();
        if (state.proto === "sentence") return renderSentence();
        if (state.proto === "split") return renderSplit();
        if (state.proto === "margin") return renderMargin();
        return renderDays();
      }

      function sourceCopy() {
        return `<button class="x" data-act="close">Close</button><div class="kicker">Read from the files as they are</div><h2>No new field.</h2>
          <p class="prose"><strong>Current focus.</strong> Every WIP has a <em>## Current focus</em> section. The template asks for one paragraph. On the live repo the median project is one paragraph, but half run past 800 characters, and the multi-language section is about 600 lines. These screens show the first paragraph. The rest stays a click away.</p>
          <p class="prose"><strong>Dates.</strong> <em>## Activity log</em> and a <em>### YYYY-MM-DD</em> heading are the grouping. A few projects put the date heading somewhere else, so a parser should accept it anywhere and fall back to the <em>&gt; Last updated:</em> line.</p>
          <p class="prose"><strong>PRD link.</strong> An issue names its project in frontmatter. That folder’s <em>prd.md</em> is the document, and the WIP blockquote already points at it. Issue ids usually do not appear inside the PRD. They appear on WIP phase lines, and sometimes in Current focus. Opening PRD from an issue shows the problem statement, then quotes the WIP line that actually names the id.</p>`;
      }

      function prdCopy(slug, id) {
        const p = project(slug);
        if (!p) {
          return `<button class="x" data-act="close">Close</button><div class="kicker">#${esc(id)}</div><h2>No PRD.</h2><p class="prose">This issue has no <em>project:</em> field, so there is no folder and no prd.md to open. Standalone issues stay on the issue itself.</p>`;
        }
        const hit = id && (p.lead.includes("[[" + id + "]]") || p.phases.some((ph) => ph.items.some((it) => it.id === id)));
        const where = id ? (hit
          ? `<div class="kicker" style="margin-top:18px">Where #${esc(id)} is written</div><div class="quote">${esc(p.mention.includes("#" + id) ? p.mention : p.lead.replaceAll("[[" + id + "]]", "#" + id)).replaceAll("#" + id, `<span class="mark">#${id}</span>`)}</div><p class="note">That line is in wip.md. The PRD body does not repeat the issue id. The deep link still opens prd.md, because the WIP’s own blockquote points at ./prd.md, and the issue’s project field is the join.</p>`
          : `<p class="note">#${esc(id)} is not in this sample’s focus or phase list. The PRD still opens, because the issue belongs to the project.</p>`) : "";
        return `<button class="x" data-act="close">Close</button><div class="kicker">${esc(p.slug)} / prd.md${id ? " · from #" + esc(id) : ""}</div><h2>${esc(p.title)}</h2><div class="kicker">Problem statement</div><p class="prose">${esc(p.problem)}</p><div class="kicker" style="margin-top:16px">Solution</div><p class="prose">${esc(p.solution)}</p>${where}`;
      }

      function renderDrawer() {
        const d = state.drawer;
        if (!d) { $drawer.classList.remove("open"); $drawer.innerHTML = ""; return; }
        $drawer.classList.add("open");
        if (d.kind === "source") $drawer.innerHTML = sourceCopy();
        else if (d.kind === "wip") {
          const p = project(d.slug);
          $drawer.innerHTML = `<button class="x" data-act="close">Close</button><div class="kicker">${esc(p.slug)} / wip.md</div><h2>${esc(p.title)}</h2><div class="kicker">Current focus, first paragraph</div><div class="quote">${rich(p.lead)}</div><p class="note">Last updated ${esc(p.last)}, from the blockquote. Status in the file is in-progress, which the board already shows as active.</p>`;
        } else if (d.kind === "issue") {
          const i = ISSUES[d.id];
          const p = project(i.slug);
          $drawer.innerHTML = `<button class="x" data-act="close">Close</button><div class="kicker">#${d.id} · ${esc(i.state)} · ${esc(i.who)}</div><h2>${esc(i.title)}</h2><p class="prose">${p ? esc(p.title) : "Standalone"}</p><p style="margin-top:16px">${p ? `<button class="prd-link" data-act="prd" data-id="${d.id}">Open ${esc(p.title)} PRD</button>` : "No PRD to open."}</p>`;
        } else $drawer.innerHTML = prdCopy(d.slug, d.id);
      }

      function render() {
        rendering = true;
        const top = $stage.scrollTop;
        const current = PROTOS.find((p) => p.id === state.proto);
        $switcher.innerHTML = `<div><div class="kicker">Round 2 · keys 1–5</div><div class="sw-title">Rail, <em>again</em></div></div><div><div class="sw-row">${PROTOS.map((p, i) => `<button class="sw-btn ${p.id === state.proto ? "on" : ""}" data-act="proto" data-proto="${p.id}"><strong>${i + 1} ${esc(p.name)}</strong><span>${esc(p.line)}</span></button>`).join("")}</div><p class="thesis">${esc(current.thesis)} <button data-act="source">How this is read</button></p></div>`;
        $rail.innerHTML = rail();
        $stage.innerHTML = renderStage();
        renderDrawer();
        $stage.scrollTop = top;
        rendering = false;
        if ($stage.scrollHeight <= $stage.clientHeight + 40 && state.days < DAYS.length && (state.view === "today" || state.proto === "days")) {
          state.days += 2;
          render();
        }
      }

      document.body.addEventListener("click", (e) => {
        const t = e.target.closest("[data-act]");
        if (!t) return;
        const act = t.dataset.act;
        if (act === "proto") {
          state.proto = t.dataset.proto;
          state.view = "today";
          state.slug = null;
          state.days = 4;
          state.openRest = false;
          state.drawer = null;
          $stage.scrollTop = 0;
          render();
          return;
        }
        if (act === "today") {
          state.view = "today";
          state.slug = null;
          state.drawer = null;
          render();
          return;
        }
        if (act === "project") {
          state.slug = t.dataset.slug;
          state.view = "project";
          state.openRest = false;
          state.drawer = null;
          if (state.proto !== "days") $stage.scrollTop = 0;
          render();
          return;
        }
        if (act === "rest") { state.openRest = !state.openRest; render(); return; }
        if (act === "source") { state.drawer = { kind: "source" }; render(); return; }
        if (act === "close") { state.drawer = null; render(); return; }
        if (act === "prd") {
          const i = ISSUES[t.dataset.id];
          state.drawer = { kind: "prd", slug: i ? i.slug : "", id: t.dataset.id };
          render();
          return;
        }
        if (act === "prd-project") {
          state.drawer = { kind: "prd", slug: t.dataset.slug, id: "" };
          render();
          return;
        }
        if (act === "wip") { state.drawer = { kind: "wip", slug: t.dataset.slug }; render(); return; }
        if (act === "issue") { state.drawer = { kind: "issue", id: t.dataset.id }; render(); return; }
      });

      $stage.addEventListener("scroll", () => {
        if (rendering) return;
        if (state.view !== "today" && state.proto !== "days") return;
        if (state.days >= DAYS.length) return;
        if ($stage.scrollTop + $stage.clientHeight > $stage.scrollHeight - 280) {
          state.days += 2;
          render();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { state.drawer = null; render(); return; }
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
        const n = Number(e.key);
        if (n >= 1 && n <= 5) {
          state.proto = PROTOS[n - 1].id;
          state.view = "today";
          state.slug = null;
          state.days = 4;
          state.drawer = null;
          $stage.scrollTop = 0;
          render();
        }
      });

      render();
    </script>
  </body>
