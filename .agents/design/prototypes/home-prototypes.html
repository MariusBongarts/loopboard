<title>Home view lab</title>
<!--
  Home view prototypes (lab). Three takes on a per-workspace Home that says
  what happened last: routine runs with a short brief and the issues they
  filed, what needs you, new issues and projects that moved. Every item opens
  a preview dialog with its own deep link (#a/run/<slug>/<run>, #b/issue/0126…).
  Served by `pnpm dev` at /.agents/design/prototypes/home-prototypes.html it
  reads the live workspaces; anywhere else it shows built-in demo data.
-->

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: var(--r-sm); }
.mono { font-family: var(--mono); }

/* Lab chrome — not part of the design */
.lab { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 16px; background: var(--bg-subtle); border-bottom: 1px solid var(--border); }
.lab-name { font-weight: 600; letter-spacing: -0.01em; display: inline-flex; align-items: center; gap: 8px; }
.lab-name small { font: 500 10.5px var(--mono); color: var(--text-3); padding: 2px 6px; border: 1px solid var(--border); border-radius: 999px; }
.lab-thesis { flex: 1 1 260px; color: var(--text-3); font-size: 12px; min-width: 0; }
.lab-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--bg-active); border-radius: var(--r); }
.seg button { white-space: nowrap; border: 0; background: transparent; padding: 4px 10px; border-radius: var(--r-sm); font-size: 12px; font-weight: 500; color: var(--text-3); transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
select { height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); font-size: 12px; }

/* App shell */
.app { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - var(--lab-h, 45px)); }
.rail { border-right: 1px solid var(--border); background: var(--bg-subtle); padding: 10px 8px; overflow: auto; }
.rail-ws { display: flex; align-items: center; gap: 8px; padding: 6px 8px 12px; font-weight: 600; }
.rail-logo { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); }
.rail-nav { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: var(--r); color: var(--text-2); font-weight: 500; }
.rail-nav:hover { background: var(--bg-hover); }
.rail-nav.on { background: var(--bg-active); color: var(--text); }
.rail-nav svg { color: var(--text-3); flex: none; }
.rail-nav .count { margin-left: auto; font-size: 11.5px; color: var(--text-3); }
.rail-nav .count.hot { background: var(--accent); color: var(--on-accent); padding: 0 6px; border-radius: 999px; font-weight: 600; }
.rail-h { font-size: 11px; color: var(--text-3); padding: 14px 8px 4px; font-weight: 500; }
.rail-proj { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: var(--r); color: var(--text-2); }
.rail-proj:hover { background: var(--bg-hover); }
.rail-proj span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 20px; border-bottom: 1px solid var(--border); flex: none; }
.topbar h1 { font-size: 14px; font-weight: 600; margin: 0; }
.topbar .spacer { flex: 1; }
.ghost { border: 0; background: transparent; color: var(--text-3); padding: 4px 8px; border-radius: var(--r); font-size: 12px; font-weight: 500; }
.ghost:hover { background: var(--bg-hover); color: var(--text); }
.scroll { flex: 1; overflow: auto; }

/* Primitives */
.status-icon { flex: none; display: inline-block; vertical-align: -2px; }
.st-backlog { color: var(--st-backlog); } .st-todo { color: var(--st-todo); } .st-in-progress { color: var(--st-progress); }
.st-in-review { color: var(--st-review); } .st-done { color: var(--st-done); } .st-blocked { color: var(--st-blocked); } .st-wontfix { color: var(--st-wontfix); }
.avatar { flex: none; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; }
.avatar-agent { background: var(--blue-soft); color: var(--blue-text); }
.avatar-human { background: var(--orange-soft); color: var(--orange-text); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text-2); font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.pill-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tone, var(--text-4)); }
.pbadge { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-3); font-size: 12px; font-weight: 500; white-space: nowrap; }
.pbadge-mark { flex: none; width: 9px; height: 9px; border-radius: 3px; background: var(--tone, var(--text-4)); }
.pbadge-name { overflow: hidden; text-overflow: ellipsis; }
.tone-orange { --tone: var(--orange); } .tone-blue { --tone: var(--blue); } .tone-green { --tone: var(--green); } .tone-red { --tone: var(--red); }
.tone-pink { --tone: var(--pink); } .tone-amber { --tone: var(--amber); } .tone-teal { --tone: var(--teal); }

.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--run-missed); }
.dot.ok { background: var(--run-ok); } .dot.failed { background: var(--run-failed); } .dot.running { background: var(--run-running); animation: pulse 1.6s var(--ease) infinite; }
.dot.paused { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-4); }
@keyframes pulse { 50% { opacity: 0.35; } }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--r-sm); font-size: 11px; font-weight: 600; }
.tag.failed { color: var(--red-text); background: var(--red-soft); }
.tag.running { color: var(--amber-text); background: var(--amber-soft); }
.tag.missed, .tag.paused { color: var(--text-3); background: var(--bg-active); }
.tag.ok { color: var(--green-text); background: var(--green-soft); }
.new { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }

/* Issue chips and refs */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 24px; padding: 0 8px 0 6px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); font-size: 12px; color: var(--text-2); transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
.chip:hover { border-color: var(--border-strong); background: var(--bg-hover); color: var(--text); }
.chip .id { font: 500 11px var(--mono); color: var(--text-3); }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
.chip.mention { border-style: dashed; }
.chip-label { font-size: 11px; color: var(--text-4); font-weight: 500; }
.ref { color: var(--accent-text); font-family: var(--mono); font-size: 0.92em; font-weight: 500; }
.ref:hover { text-decoration: underline; }
.link { color: var(--text-3); font-size: 12px; font-weight: 500; }
.link:hover { color: var(--accent-text); }

/* Run strip */
.strip { display: inline-flex; gap: 3px; align-items: center; }
.tick { width: 7px; height: 14px; border-radius: 2px; background: var(--run-missed); opacity: 0.85; transition: transform var(--dur) var(--ease); }
.tick.ok { background: var(--run-ok); } .tick.failed { background: var(--run-failed); } .tick.running { background: var(--run-running); } .tick.missed { background: color-mix(in oklch, var(--run-missed) 45%, transparent); }
.tick:hover { transform: scaleY(1.25); opacity: 1; }
.tick.cur { outline: 2px solid var(--text); outline-offset: 1px; }

/* Section heading shared by all prototypes */
.sec { margin-top: 30px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; }
.sec-h h3 { margin: 0; font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }
.sec-h .meta { font-size: 12px; color: var(--text-4); }
.sec-h .link { margin-left: auto; }
.empty { color: var(--text-4); font-size: 12.5px; padding: 8px 0; }

/* Issue row (shared) */
.irow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; margin: 0 -10px; border-radius: var(--r); min-width: 0; }
.irow:hover { background: var(--bg-hover); }
.irow .id { font: 500 11.5px var(--mono); color: var(--text-3); flex: none; width: 40px; }
.irow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.irow .aside { flex: none; font-size: 12px; color: var(--text-4); display: inline-flex; gap: 10px; align-items: center; }
.via { font-size: 11.5px; color: var(--text-3); display: inline-flex; gap: 5px; align-items: center; }
.via:hover { color: var(--accent-text); }

/* ── A · Briefing ─────────────────────────────── */
.a { max-width: 800px; margin: 0 auto; padding: 32px 28px 80px; }
.a-date { color: var(--text-3); font-size: 12px; margin: 0; }
.a-title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 4px 0 8px; }
.a-sum { font-size: 14.5px; line-height: 1.6; color: var(--text-2); margin: 0; }
.a-sum a { color: var(--text); font-weight: 600; border-bottom: 1px solid var(--border-strong); }
.a-sum a:hover { border-color: var(--accent); color: var(--accent-text); }
.a-sum a.bad { color: var(--red-text); }
.a-routines { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.a-run { display: grid; grid-template-columns: 8px 1fr auto; gap: 4px 12px; padding: 13px 16px; border-top: 1px solid var(--border-subtle); position: relative; }
.a-run:first-child { border-top: 0; }
.a-run:hover { background: var(--bg-subtle); }
.a-run .dot { margin-top: 6px; }
.a-run-h { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.a-run-h a.title { font-weight: 600; }
.a-run-h .when { color: var(--text-4); font-size: 12px; white-space: nowrap; }
.a-run-brief { grid-column: 2 / 4; color: var(--text-2); font-size: 13.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.a-run-brief:hover { color: var(--text); }
.a-run .chips { grid-column: 2 / 4; margin-top: 6px; }
.a-run .side { display: flex; align-items: center; gap: 10px; }
.a-quiet { padding: 10px 16px; border-top: 1px solid var(--border-subtle); color: var(--text-3); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: var(--bg-subtle); }
.a-quiet a { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); }
.a-quiet a:hover { border-color: var(--border-strong); }
.a-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 32px; }
.a-proj { display: block; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-lg); transition: border-color var(--dur) var(--ease); }
.a-proj:hover { border-color: var(--border-strong); }
.a-proj-h { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.a-proj-h .when { margin-left: auto; font-weight: 400; color: var(--text-4); font-size: 12px; }

.b-day { margin-bottom: 10px; }
.b-day-h { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0 6px; display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--border-subtle); }

.b-ev-h { display: flex; align-items: baseline; gap: 8px; min-width: 0; }

.b-ev-h .brief:hover { color: var(--text); }

.b-kids .lead { font-size: 11px; color: var(--text-4); font-weight: 500; margin: 2px 0; }

.card { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); padding: 12px 14px; }
.card h4 { margin: 0 0 8px; font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; display: flex; }
.card h4 .link { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.b-rt { display: grid; grid-template-columns: 8px 1fr auto; gap: 2px 10px; align-items: center; padding: 6px 8px; margin: 0 -8px; border-radius: var(--r); }

.b-rt .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.b-rt .next { grid-column: 2 / 4; font-size: 11.5px; color: var(--text-4); display: flex; justify-content: space-between; gap: 8px; }
.b-side .irow { padding: 5px 8px; margin: 0 -8px; }

/* ── C · Desk ─────────────────────────────────── */
.c { max-width: 1240px; margin: 0 auto; padding: 24px 28px 80px; }

.c-rc .last { font-size: 12px; color: var(--text-4); }

.c-rc-f { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-4); }

ote":"pnpm audit could not reach the registry (ETIMEDOUT)\n\nNo changes made. The next Monday run retries; run it by hand if you need the audit sooner.","started":"2026-10-26T07:00:00","finished":"2026-10-26T07:02:00"}]},{"slug":"weekly-grooming","title":"Weekly grooming issue","kind":"issue","enabled":true,"state":"idle","words":"Mondays at 06:00","next":"2026-11-02T06:00:00","runs":[{"status":"ok","at":"2026-10-19T06:00:00","slot":"2026-10-19T06:00:00","note":"Week 43's issue was already on the board; nothing filed.","started":"2026-10-19T06:00:00","finished":"2026-10-19T06:00:00"},{"status":"ok","at":"2026-10-26T06:00:00","slot":"2026-10-26T06:00:00","note":"Filed #0127 Groom the board — week 44","started":"2026-10-26T06:00:00","finished":"2026-10-26T06:00:00"}]},{"slug":"weekly-changelog","title":"Weekly changelog","kind":"agent","enabled":false,"state":"paused","words":"Fridays at 17:00","next":null,"runs":[{"status":"ok","at":"2026-10-16T17:00:00","slot":"2026-10-16T17:00:00","note":"CHANGELOG 0.9.2 drafted: qualified references link locally (#0100), test runs register no workspace (#0111)","started":"2026-10-16T17:00:00","finished":"2026-10-16T17:08:00"},{"status":"ok","at":"2026-10-23T17:00:00","slot":"2026-10-23T17:00:00","note":"CHANGELOG 0.10.0 drafted: routines — CLI, check, runs and the Routines view (#0114, #0116, #0120, #0121)\n\n* Tag waits on you: `pnpm release` after reading the draft.\n* Paused after this run until 0.10.0 is out.","started":"2026-10-23T17:00:00","finished":"2026-10-23T17:09:00"}]}],"issues":[{"id":"0001","title":"Reserve the loopboard name on npm and GitHub","status":"todo","assignee":"human","project":"01-open-source-launch","labels":["oss"],"created":"2026-10-04","category":"task","archived":false,"body":"\n## What needs to change\n\nClaim `loopboard` before anyone else does: publish a `0.0.0` placeholder to\nnpm under the maintainer's account, and decide where the repo lives (personal\naccount or a `loopboard` org) and create it there, private for now.\n\n## Why\n\nThe name shows up in every command, README line and setup prompt. It was free\non npm on 2026-10-04, and losing it later would mean renaming across the\ncodebase and docs.\n\n## Acceptance criteria\n\n- [ ] `npm view loopboard` shows the maintainer as owner\n- [x] GitHub home for the repo is decided and created — [MariusBongarts/loopboard](https://github.com/MariusBongarts/loopboard), public from the first push\n- [x] Decision noted in the project's `wip.md` activity log\n\n## Out of scope\n\n- Domain or landing page — no hosted site in this project\n- Making the repo public — that is #0036\n\n## Notes\n\n- Human-assigned: needs the maintainer's npm and GitHub accounts.\n"},{"id":"0002","title":"Move workflow conventions from ai/ to .agents/ and drop the lorem examples","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["oss","conventions"],"created":"2026-10-04","category":"task","archived":false,"body":"\n## What needs to change\n\n- Move the issues and projects READMEs and `_templates/` from `ai/` into\n  `.agents/issues/` and `.agents/projects/`, next to this project's files.\n- Delete the lorem/ipsum projects, the dummy issues 0064–0069\n  (its history lives in webhighlights), then remove `ai/`.\n- Replace every `ai/` path in the skills, READMEs, templates and AGENTS.md with\n  `.agents/`.\n- Rewrite AGENTS.md for this repo: loopboard project overview, drop the\n  Firebase trigger, and only link files that exist (or are created by #0005).\n- Make `.agents` the tracker's default root, so `pnpm dev` shows this project.\n\n## Why\n\nThe PRD makes `.agents/` the default root and this repo the live example. The\nlorem data and monorepo leftovers are the first thing a visitor would see.\n\n## Acceptance criteria\n\n- [x] No `ai/` folder remains; `grep -r \"ai/\" .agents AGENTS.md` finds no stale paths — remaining hits are this project's own mentions of the legacy `ai/` root\n- [x] `pnpm dev` (no env vars) shows project 01 and its issues\n- [x] Issues and projects READMEs/templates live under `.agents/` and describe `.agents/` paths\n- [x] AGENTS.md has no Firebase rule and no links to missing files — the specs, architecture and rules links resolve once #0005 lands\n- [x] `pnpm verify` passes\n\n## Out of scope\n\n- Root auto-detection (`.agents/` → `ai/`) — #0007\n- Specs, architecture and rules content — #0005\n\n## Notes\n\n- Test fixtures that model an `ai/` root stay; they now stand for legacy repos.\n"},{"id":"0003","title":"Rename the tracker to loopboard and remove personal setup","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["oss"],"created":"2026-10-04","category":"task","archived":false,"body":"\n## What needs to change\n\n- Package name `loopboard`; remove `private: true`; add description,\n  repository, keywords and `engines` (Node ≥ 20).\n- Remove the personal `dev:wh`, `dev:mm`, `dev:pa`, `dev:alive`, `dev:mb`,\n  `dev:wh2` and `dev:dir` scripts (workspaces replace them in #0008).\n- Rename the UI brand, the page `<title>` and the server log prefix to loopboard.\n- Strip the README of monorepo leftovers (`tools/tracker`, `pnpm tracker:*`,\n  the `06-issue-tracker` PRD link) so it stays accurate until #0013 rewrites it.\n\n## Why\n\nA private package with the maintainer's sibling-repo paths can't be published\nor understood by anyone else.\n\n## Acceptance criteria\n\n- [x] `package.json` has no personal scripts or sibling-repo paths\n- [x] The app shows \"loopboard\" in the rail and the browser tab\n- [x] README contains no references to files outside this repo\n- [x] `pnpm verify` passes\n- [x] `pnpm dev` takes the next free port when 5180 is busy (added by the maintainer during implementation)\n\n## Deviations\n\n- `private: true` stays until #0035 adds the `files` allowlist and the\n  publish pipeline, so an accidental `pnpm publish` can't ship the whole repo.\n- `repository`/`homepage` wait for #0001 to decide the GitHub home.\n- Browser storage keys keep their `tracker.*` prefix so remembered pins, rail\n  width and selection survive; #0008 re-keys them per workspace anyway.\n\n## Out of scope\n\n- The `bin` entry and CLI — #0007\n- The full README rewrite — #0013\n"},{"id":"0004","title":"Add the MIT license, skill credits and the contribution flow","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["oss","docs"],"created":"2026-10-04","category":"task","archived":false,"body":"\n## What needs to change\n\n- Add an MIT `LICENSE`.\n- Add `CREDITS.md`: for each adapted skill, record the upstream repo, author\n  and license. grill-me, grill-with-docs, to-prd, to-issues, tdd,\n  improve-codebase-architecture, write-a-skill and diagnose read like\n  mattpocock/skills adaptations; verify each one rather than assuming.\n- Remove the caveman skill and its `.claude/` and `.cursor/` links.\n- Add `CONTRIBUTING.md`: GitHub Issues are the intake; an accepted report\n  becomes a `.agents/issues` file; PRs reference `#NNNN` and close the GitHub\n  issue.\n- Add GitHub issue forms for bugs and feature requests.\n- Document an optional `source: github#N` frontmatter field in the issues\n  README and templates.\n\n## Why\n\nOpen-sourcing adapted skills without attribution is dishonest and may breach\ntheir licenses. Contributors need to know how reports turn into work.\n\n## Acceptance criteria\n\n- [x] `LICENSE` (MIT) and `CREDITS.md` exist; every shipped skill is listed as original or adapted\n- [x] Every upstream license is checked and recorded; if one is incompatible with MIT, flip this issue to `assignee: human` with a `## Questions` section — all adapted skills come from mattpocock/skills (MIT); caveman (Apache-2.0, JuliusBrussee/caveman via mattpocock/skills) is removed\n- [x] caveman is gone from `.agents/`, `.claude/` and `.cursor/`\n- [x] `CONTRIBUTING.md` and the bug/feature issue forms exist\n- [x] `source:` is documented and the tracker ignores it gracefully — covered by a Vitest read + status-rewrite test\n\n## Findings\n\nCompared each skill file line by line with mattpocock/skil"},{"id":"0005","title":"Write loopboard's own specs, architecture docs and rules","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["oss","docs"],"created":"2026-10-04","category":"task","archived":false,"body":"\n## What needs to change\n\n- Turn the README's \"What it does\" and \"Board behavior\" sections into\n  `.agents/specs/`: a `_specs.md` index with \"How to update this spec\" rules, a\n  `00-conventions-and-glossary.md`, and one spec per area (inbox/feed, project\n  board, backlog, specs view), each with an E2E coverage table.\n- Add `.agents/architecture/_architecture.md` (server, client, data flow) with\n  \"How to update these docs\", plus ADRs in `decisions/` for the decisions this\n  PRD locks: npx + local server, workspace registry, `.agents/` root with\n  detection, sequential branch-aware IDs, WYSIWYG block splice.\n- Add `.agents/rules/typescript.md` and `components.md` with this repo's real\n  conventions, so the AGENTS.md links resolve.\n\n## Why\n\nThe repo is the example of the workflow. Its own specs and ADRs show adopters\nwhat good ones look like, and the Specs view needs real content to demo.\n\n## Acceptance criteria\n\n- [x] The Specs view shows loopboard's specs with coverage percentages — 6 specs, 33 scenarios, 0% (every row ❌ until #0006)\n- [x] Every AGENTS.md link resolves (except the Brand Kit, which #0033 adds)\n- [x] One ADR per locked decision above — 0001–0005\n- [x] README no longer duplicates spec content; it links to the specs\n\n## Findings\n\nWriting the specs from the code (not the old README) surfaced two gaps,\nrecorded under \"Known gaps\" in the specs:\n\n- **Wontfix can't be reached from the board** (§ 4): the reason modal and the\n  server's `## Why rejected` append still exist, but the one-screen board has\n  no Wontfix column to drop on.\n- **\"/\" doesn't reach the Specs se"},{"id":"0006","title":"Add CI and a Playwright harness on a fixture workspace","status":"in-review","assignee":"human","project":"01-open-source-launch","labels":["ci","testing"],"created":"2026-10-04","category":"task","archived":false,"body":"\n## What needs to change\n\n- Add Playwright with a fixture `.agents/` workspace under the tests folder\n  (several projects, every status, a spec with a coverage table).\n- First e2e tests: the inbox lists fixture items; dragging a card to another\n  column rewrites `status:` in the fixture file (on a temp copy).\n- GitHub Actions: `pnpm verify` and the e2e suite on macOS, Linux and Windows\n  for every PR and push to main.\n\n## Why\n\nAGENTS.md requires Playwright for user-facing behavior, but the repo has none.\nEvery later slice needs a harness to add its e2e coverage to.\n\n## Acceptance criteria\n\n- [x] `pnpm test:e2e` runs locally against the fixture, never against the real `.agents/` — a temp copy per run, served on port 5199, removed afterwards\n- [ ] CI runs verify + e2e on the three OSs and is green — workflow added, not run yet: the repo has no remote. Needs `pnpm-workspace.yaml` committed (pnpm 11 build-script allowlist for esbuild)\n- [x] Specs coverage tables reference the new tests — § 2 🟡, § 4 ✅, § 6 🟡\n\n## Review\n\nCI can only be checked after a push: push the repo (private is fine), make\nsure `pnpm-workspace.yaml` is committed, and confirm the three CI jobs are\ngreen. Flip to `done` when they are.\n\n## Findings\n\n- **Malformed issue files come back as ghosts.** gray-matter caches a file\n  before parsing it; when the YAML throws, the first read skips the file but\n  every later read returns the cached object with empty data — an issue titled\n  with its filename, status `todo`. Filed as #0042. The fixture quotes its\n  colon-containing title so the e2e counts are real.\n\n## Out o"},{"id":"0007","title":"Run loopboard from any repo with npx","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["cli","server"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **solo developer**, I want **to run `npx loopboard` (or `loopboard <path>`) in any repo and get the board in my browser**, so that **I don't have to clone the tracker or edit scripts per repo**.\n\n## Acceptance criteria\n\n- [x] The API handler is framework-free and mounted by both the Vite dev plugin and a production Node server\n- [x] `loopboard [path]` serves the built client + API for that repo, defaulting to the current directory\n- [x] Root detection: `.agents/issues`, then `ai/issues`; if neither exists, the CLI exits with a clear hint to run `loopboard init`\n- [x] Binds 127.0.0.1; uses the next free port if the default is taken; opens the browser unless `--no-open`\n- [x] Requests with a foreign `Host` and mutating requests with a foreign `Origin` are rejected (Vitest)\n- [x] `pnpm pack` + `npx ./loopboard-*.tgz` works in a temp repo with an `.agents/` and one with an `ai/` root\n- [x] `pnpm verify` passes\n\n## Out of scope\n\n- Remembering several repos — #0008\n- File watching — #0010\n\n## Notes\n\n- PRD stories 1–4. Keep gray-matter/fs logic where it is; only the transport moves.\n\n## Outcome\n\n- `launch()` in `server/cli.ts` starts or hands off; unit-tested in `tests/cli.test.ts`; Host/Origin guard in `tests/handler.test.ts`.\n- Verified by hand: `pnpm build && pnpm pack`, then `npx --package=<tgz> loopboard` in a temp `.agents/` repo (served at 127.0.0.1:5400), a second `ai/` repo (handed off), and a folder without a root (exit 1 with the init hint).\n- URLs use `127.0.0.1`, not `localhost`: the server binds IPv4 loopback and Node's fetch resolves `localhost`"},{"id":"0008","title":"Remember workspaces and switch between them from the top-left","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["workspaces","ui","server"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer with several repos**, I want **one running loopboard to remember every repo I opened and switch between them from the top-left corner**, so that **I stop juggling ports, terminal tabs and per-repo scripts**.\n\n## Acceptance criteria\n\n- [x] A per-user registry (XDG config dir; `%APPDATA%` on Windows) stores `{ id, name, repoPath, root }`\n- [x] Starting the CLI registers the repo (deduplicated by path) and selects it; if a loopboard server is already running, the CLI hands the repo to it and opens its URL instead of starting a second server\n- [x] API routes are workspace-scoped (`/api/w/:id/…`); client URLs are `/w/:id/…` via a router\n- [x] The top-left switcher lists workspaces with open-issue counts; choosing one loads it and updates the URL\n- [x] A workspace whose folder disappeared shows as unavailable instead of crashing\n- [x] Vitest covers the registry (add, dedupe, missing folder); Playwright covers switching\n\n## Out of scope\n\n- Adding/removing workspaces from the UI — #0009\n- Cross-workspace views — #0023\n\n## Notes\n\n- PRD stories 5, 6, 7, 10. Per-browser UI state (pins, last selection) becomes per-workspace.\n\n## Outcome\n\n- Registry, root detection and routes in `server/workspaces.ts` + `server/handler.ts`; client routing via `vue-router` (`/w/:ws`, `/w/:ws/specs`), `WorkspaceView` + `WorkspaceSwitcher`.\n- Per-workspace browser storage through `src/storage.ts` with a one-time fallback to the old `tracker.*` keys.\n- Specs § 1 and § 7; e2e in `tests/e2e/07-workspaces.spec.ts` against two fixture repos (`.agents/` and legacy `ai/`).\n"},{"id":"0009","title":"Add, rename and remove workspaces in the UI","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["workspaces","ui"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **to add a workspace by pasting a repo path with folder suggestions as I type, and to rename or remove workspaces**, so that **I manage my repos without the terminal**.\n\n## Acceptance criteria\n\n- [x] \"+ Add workspace…\" in the switcher opens a path input; the server suggests subfolders as you type (`~` expands)\n- [x] Choosing a folder runs root detection; folders without a root show the setup hint (#0015 later turns this into the full empty state)\n- [x] \"Manage workspaces\" lets you rename and remove entries; removing never touches files on disk\n- [x] The folder-suggestion endpoint only lists directory names, never file contents\n- [x] Playwright covers add → switch → remove\n\n## Out of scope\n\n- Auto-discovering repos by scanning the disk — rejected in the PRD\n\n## Notes\n\n- PRD stories 8, 9. Browsers can't return absolute paths from a native picker, so the server-side suggest is the picker.\n\n## Outcome\n\n- Add dialog with server-side folder suggestions (`GET /api/fs/suggest`), keyboard pick, root-less folders explained; Manage dialog with rename and confirmed remove. Both on a new shared `BaseDialog` (the wontfix modal moved onto it).\n"},{"id":"0010","title":"Update the board live when files change on disk","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["server","ui"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer watching an agent work**, I want **cards to move and new issues, sessions and specs to appear as files change on disk**, so that **I never press Refresh**.\n\n## Acceptance criteria\n\n- [x] The server watches the active workspace root (chokidar) while at least one client is connected, and stops when none are\n- [x] Changes are pushed over Server-Sent Events; the client refetches that workspace, debounced (one refetch for a burst of writes)\n- [x] The current selection, open drawer and scroll position survive a refetch\n- [x] The Refresh button is removed; a small indicator shows when the live connection drops and reconnects\n- [x] Playwright: writing a fixture file moves its card without a reload\n\n## Out of scope\n\n- Per-file diffs over the wire — whole-workspace refetch is fast enough at 800+ issues; optimize only if measured\n\n## Notes\n\n- PRD story 11. Ignore `node_modules` and temp files written by atomic saves.\n\n## Outcome\n\n- `fs.watch` with `recursive` (Node ≥ 20 on all three OSs) instead of\n  chokidar — no dependency. Only `.md` paths count: on macOS a temp file\n  also reports its parent directory, which name filters can't catch.\n- The Refresh button became a live dot; when the stream drops, an \"Offline\"\n  badge offers an immediate reload, and the reconnect refetches.\n"},{"id":"0011","title":"Scaffold the workflow in any repo with loopboard init","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["cli","setup"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer adopting the workflow**, I want **`loopboard init` to scaffold `.agents/` with READMEs, templates and the core skills, and wire them into my agent tools, without overwriting anything**, so that **setup is predictable and safe to re-run**.\n\n## Acceptance criteria\n\n- [x] Creates `.agents/{issues,projects,specs,architecture/decisions,rules,design}` with each README and template, sourced from this repo's own `.agents/` files (bundled into the package)\n- [x] Installs the core skills (grill-me, grill-with-docs, to-prd, to-issues, implement, triage, upgrade-harness); `--with-extras` adds tdd, diagnose, improve-codebase-architecture, write-a-skill\n- [x] Links `.claude/skills` and `.cursor/skills` to `.agents/skills`; copies where symlinks fail (Windows)\n- [x] Writes a managed block between markers in AGENTS.md (creates AGENTS.md, and a CLAUDE.md containing `@AGENTS.md`, if missing), including the latest `<!-- loopboard:migration MNNN -->` marker so new harnesses start with nothing pending (#0041)\n- [x] Writes `.agents/SETUP.md`: instructions for the agent to adapt AGENTS.md (build/test/verify commands, existing CLAUDE.md) and to ask before importing existing TODOs\n- [x] Ships the upstream MIT notice with the adapted skills (e.g. `.agents/skills/CREDITS.md` from the repo's `CREDITS.md`) — MIT requires it in every copy\n- [x] Never overwrites an existing file; prints created/skipped per path; a second run creates nothing\n- [x] Vitest: empty repo, repo with existing AGENTS.md, re-run idempotency\n\n## Out of scope\n\n- Upgrading an existing setup — #0012\n- "},{"id":"0012","title":"Refresh skills and templates with loopboard init --upgrade","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["cli","setup"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer on an older setup**, I want **`loopboard init --upgrade` to refresh skills, templates, READMEs and the AGENTS.md block, and to warn instead of overwriting files I customized**, so that **I get improvements without losing my edits or my work**.\n\n## Acceptance criteria\n\n- [x] `init` records a manifest of shipped file hashes; `--upgrade` compares against it\n- [x] Unmodified shipped files are updated; locally edited ones are skipped with a warning unless `--force`, pointing to the upgrade-harness skill (#0041), which merges customized files and runs pending migrations\n- [x] Issue files, project folders and spec/architecture content are never touched\n- [x] Only the content between the AGENTS.md markers is replaced\n- [x] Prints a summary (updated / skipped / new); `--dry-run` changes nothing\n- [x] Vitest covers unmodified, modified and `--force` cases\n\n## Out of scope\n\n- Migrating repos from `ai/` to `.agents/` — detection keeps legacy roots working\n\n## Notes\n\n- PRD stories 15, 16.\n\n## Outcome\n\n- Same planner as init (`upgrade: true`): manifest-hash check, `--force`, `--dry-run`, block text refreshed with the harness's migration level preserved.\n"},{"id":"0013","title":"Rewrite the README around the quick-setup prompt","status":"in-review","assignee":"human","project":"01-open-source-launch","labels":["docs","setup"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **visitor on GitHub**, I want **a README that gives me a copy-paste setup prompt and explains the loop and the harness**, so that **I can adopt the workflow in minutes and understand what my agent is doing**.\n\n## Acceptance criteria\n\n- [x] The setup prompt (about 5 lines: run `npx loopboard init`, follow `.agents/SETUP.md`, run `npx loopboard`) lives in one docs file and is embedded in the README\n- [x] README sections: what it is (+ hero image slot for #0036), quick setup, the loop (grill → PRD → issues → implement → review → done), the harness (AGENTS.md + skills + `.agents/`), CLI reference, contributing, credits\n- [x] Docs for the loop, folder map and statuses live in the docs folder so the Help page (#0014) reuses them\n- [ ] A fresh agent session in an empty repo, given only the prompt, reaches a working board (manual check, noted in the PR)\n\n## Out of scope\n\n- The demo GIF — #0036\n\n## Notes\n\n- PRD stories 12, 17.\n\n## Review\n\nEverything but the last criterion is done (`docs/` holds the prompt and the\nworkflow pages; a Vitest test keeps the README's copy of the prompt in sync).\nI ran `loopboard init` and the CLI in a temp repo and got a working, empty\nboard — but \"a fresh agent session reaches a working board from the prompt\nalone\" needs a real, fresh agent session: paste the README prompt into one in\na throwaway repo once `npx loopboard` resolves (after #0001/#0035), and flip\nto `done` when it works.\n"},{"id":"0014","title":"Explain the workflow on an in-app Help page","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","docs"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **new user**, I want **a Help page inside loopboard that explains the loop, folder map, statuses and assignee, and shortcuts, with a one-click copy of the setup prompt**, so that **I learn the workflow where I use it**.\n\n## Acceptance criteria\n\n- [x] `/help` renders the docs-folder markdown bundled at build time (one source with the README)\n- [x] Reachable from a rail link and the `?` shortcut\n- [x] \"Copy setup prompt\" copies the exact prompt from the README and confirms\n- [x] The keyboard shortcut list matches the shortcuts the app registers (single source, not a hand-kept list)\n- [x] Playwright: open Help with `?`, copy the prompt\n\n## Out of scope\n\n- Search inside Help — the content is short\n\n## Notes\n\n- PRD stories 18, 19.\n\n## Outcome\n\n- `/help` renders `docs/*.md` (also linked from the README); `?` and a rail footer link open it; the shortcut table comes from `src/shortcuts.ts`, which the handlers use too.\n- Fixed the § 6 known gap on the way: \"/\" in the Specs view now focuses the scenario search.\n"},{"id":"0015","title":"Guide new workspaces with a setup empty state","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","setup"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **user who opened a repo without the workflow (or loopboard with no workspaces at all)**, I want **a setup screen with the prompt and the init command instead of an empty board**, so that **I know exactly what to do next**.\n\n## Acceptance criteria\n\n- [x] A workspace without a detectable root shows the empty state: what's missing, the copyable setup prompt, and `npx loopboard init`\n- [x] With no workspaces registered, the app shows a welcome state with \"+ Add workspace\" and the same prompt\n- [x] When the root appears on disk (live updates), the workspace switches to the board without a reload\n- [x] Playwright covers both states\n\n## Out of scope\n\n- Running `init` from the browser — setup stays an agent/terminal action\n\n## Notes\n\n- PRD story 20.\n\n## Outcome\n\n- Welcome page (no workspaces), missing-root page with Forget + polling recovery, and a first-steps feed for an empty workspace; all share `SetupPrompt.vue`.\n"},{"id":"0016","title":"Allocate branch-aware IDs with loopboard next-id","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["cli","ids"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer running agents in parallel worktrees**, I want **new issue and project numbers to take every branch and worktree on my machine into account**, so that **merges don't produce two #0091s**.\n\n## Acceptance criteria\n\n- [x] `loopboard next-id issue|project [path]` prints the next number: max across the working tree, `_archive/`, every worktree's working copy, every local branch and the remote-tracking refs, plus one\n- [x] Outside a git repo it falls back to a folder scan\n- [x] Output is zero-padded (4 digits for issues, 2 for projects) and machine-readable\n- [x] to-issues, to-prd and the issues/projects READMEs tell agents to call `next-id` instead of computing max+1\n- [x] Vitest with temp git repos: unmerged branch, second worktree, archive-only max, no git\n\n## Out of scope\n\n- Random/non-sequential IDs — rejected in the PRD\n- Duplicate detection — #0017\n\n## Notes\n\n- PRD story 21. A batch of N issues can call it once and increment locally, as the skills do today.\n\n## Outcome\n\n- `server/ids.ts`; real-path normalization needed on macOS (git reports `/private/var`). Skills to-issues/to-prd and both READMEs now call `npx loopboard next-id`.\n"},{"id":"0017","title":"Flag duplicate IDs and dangling references with loopboard check","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["cli","ids","ci"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **`loopboard check` to fail on duplicate issue/project IDs and report dangling `parent:` and `#NNNN` references**, so that **collisions that slip past the allocator are caught before merge**.\n\n## Acceptance criteria\n\n- [x] Duplicate IDs in the working tree (including archive) fail with exit code 1 and name the files\n- [x] `--branches` also compares against local and remote-tracking branches and names the branch that holds the twin\n- [x] Dangling `parent:` and `#NNNN` references are warnings (exit 0) unless `--strict`\n- [x] Each problem prints the fix command (e.g. `loopboard renumber 0091 0094`)\n- [x] This repo's `pnpm verify` and CI run it; `SETUP.md` suggests adding it to the adopter's verify\n- [x] Vitest covers each case\n\n## Out of scope\n\n- Fixing problems automatically — #0018\n\n## Notes\n\n- PRD story 22.\n\n## Outcome\n\n- `loopboard check [--branches] [--strict]`; this repo's verify runs it through a Vitest test (`this repo has no duplicate issue or project numbers`), so CI does too. SETUP.md suggests it for adopters.\n"},{"id":"0018","title":"Fix duplicates with loopboard renumber","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["cli","ids"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer with a duplicate number after a merge**, I want **`loopboard renumber <old> <new>` to rename the issue and rewrite every reference to it**, so that **cleanup is one command and no link breaks**.\n\n## Acceptance criteria\n\n- [x] Renames the file, updates the frontmatter `id:`, and rewrites `#old`, `parent: old` and wip.md links across `.agents/`\n- [x] `--file <path>` picks which of two duplicates to move; without it the command refuses an ambiguous old number\n- [x] `<new>` defaults to `next-id` when omitted\n- [x] Works for projects (`NN-slug` folder, `project:` fields, links)\n- [x] `--dry-run` prints the planned edits\n- [x] Vitest covers issue and project renumbering with references in several files\n\n## Out of scope\n\n- Rewriting commit messages or PR titles that mention the old number\n\n## Notes\n\n- PRD story 23.\n\n## Outcome\n\n- `loopboard renumber <old> [new] [--file] [--dry-run]`, `--path` for another repo; twins need `--file` and their ambiguous `#NNNN` mentions are listed, not rewritten.\n"},{"id":"0019","title":"Create an issue from the board","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","capture"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **to press `C` and create an issue (title, category, project, status, assignee) from its category template with the next free number**, so that **capturing an idea takes seconds and the file is shaped exactly like an agent would write it**.\n\n## Acceptance criteria\n\n- [x] `C` (and a \"New issue\" button) opens quick-create; defaults: category `task`, status `todo` (`backlog` when opened from the backlog drawer), assignee `agent`, project = the selected project\n- [x] The server writes `NNNN-slug.md` from the category template, numbered by the branch-aware allocator; the slug comes from the title\n- [x] The new issue appears via live updates and opens in the drawer\n- [x] The document-store tests and a Playwright test cover creation\n\n## Out of scope\n\n- Editing the body during creation — the editor arrives in #0024/#0026\n\n## Notes\n\n- PRD story 24.\n\n## Outcome\n\n- `POST /api/w/:ws/issues` (`server/create.ts`) + `CreateIssueDialog`; `C` and the rail \"+\". The dialog's assignee option reads \"You\", matching \"Needs you\".\n"},{"id":"0020","title":"Create a project from the UI","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","capture"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **to create a project (title → `NN-slug/` with `prd.md` and `wip.md` from the templates)**, so that **I can open a PRD without asking an agent first**.\n\n## Acceptance criteria\n\n- [x] \"New project\" (rail and ⌘K once #0021 lands) asks for a title\n- [x] The server writes `prd.md` and `wip.md` from the templates, with the drafted date and a kickoff activity-log entry; the number comes from the allocator\n- [x] The project appears in the rail and opens on its PRD tab\n- [x] Playwright covers creation\n\n## Out of scope\n\n- Generating PRD content — that is the to-prd skill's job; \"Copy agent prompt\" (#0022) bridges to it\n\n## Notes\n\n- PRD story 25.\n\n## Outcome\n\n- `POST /api/w/:ws/projects`; the rail's projects section \"+\" and ⌘K; the new project opens on its PRD tab once live data has it.\n"},{"id":"0021","title":"Jump and act with a ⌘K command palette","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","navigation"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **keyboard user**, I want **a ⌘K palette that jumps to any issue, project, spec or workspace and runs actions**, so that **I never hunt through the rail**.\n\n## Acceptance criteria\n\n- [x] ⌘K / Ctrl+K opens the palette; fuzzy search over issue id/title, projects, specs and workspaces\n- [x] With an issue selected: change status, toggle assignee, copy agent prompt, open in editor\n- [x] Global actions: new issue, new project, switch workspace, open Help, toggle theme (each appears once its slice has shipped)\n- [x] Actions come from one registry that the shortcut list in Help also reads\n- [x] Playwright: jump to an issue, change its status\n\n## Out of scope\n\n- User-defined commands\n\n## Notes\n\n- PRD story 26.\n\n## Outcome\n\n- `CommandPalette` + `commands.ts` ranking; WorkspaceView builds context, actions, issues, projects, specs and workspaces. \"Move to Wontfix\" through the palette makes the wontfix flow reachable again (spec § 4's known gap is gone). Commands don't have their own registry beyond `shortcuts.ts` — Help lists the shortcuts, the palette lists the commands.\n"},{"id":"0022","title":"Copy an agent prompt for any issue or project","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","agents"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **a \"Copy agent prompt\" action on every issue and project that produces the right skill invocation**, so that **handing work to Claude Code, Cursor or Codex is one paste**.\n\n## Acceptance criteria\n\n- [x] Issue → `Use the implement skill on #NNNN.`; issue assigned to human with `## Questions` → a prompt to continue after the answers; project without issues → `Run the to-issues skill on project NN-slug.`; project → `Continue project NN-slug: read wip.md Current focus and implement the next todo.`\n- [x] Prompt templates live in one module with unit tests\n- [x] Available on cards (hover), in the drawer, on the project pane and in ⌘K\n- [x] A toast confirms the copy\n\n## Out of scope\n\n- Launching an agent directly — out of scope in the PRD\n\n## Notes\n\n- PRD story 27. No dependency on other slices; can be picked up any time.\n\n## Outcome\n\n- `src/prompts.ts` (unit-tested), drawer button, pane-header button, card hover icon, ⌘K; toasts confirm.\n"},{"id":"0023","title":"See what needs me across all workspaces","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","workspaces"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer with several repos**, I want **a \"Needs you\" view across all workspaces (human-assigned, not done; plus blocked), grouped by repo**, so that **nothing waiting on me hides in a repo I didn't open today**.\n\n## Acceptance criteria\n\n- [x] A switcher entry \"All workspaces · Needs you\" shows items from every available workspace, grouped by repo, newest first\n- [x] Clicking an item switches to its workspace with the item selected\n- [x] Unavailable workspaces are listed as skipped, not as errors\n- [x] The view reads workspaces in parallel and stays responsive with the maintainer's repo sizes (800+ issues)\n- [x] Playwright with two fixture workspaces\n\n## Out of scope\n\n- Live-watching every workspace — this view refetches on open and on focus\n\n## Notes\n\n- PRD story 28.\n\n## Outcome\n\n- `GET /api/needs-you` + `/needs-you` view; switcher entry; `?item=` deep link selects the issue; refetch on window focus.\n"},{"id":"0024","title":"Edit an issue's markdown with conflict detection","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["editor","server"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **to edit an issue's markdown in the drawer and be warned if an agent changed the file meanwhile, with Reload, Compare and Overwrite**, so that **neither of us silently loses work**.\n\n## Acceptance criteria\n\n- [x] Document reads return content + content hash; writes send the base hash; a mismatch returns 409 with the current disk content\n- [x] Writes are atomic (temp file + rename) and never leave partial files\n- [x] The drawer gets an Edit mode (plain markdown source for now) with save (⌘S) and cancel\n- [x] On 409 a banner offers Reload (discard mine), Compare (side-by-side diff) and Overwrite\n- [x] If the open file changes on disk while there are no unsaved edits, it reloads silently\n- [x] Vitest for the document store (conflict, atomic write); Playwright: edit → external write → conflict banner\n\n## Out of scope\n\n- Rich-text editing — #0026\n- PRD/WIP/spec editing — #0027\n\n## Notes\n\n- PRD stories 31, 33. This source mode stays as the \"Source\" toggle once WYSIWYG lands.\n\n## Outcome\n\n- `server/docs.ts` (GET/PUT with content hashes, 409 + current content) and `DocEditor`; heads-up when the file changes under unsaved edits, silent follow otherwise, Compare via `src/diff.ts`.\n- Found and fixed a data-loss race: typing before the document loaded was overwritten by the late load — the editor is now disabled until loaded.\n"},{"id":"0025","title":"Splice edited markdown blocks back into the original file","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["editor"],"created":"2026-10-04","category":"task","archived":false,"body":"\n## What needs to change\n\nA deep module that parses a markdown body into top-level blocks with source\noffsets and, given the original text plus the editor's document, re-serializes\nonly the blocks that changed and splices them into the original. Inserted and\ndeleted blocks are handled; untouched blocks stay byte-exact.\n\n## Why\n\nThe WYSIWYG editor (#0026) would otherwise normalize list markers, table\npadding and escapes on every save, producing noisy git diffs and rewriting\nagent-authored formatting.\n\n## Acceptance criteria\n\n- [x] Round-trip with no edits returns the input unchanged for every fixture file and every file in this repo's `.agents/`\n- [x] Editing one block changes only that block's lines (diff assertion)\n- [x] Insert, delete and reorder of blocks produce minimal diffs\n- [x] Constructs the serializer can't round-trip (e.g. complex tables, HTML blocks) are reported so the editor can lock them to Source mode\n\n## Out of scope\n\n- The editor UI — #0026\n\n## Notes\n\n- PRD story 30. Pick the markdown AST library together with the editor choice in #0026 (they must agree on the block model).\n\n## Outcome\n\n- `src/splice.ts`: top-level blocks from `marked.lexer` (their raws reconstruct all 130 repo docs exactly); \"unchanged\" = same normalized rendered HTML, so formatting-only differences keep original bytes; LCS for inserts/deletes; the file keeps its original ending. Raw blocks (tables, HTML, link definitions) travel as `loopboard-raw` code blocks.\n"},{"id":"0026","title":"Edit issues in a WYSIWYG editor","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["editor","ui"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **to edit issues in a Linear-like rich-text editor, with frontmatter as form fields and `#` to link issues**, so that **small changes don't need my code editor and never break the YAML or the formatting**.\n\n## Acceptance criteria\n\n- [x] Rich-text editing (TipTap or Milkdown, decision recorded as an ADR) for headings, lists, checklists, links, code and quotes\n- [x] Saves go through the block splice (#0025), so untouched lines stay byte-exact\n- [x] A WYSIWYG/Source toggle; blocks the splice can't round-trip open in Source mode\n- [x] Frontmatter is edited via fields (title, status, assignee, labels, project, parent), never in the rich-text surface\n- [x] Typing `#` suggests issues by number/title and inserts `#NNNN`\n- [x] Checklist items toggle with one click\n- [x] Playwright: edit a checklist item and a paragraph, save, and assert the file diff is only those lines\n\n## Out of scope\n\n- Real-time collaborative editing\n\n## Notes\n\n- PRD stories 29, 32, 35. Also depends on #0025.\n\n## Outcome\n\n- TipTap 3 + official `@tiptap/markdown` (marked-based, same parser as the rest of the app). Fields form via `shared/frontmatter.ts` (line edits that keep trailing comments). `#` autocomplete built in RichEditor. Mode remembered per browser.\n- Decision: fields and body save together in one hash-checked write (one Save, one conflict model) rather than instant field PATCHes.\n"},{"id":"0027","title":"Edit PRDs, WIPs and specs in the same editor","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["editor","ui"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **the PRD, WIP and spec tabs to use the same editor as issues**, so that **every document loopboard shows is editable in place**.\n\n## Acceptance criteria\n\n- [x] PRD and WIP tabs on the project pane get Edit, with the same conflict handling\n- [x] Spec documents are editable from the Specs view; coverage percentages recompute after save\n- [x] The document header (`> Drafted:`, `> Status:`) is preserved byte-exact unless edited\n- [x] Playwright covers editing a WIP current-focus paragraph\n\n## Out of scope\n\n- Architecture docs and rules — they aren't rendered in loopboard today\n\n## Notes\n\n- PRD story 34.\n\n## Outcome\n\n- \"Edit PRD\" / \"Edit WIP\" on the project tabs and \"Edit spec\" in the Specs view; coverage recomputes through live updates.\n"},{"id":"0028","title":"Show blocking relations and sub-issues","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","structure"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **each issue to show what blocks it and what it blocks, with sub-issue progress and a warning on a todo whose parent isn't done**, so that **I (and my agents) pick work that is actually unblocked**.\n\n## Acceptance criteria\n\n- [x] The drawer shows \"Blocked by #NNNN\" (from `parent:`) and \"Blocks #…\" (reverse lookup), each with its status\n- [x] An issue that others point to shows a sub-issue checklist with done/total\n- [x] Cards whose parent isn't `done` show a blocked badge; the board filter can hide them\n- [x] Links to missing or archived issues render clearly\n- [x] Unit tests for the relation index; Playwright for the drawer section\n\n## Out of scope\n\n- New relation types or schema fields — `parent:` is the only relation\n\n## Notes\n\n- PRD stories 36, 37.\n\n## Outcome\n\n- `src/relations.ts` (unit-tested) shared through the workspace context; drawer Relations strip, card \"waiting on\" badge, \"Hide waiting N\" board toggle.\n"},{"id":"0029","title":"Track project progress on a projects overview","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","structure"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **a projects overview listing every project with its progress (overall and per wip.md phase), status, last session and the count needing a human**, so that **I see where every project stands at a glance**.\n\n## Acceptance criteria\n\n- [x] `/w/:id/projects` lists projects grouped by status (active, paused, shipped)\n- [x] Each row shows a done/total bar (wontfix counts as closed), per-phase bars from the wip.md phase headings, last session date and the human-assigned count\n- [x] Clicking a project opens its board\n- [x] Phase parsing has unit tests against fixture WIPs (including WIPs without phases)\n\n## Out of scope\n\n- Timelines, Gantt charts and target dates — projects carry no dates beyond sessions\n\n## Notes\n\n- PRD story 38.\n\n## Outcome\n\n- `/w/:ws/projects` (`ProjectsView`, `src/projects.ts`); rail entry and ⌘K. Real-repo check found WIPs with dated headings under Phases — the parser skips them.\n"},{"id":"0030","title":"Show git activity on an issue","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","git"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **an issue to list the commits and branches that mention it and the history of its file**, so that **I know what the agent actually did without leaving loopboard**.\n\n## Acceptance criteria\n\n- [x] The drawer shows commits whose message mentions `#NNNN` (subject, short hash, date, branch) and local branches whose name contains the number\n- [x] A history section lists commits touching the issue file, with status changes derived from the frontmatter diff\n- [x] Repos without git, or with git missing, hide the section without errors\n- [x] Results are computed on demand per issue and cached until the next file change\n- [x] Vitest with a temp git repo\n\n## Out of scope\n\n- GitHub/GitLab API (PR status, CI) — local git only\n\n## Notes\n\n- PRD story 39.\n\n## Outcome\n\n- `server/activity.ts` (git log `--follow` with per-version status, `--grep` for mentions, branch names), cached on HEAD + file mtime; `server/git.ts` now shared with the ID allocator. Drawer \"History\" loads on open.\n"},{"id":"0031","title":"Browse issues in a grouped list view","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","views"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer with hundreds of issues**, I want **a dense list view next to the board, grouped by status, project or label and filterable**, so that **large repos stay scannable**.\n\n## Acceptance criteria\n\n- [x] A Board/List toggle on the project pane and on the standalone issues view\n- [x] List rows show id, title, status, assignee, labels, project and created; keyboard navigation with `j`/`k`\n- [x] Group by status, project or label; filter by assignee, label and status\n- [x] Renders 800+ issues smoothly (virtualized if needed)\n- [x] Playwright covers grouping and filtering\n\n## Out of scope\n\n- Saving views — #0032\n\n## Notes\n\n- PRD story 40.\n\n## Outcome\n\n- `/w/:ws/issues` (`ListView` + `IssueList`, `src/list.ts`): group by status (board order) / project / label / none, assignee, status chips, label, text; filters in the URL; `j`/`k` + Enter. The project pane has a Board/List toggle (remembered).\n- Decision (see wip questions): the rail now lists destinations only — Inbox, Needs you, Issues (list), Projects, Specs; \"Sessions\" and \"Issues\" as feed filters live on as the feed's chips.\n"},{"id":"0032","title":"Save filtered views per workspace","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","views"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **to save the current layout, grouping and filters as a named view per workspace**, so that **recurring questions like \"bugs in review\" are one click**.\n\n## Acceptance criteria\n\n- [x] \"Save view\" stores name, layout, grouping and filters per workspace in the user config (not in the repo)\n- [x] Saved views appear in the rail under the workspace and in ⌘K\n- [x] Rename and delete views\n- [x] Views referencing a removed label or project still open, with that filter shown as stale\n- [x] Playwright covers save → reload → open\n\n## Out of scope\n\n- Sharing views via the repo — views are personal\n\n## Notes\n\n- PRD story 41.\n\n## Outcome\n\n- `GET/PUT /api/w/:ws/views` in the user config; a view is a name + the list's query. Rail \"Views\" section, ⌘K group, Save / Rename & update / Delete in the list header; a vanished label shows as \"(no issues)\".\n"},{"id":"0033","title":"Codify the look in a Brand Kit with a loopboard wordmark","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["design"],"created":"2026-10-04","category":"task","archived":false,"body":"\n## What needs to change\n\nCapture the current redesign as `.agents/design/Brand Kit.html`: color tokens\n(paper, ink, ember and the status hues), type (Fraunces, Geist, JetBrains\nMono), spacing, and the core components (card, chip, column, rail row, drawer,\nstrip), each rendered live. Propose three loopboard wordmark/logo options in\nthe kit; the maintainer picks one during review, and it becomes the favicon\nand the rail brand.\n\n## Why\n\nAGENTS.md routes UI work through a Brand Kit that doesn't exist in this repo.\nIt also doubles as the example for the `design/` folder that `init`\nscaffolds.\n\n## Acceptance criteria\n\n- [x] The Brand Kit renders every token and component from the real stylesheet (no copied values that can drift)\n- [x] Three wordmark options are shown; the chosen one is applied to the favicon and rail\n- [x] AGENTS.md's Brand Kit link resolves\n\n## Out of scope\n\n- Dark theme — #0034\n- A visual redesign — the PRD keeps the current direction\n\n## Notes\n\n- PRD story 43. The wordmark choice is a design judgment: the agent proposes, the maintainer decides in review.\n\n## Outcome\n\n- `.agents/design/Brand Kit.html`: written UI rules for agents, live swatches (read from the stylesheet, light/dark toggle), type and component samples; three wordmark options. Option A (serif \"loop*board*\") is applied as the default in the welcome page and Help; the favicon uses option B's loop mark.\n- Fonts are now self-hosted (`@fontsource-variable/*`) — no Google Fonts request.\n\n## Review\n\nPick the wordmark (A, B or C in the Brand Kit's Wordmark section, or none\nof them). A is applied as the "},{"id":"0034","title":"Add a dark theme","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["design","ui"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **a dark theme that follows my system setting, with a manual toggle**, so that **loopboard fits the rest of my setup**.\n\n## Acceptance criteria\n\n- [x] Dark values for every token, applied through `prefers-color-scheme` and overridable by a light/dark/system toggle remembered per browser\n- [x] Status and project colors keep WCAG AA contrast in both themes\n- [x] The Brand Kit shows both themes\n- [x] Playwright covers the toggle; screenshots in both themes are reviewed in the PR\n\n## Out of scope\n\n- Custom user themes\n\n## Notes\n\n- PRD story 42.\n\n## Outcome\n\n- Dark tokens + `data-theme` (inline pre-paint script, `src/theme.ts`), rail toggle and ⌘K; `scripts/contrast.mjs` (in `pnpm verify`) — fixing light-theme failures on the way (`ink-4`, `ember-deep`, new `rose-deep`). Visual regression baselines for the main screens in both themes.\n"},{"id":"0035","title":"Automate npm releases and test the packed CLI on every OS","status":"in-review","assignee":"human","project":"01-open-source-launch","labels":["ci","release"],"created":"2026-10-04","category":"task","archived":false,"body":"\n## What needs to change\n\n- A `files` allowlist so the package ships only the built client, server,\n  CLI and scaffold sources.\n- A CI job that packs the tarball and, on macOS, Linux and Windows, runs\n  `npx <tarball> init` in a temp repo, then starts the server and hits\n  `/api/w/:id/data`.\n- Tag-driven publishing to npm (with provenance), plus a changelog.\n\n## Why\n\nThe CLI is the product. A broken publish is the worst possible first\nimpression, and Windows path/symlink handling only shows up on Windows.\n\n## Acceptance criteria\n\n- [x] `private: true` is removed and `repository`/`homepage` are set (deferred here from #0003)\n- [x] `npm pack` contains no tests, fixtures, `.agents/issues` or prototypes\n- [ ] The smoke job passes on all three OSs — passes locally on macOS (`pnpm smoke`); CI runs after the first push\n- [ ] Pushing a version tag publishes to npm with provenance and updates the changelog\n\n## Out of scope\n\n- Homebrew or other package managers\n\n## Notes\n\n- Needs the npm name from #0001 and a publish token configured by the maintainer.\n\n## Outcome\n\n- `scripts/smoke.mjs` (also guards the tarball's contents), CI runs it on all\n  three OSs after build; `release.yml` publishes on `v*` tags with provenance\n  and creates a GitHub release from the CHANGELOG; `prepublishOnly` rebuilds\n  and verifies. `CHANGELOG.md` added.\n\n## Review\n\nNeeds the maintainer: add the `NPM_TOKEN` secret and confirm CI (incl.\nsmoke) is green on the first push (running since 2026-10-05).\n`repository`/`homepage`/`bugs` point at github.com/MariusBongarts/loopboard. Then tag `v1.0.0` from #0036.\n"},{"id":"0036","title":"Record the README demo and go public","status":"todo","assignee":"human","project":"01-open-source-launch","labels":["oss","launch"],"created":"2026-10-04","category":"task","archived":false,"body":"\n## What needs to change\n\n- Record the hero GIF: an agent working through an issue while cards move\n  live on the board. Done by an agent as a scripted, re-recordable demo\n  (`pnpm demo`); the maintainer judges the result.\n- Final pass on the launch gate: every other issue in this project is `done`\n  or `wontfix`, and the ship gate in `wip.md` is complete.\n- Make the repo public, publish 1.0, announce.\n\n## Why\n\nThe PRD's launch gate: go public only after every phase ships.\n\n## Acceptance criteria\n\n- [x] README hero GIF in place\n- [ ] All other project issues are `done`/`wontfix`; ship summary filled in\n- [ ] Repo public; `npx loopboard` installs 1.0 from npm\n- [ ] Announcement posted\n\n## Out of scope\n\n- Hosted demo site — #0038 (backlog)\n\n## Notes\n\n- Human-assigned: needs account access and marketing judgment.\n- Demo (2026-10-05): `pnpm demo` films the real board while\n  [`scripts/demo/`](../../scripts/demo/) edits a demo repo's issue files like\n  an agent; light + dark GIFs in `docs/media/`, swapped by a `<picture>` in\n  the README. Deterministic, so `.github/workflows/demo.yml` re-records on\n  pushes to main and opens a `bot/readme-demo` PR only when the UI changed.\n  For that PR the repo needs \"Allow GitHub Actions to create pull requests\"\n  (Settings → Actions → General); otherwise the branch is pushed and you open\n  it by hand. The workflow hasn't run yet (no remote).\n- The repo is public since the first push (2026-10-05, personal account);\n  `package.json` has `repository`, so npm resolves the README's GIF paths.\n- Launch gate on 2026-10-05: still open — #0001 (todo),"},{"id":"0037","title":"Wrap loopboard in a Mac desktop app","status":"backlog","assignee":"agent","project":"01-open-source-launch","labels":["distribution"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer who prefers native apps**, I want **loopboard as a Mac app with a dock icon, recent workspaces and a native folder picker**, so that **I don't keep a terminal open for it**.\n\n## Acceptance criteria\n\n- [ ] A Tauri (or similar) shell starts the same local server and shows the client\n- [ ] Signed and notarized; auto-update\n\n## Out of scope\n\n- Rewriting the server natively — the wrapper reuses the Node server\n\n## Notes\n\n- Deferred in the PRD: npx covers every OS without signing or notarization. Revisit when users ask for it.\n"},{"id":"0038","title":"Host a read-only public demo of loopboard","status":"backlog","assignee":"agent","project":"01-open-source-launch","labels":["distribution","docs"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **visitor**, I want **to click through a live, read-only loopboard showing this repo's own `.agents/`**, so that **I can judge it before installing anything**.\n\n## Acceptance criteria\n\n- [ ] A static export (`loopboard export`) bakes one workspace's data into the built client\n- [ ] Read-only UI state: no drag, edit or create; a banner links to setup\n- [ ] Deployed to GitHub Pages from CI on each release\n\n## Out of scope\n\n- Any hosted backend\n\n## Notes\n\n- Deferred in the PRD: not required for launch.\n"},{"id":"0039","title":"Close verified issues as done; review and deploy become optional markers","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["workflow","conventions"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **solo developer working with agents**, I want **agents to close verified issues as `done` and park an issue in `in-review` only when it truly needs me**, so that **`in-review` means \"waiting on me\" and stops being a graveyard**.\n\n## Why now\n\nIn webhighlights, 340 of 822 live issues (41%) sit in `in-review`, back to\nMay; 331 of them are assigned to the agent. Nobody reviews them, so the\ncolumn no longer says anything.\n\n## Acceptance criteria\n\n- [x] The issues README redefines `in-review`: implementation done but it can't count as done until a human checks it (manual UI, OAuth, visual or product judgment); always with `assignee: human` and a `## Review` section saying what to check\n- [x] The issues README documents optional `reviewed: YYYY-MM-DD` and `deployed: YYYY-MM-DD` frontmatter; agents never set `reviewed`\n- [x] AGENTS.md's session loop: verify passes + ACs met → `done`; otherwise `in-review` + `assignee: human`\n- [x] implement, triage and to-issues skills follow the new loop\n- [x] The glossary (specs § 0) defines In review, Reviewed and Deployed\n- [x] The tracker reads issues carrying `reviewed:`/`deployed:` unchanged (Vitest)\n\n## Out of scope\n\n- Showing or setting the markers on the board — #0040\n- Rolling the change out to other harnesses — #0041 (migration M002)\n\n## Notes\n\n- PRD stories 48–49. The status vocabulary itself doesn't change.\n"},{"id":"0040","title":"Show reviewed and deployed markers and mark an issue reviewed in one click","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","workflow"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer**, I want **to see which done issues I've reviewed or deployed, filter to \"done · not reviewed\", and mark one reviewed with one click**, so that **review is a queue I can work through when I choose, not a column that blocks the loop**.\n\n## Acceptance criteria\n\n- [x] The server reads `reviewed:` and `deployed:` as ISO days (same normalisation as `created:`)\n- [x] Cards and the drawer show small \"reviewed\" / \"deployed\" badges with the date on hover\n- [x] The drawer has \"Mark reviewed\" (writes today's date via the targeted frontmatter rewrite) and \"Unmark\"\n- [x] The board filter offers \"Done · not reviewed\" with a count\n- [x] Specs updated; Playwright covers marking an issue reviewed\n\n## Out of scope\n\n- Setting `deployed:` from a deploy pipeline — a later hook or skill\n\n## Notes\n\n- PRD story 50.\n\n## Outcome\n\n- Server reads `reviewed`/`deployed`; `mutate` sets/removes them via a shared `setLine`. Drawer badges + Mark/Unmark reviewed, card badges, \"Done · not reviewed N\" board toggle, ⌘K action.\n- Fixed on the way: every board write had been deleting the blank line between frontmatter and body; writes now replace the frontmatter block in place (byte-preservation test).\n"},{"id":"0041","title":"Upgrade running harnesses with an upgrade-harness skill and numbered migrations","status":"in-review","assignee":"human","project":"01-open-source-launch","labels":["workflow","setup","skills"],"created":"2026-10-04","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **developer with harnesses already running in several repos (some with customized skills and an `ai/` root)**, I want **to tell my agent \"upgrade my loopboard harness\" and have it merge the latest skills and conventions into my repo and apply pending workflow migrations, asking before bulk changes**, so that **workflow improvements reach every repo without overwriting my customizations**.\n\n## Acceptance criteria\n\n- [x] `MIGRATIONS.md` lists numbered workflow migrations: what changed, why, how to apply to an existing harness, and which steps need confirmation. M001 = conventions from #0002–#0004; M002 = the review loop from #0039\n- [x] A harness records its level in AGENTS.md as `<!-- loopboard:migration MNNN -->`; no marker means M000\n- [x] An `upgrade-harness` skill finds the upstream (local clone, installed package or GitHub), reports pending migrations, merges upstream skills/READMEs into local copies (keeping local customizations, adapting `.agents/` paths to the harness root), applies each migration, asks before bulk data edits, and bumps the marker\n- [x] A report-only mode lists what would change without writing — dry-run against webhighlights (read-only): root `ai/`, level M000, 9 skills differ (6 only by the credit line; implement, to-issues, triage, grill-with-docs carry real customizations), upgrade-harness new, 34 local-only skills kept, M002 would offer 331 agent-assigned in-review issues → done\n- [x] It's a core skill (linked into `.claude/` and `.cursor/`, listed in CREDITS as original); this repo's AGENTS.md carries the latest marker\n- [x"},{"id":"0042","title":"Malformed issue files come back as ghost issues after the first read","status":"done","assignee":"agent","project":null,"labels":["server"],"created":"2026-10-04","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. Put an issue file with invalid YAML frontmatter in the root, e.g. an\n   unquoted colon: `title: Someday: dark mode`.\n2. Load the board (first `GET /api/data`), then reload it.\n\n## Current\n\nThe first read skips the file with \"[loopboard] skipping …\". Every later read\nreturns it as an issue titled with its filename, status `todo`, no date — so\nit lands in the feed under \"No date\" and in the Todo column. gray-matter\ncaches a file *before* parsing it, and the throw leaves an empty cached entry\nthat later calls return without parsing.\n\n## Expected\n\nThe file is skipped on every read, as specs § 1 \"A malformed issue file does\nnot break the board\" says.\n\n## Acceptance criteria\n\n- [x] Reading the same malformed file twice skips it both times (Vitest regression)\n- [x] Issue writes (`mutate`) are not affected by stale cache entries either\n- [x] A malformed fixture file + Playwright test cover the § 1 scenario\n\n## Out of scope\n\n- Surfacing skipped files in the UI\n\n## Notes\n\n- Found while building the e2e fixture in #0006. Passing an options object to\n  `matter()` bypasses its cache.\n"},{"id":"0043","title":"Cover every spec scenario end to end, the CLI included","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["testing"],"created":"2026-10-05","category":"task","archived":false,"body":"\n## What needs to change\n\nEvery `### Scenario:` in `.agents/specs/` gets a Playwright test, so no\ncoverage row stays ❌. The CLI scenarios (§ 1, § 8, § 10) run the built\n`loopboard` binary against temp repos and git, not just the unit-level\nfunctions.\n\n## Why\n\nThe specs are the contract a contributor reads first. Rows marked ❌ while\nthe behavior only had unit tests said \"untested\" when the user-facing path\n(the binary, the browser) never ran in CI.\n\n## Acceptance criteria\n\n- [x] No ❌ left in any `## E2E coverage` table; 🟡 rows name what is not asserted\n- [x] `tests/e2e/cli.spec.ts` runs the built binary (global setup builds it)\n- [x] Rail, board, drawer, backlog, specs view and failed-write scenarios covered\n- [x] `pnpm verify` and `pnpm test:e2e` pass\n\n## Out of scope\n\n- Browser auto-open (`--no-open` in tests); the packed-tarball smoke stays in `pnpm smoke`\n\n## Notes\n\n- `#NNNN` in the drawer body became clickable on the way (linkify).\n- Fixes found by the new tests: the backlog's Promote button had no clean\n  accessible name, `?spec=` links were ignored before specs loaded, and a\n  successful reload wiped a failed write's error banner.\n"},{"id":"0044","title":"Visual review — board overflow hint, list chips, relation dots, tighter baselines","status":"done","assignee":"agent","project":"01-open-source-launch","labels":["ui","testing"],"created":"2026-10-05","category":"task","archived":false,"body":"\n## What needs to change\n\nFixes from a visual review of the baselines and the dogfood board:\n\n- With the feed open, In review and Done sit off-screen with nothing saying\n  so. The board fades the edge that hides columns.\n- List rows rendered project and label chips in 13px sans, unlike every\n  other chip. They use the card chips' mono size now.\n- The drawer's \"Blocks\" rows used a square that looked like a checkbox right\n  next to the body's real checkboxes. It is a round status dot now.\n- The
