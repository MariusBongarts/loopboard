intainer opening a harness I haven't touched for months**, I want **a\nHome tab that shows what the harness is, where it sits in the tree, its\n`INDEX.md` and its `AGENTS.md`**, so that **I see what it's for and where\nthings are without opening my editor**.\n\n## Acceptance criteria\n\n- [ ] Every workspace has a Home view showing its identity — name, id, aliases, kind, type, the purpose paragraph, its parent as a link and its children — and the harness folder's `INDEX.md` and `AGENTS.md`, rendered read-only\n- [ ] An index node opens on Home, replacing the plain page from #0081\n- [ ] Links inside `INDEX.md` and `AGENTS.md` behave as in #0097: a relative markdown file opens in the document view, a broken link is marked, qualified references resolve; other files offer Open and Reveal once #0110 has landed\n- [ ] A missing `INDEX.md` or `AGENTS.md` shows one line saying what the file is for, and a harness without an identity file shows a hint naming the migration — neither is an error\n- [ ] The two files are read thro"},{"id":"0099","title":"List and forget registered workspaces from the CLI","status":"in-review","assignee":"human","project":null,"labels":["cli","workspaces"],"created":"2026-10-13","category":"task","archived":false,"body":"\n## What needs to change\n\nThe registry collects dead entries, and only a running board can show or\nremove them. A workspace's id is tied to its path, so a harness whose root\nmoved (`ai/` → `.agents/`) stays behind as a \"folder missing\" entry next to\nits new twin, and a git worktree that was opened once stays registered as a\nworkspace of its own. The only way to see or remove them is the \"Manage\nworkspaces\" dialog.\n\nGive the CLI a command that lists the registry and forgets entries.\n\n## Why\n\nProject 04 registers many more folders than today. The registry should be\nclean before the nodes of a tree go in, and agents need to read it: the\nidentity migration asks a harness which id it is registered under (#0103).\n\n## Acceptance criteria\n\n- [x] `loopboard workspaces` lists every registered workspace with id, name, path and whether its folder exists; `--json` prints the same as data\n- [x] `loopboard workspaces forget <id>…` removes those entries, prints what it removed and never touches a harness's files; an unknown id exits 1 and changes nothing\n- [x] Both work without a running board and without git, from any folder; a running board shows the change on its next load\n- [x] `--help`, the README's CLI table and spec § 7 describe the command; tests use their own config directory\n\n## Out of scope\n\n- `--missing` (forget every entry whose folder is gone) and telling a git worktree from its main checkout — add them if cleaning by id gets tedious; #0080 changes how worktrees register anyway\n- Keeping one entry when a harness moves — that needs the identity file (#0079, #0080)\n- Deleting a"},{"id":"0100","title":"A qualified reference in a WIP note links to the local issue with the same number","status":"done","assignee":"agent","project":null,"labels":["ui","ids"],"created":"2026-10-13","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. In a workspace that has an issue 0003, open a project's `wip.md` and write\n   `shop#0003` — meaning issue 0003 of another harness — into \"Current\n   focus\", or into the first bullet of a dated entry in the activity log.\n2. Write `shop#0003` on a line under a `### Phase` heading of the same WIP.\n3. Open the project in the board.\n\n## Current behavior\n\n- The current focus and the session note show `shop` as plain text followed\n  by a button `#0003` that opens the **local** issue 0003. A pinned note does\n  the same.\n- The local issue 0003 is counted as a member of that phase, so the phase's\n  progress and its issue list are wrong.\n\nFour places match `#NNNN`. Two of them — `loopboard check` and the linkifier\nof issue bodies — skip a number that directly follows a letter or digit. The\nother two — the one that splits note text into issue buttons, and the one\nthat collects a phase's issues from the WIP — match any `#` followed by four\ndigits.\n\n## Expected behavior\n\n`#NNNN` directly after a letter or digit is not a local reference, anywhere.\n`shop#0003` stays plain text until qualified references become links\n(#0084), and it never counts towards a phase.\n\n## Acceptance criteria (verification)\n\n- [x] The note text and the phase parser no longer treat `shop#0003` as issue 0003; an unqualified `#0003` works in both as before\n- [x] All four matchers share one pattern from `shared/`, so they can't drift apart again\n- [x] Regression tests pin, for the note segments and for the phase parser: `shop#0003`, `#0003`, `(#0003)`, `#0003.` and a number inside an issue-f"},{"id":"0101","title":"Record the identity file, the id pattern and the reference syntax in ADRs","status":"in-progress","assignee":"human","project":"04-harness-tree","labels":["docs","conventions","ids"],"created":"2026-10-13","category":"task","archived":false,"body":"\n## What needs to change\n\nThe contract of project 04 is decided in outline: an identity file per\nharness, descriptive ids, three reference forms. Its details are not — how\nexactly an id may look, which words it can never be, where a path reference\nends — and the PRD marks them as assumed. Write them down as two ADRs, and\ndocument the reserved fields and reference forms where agents in every\nharness read them.\n\nNo code changes.\n\n## Why\n\nAn id \"never changes\", and `loopboard init --kind docs` (#0078) writes ids\ninto identity files before a tree of harnesses exists. A pattern that is\ntightened later would invalidate ids and references that are already on\ndisk. One collision exists today: `source: github#1234`, a shipped\nconvention, has exactly the shape of a reference to issue 1234 in a harness\ncalled `github`.\n\n## Questions\n\nThree are left, assigned to the maintainer. The first two become part of\nthe on-disk format. Both have the answer the PRD and the issues assume — \"as\nproposed\" is a complete reply — and\n[ADR-0007](../architecture/decisions/0007-identity-file-in-the-harness.md)\nrecords that answer as **assumed**. They keep their numbers, because #0079,\n#0080 and the WIP cite them. The third came out of the review of #0078 and\ncarries its number from the WIP.\n\n5. **A shared repository's identity file.** In a git repository that others\n   clone, `id`, `name`, `parent` and `aliases` are public. Proposal: the\n   file holds the project's id and name and a parent that is true for\n   everyone, or `null`; a personal name or parent lives in the per-user\n   registry as an override ("},{"id":"0102","title":"Keep a docs harness lean when it is upgraded","status":"todo","assignee":"agent","project":"04-harness-tree","labels":["setup","skills","help"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **person with a docs harness in a cloud-synced folder**, I want **an\nupgrade to bring new conventions without adding skills, symlinks or code\nfolders**, so that **the harness stays what `loopboard init --kind docs` set\nup**.\n\n## Acceptance criteria\n\n- [ ] The upgrade-harness skill reads `type: docs` from `.agents/harness.md`. In a docs harness it offers and adds no skills, creates no links under `.claude/` or `.cursor/`, adds no code seed folders, and merges the docs variants of the workflow block, the READMEs and the templates — not the code ones\n- [ ] Its report says \"docs harness\" and lists what it leaves out on purpose, so a missing skill doesn't read as a gap\n- [ ] A docs harness has no upgrade-harness skill of its own: its workflow block names the upgrade prompt from Help → Upgrade as the way to upgrade, and that page's section \"A repo without the skill\" says it is also the way for a harness that has no skills by design\n- [ ] The harness table in Help → Upgrade shows a docs harness with its migration level and marks it as a docs harness — never as \"No AGENTS.md\", and never behind for a skill it doesn't have\n- [ ] The harness-status test gets a docs fixture (identity file, no skills, an older migration level)\n- [ ] Spec § 8 and § 9 gain the scenarios\n\n## Out of scope\n\n- `init` and `init --upgrade` in a docs harness — #0078 keeps them lean\n- Skills for docs harnesses, from a shared user-level folder or as copies — deferred in `wip.md`\n- The migration that adds the identity file to existing harnesses — #0103\n\n## Notes\n\n- PRD story 13. `init --upgrade"},{"id":"0103","title":"Write the identity file for code harnesses and add it to existing ones","status":"todo","assignee":"agent","project":"04-harness-tree","labels":["cli","setup","conventions"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer with running harnesses**, I want **`loopboard init` to\nwrite the identity file for a code harness, and an upgrade to add it to the\nharnesses I already have under the id they are known by**, so that **every\nharness can be recognised after a move and nothing I bookmarked changes**.\n\n## Acceptance criteria\n\n- [ ] `loopboard init` writes `.agents/harness.md` for a new code harness (`kind: harness`, `type: code`, `parent: null`), with the same id rules and the same `--id`, `--name` and `--parent` as `--kind docs` (#0078), and never overwrites an existing file\n- [ ] `MIGRATIONS.md` gains the next migration: an existing harness adds `.agents/harness.md` with the id it is registered under — `loopboard workspaces --json` (#0099) prints it; without the CLI it is the folder's slug\n- [ ] The migration asks first (**Confirm first**) where that id breaks the pattern, isn't unique, or belongs to a shared git repository: there the id should be the project's name, not one machine's folder slug, and `parent` stays `null` unless it is true for everyone who clones the repo\n- [ ] A harness whose issue root is `ai/` gets the file at `.agents/harness.md` all the same, as its own Apply step\n- [ ] The marker in this repo's AGENTS.md and in both scaffold blocks (code and docs) moves to the new migration, and this repo gets its own identity file: `id: loopboard`, `name: loopboard`, `kind: harness`, `type: code`, `parent: null`\n- [ ] `docs/folder-map.md` and Help → Reference describe `.agents/harness.md` field by field, and the folder map no longer says that git is wh"},{"id":"0104","title":"Scaffold an index node with loopboard init --kind index","status":"wontfix","assignee":"agent","project":"04-harness-tree","labels":["cli","setup","ids"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## Why rejected\n\nMoved out of loopboard on 2026-10-14\n([ADR-0009](../architecture/decisions/0009-views-over-a-tree-live-outside-loopboard.md)).\nScaffolding index nodes — like every view over a whole tree of harnesses — belongs to a\ntool built on the same files, not to the board. loopboard stays a board per\nharness, for code and for documents, and keeps those files readable for\nsuch tools: the identity file, the reserved fields, `workspaces --json` and\nstable URLs (#0113). The text below stays as the record of what was\nplanned.\n\n## User story\n\nAs a **maintainer adding an inner node to my tree**, I want\n**`loopboard init --kind index` to write the identity file and an `INDEX.md`\nstub, and the CLI to answer sensibly when it is pointed at such a node**, so\nthat **I don't write the files by hand and no command fails with \"no issues\nfolder\"**.\n\n## Acceptance criteria\n\n- [ ] `loopboard init --kind index [path]` writes `.agents/harness.md` (`kind: index`) and an `INDEX.md` stub in the folder, and nothing else — no workflow block, no `issues/`; `--id`, `--name`, `--parent` and the id rules work as for `--kind docs` (#0078)\n- [ ] It never overwrites: an existing identity file or `INDEX.md` is kept, `--dry-run` only lists, and `--kind index` on a folder that holds a harness stops with a sentence\n- [ ] `loopboard next-id` and creating an issue, from the CLI or the board, answer on an index node with one sentence saying that index nodes hold no issues\n- [ ] `loopboard check` works in every node: it validates the node's identity file and follows its `parent` chain through the registry, "},{"id":"0105","title":"Sort, group and filter the list by due date","status":"backlog","assignee":"agent","project":"04-harness-tree","labels":["ui","list"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want **to sort, group and filter the list view by due\ndate and save that as a view**, so that **\"what's due in the next two weeks\"\nis one click**.\n\n## Acceptance criteria\n\n- [ ] The list view can be sorted by due date — soonest first, issues without a date last. The list has no sort option today (every group is newest first), so this adds one; it lives in the URL like the filters\n- [ ] \"Due date\" joins the ways to group: Overdue, Next 14 days, Later, No date\n- [ ] The list filters by Overdue, Next 14 days and No date; sort, grouping and filter round-trip through the URL, so they can be saved as a view\n- [ ] In the \"Needs you\" feed, issues with a due date come first, soonest on top; board columns keep their manual order\n- [ ] Unit tests cover the sort, the groups and the query round-trip; an e2e test finds an overdue issue under the Overdue filter and saves that as a view; spec § 13 and § 2 gain the scenarios\n\n## Out of scope\n\n- Reading, showing and editing the field — #0085\n- The cross-harness list of what's due — #0086\n- Sorting by other fields — add them when someone asks; the option is built so it can grow\n\n## Notes\n\n- PRD story 23. Split from #0085 in the review round: reading and showing a\n  date is one slice, a sort option for the list is another.\n- Uses the 14-day constant from #0085 — no second window.\n- A view saved with a due filter keeps working when no issue has a date: it\n  is empty, not broken.\n"},{"id":"0106","title":"Browse people and organisations in loopboard","status":"wontfix","assignee":"agent","project":"04-harness-tree","labels":["ui","navigation"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## Why rejected\n\nMoved out of loopboard on 2026-10-14\n([ADR-0009](../architecture/decisions/0009-views-over-a-tree-live-outside-loopboard.md)).\nPages for people and organisations — like every view over a whole tree of harnesses — belong to a\ntool built on the same files, not to the board. loopboard stays a board per\nharness, for code and for documents, and keeps those files readable for\nsuch tools: the identity file, the reserved fields, `workspaces --json` and\nstable URLs (#0113). The text below stays as the record of what was\nplanned.\n\n## User story\n\nAs a **maintainer about to write to someone**, I want **loopboard to list the\npeople and organisations of my tree and show each one's notes on a page**,\nso that **I read what is known about them without hunting for the file**.\n\n## Acceptance criteria\n\n- [ ] The board lists the tree's people and organisations by name, reachable from every harness of the tree\n- [ ] Each has a page with a stable URL showing name, type, organisation (linked) and the file's notes, rendered read-only, with \"Copy path\" and \"Open in editor\"\n- [ ] An organisation's page lists its people — those whose `org` names it\n- [ ] Files the reader skipped (#0087) are listed below the list with file and reason; a tree without an objects folder shows one line saying how to name one in the top node's identity file\n- [ ] The list and the pages refetch on open and on window focus\n- [ ] The specs gain the scenarios — a new section for people and organisations; an e2e test on the fixture tree opens a person's page from the list\n\n## Out of scope\n\n- Reading the files, "},{"id":"0107","title":"Set and filter waiting-on from the board","status":"backlog","assignee":"agent","project":"04-harness-tree","labels":["ui","list"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want **to set who an issue waits on from the issue\nview, and to filter the list view by it**, so that **I don't edit\nfrontmatter by hand and \"everything waiting on the accountant\" is one\nclick**.\n\n## Acceptance criteria\n\n- [ ] The issue view sets and clears `waiting-on` through a picker that offers the `waiting-on` values already used in this workspace, filters as you type and takes a new `@id`; the write changes only the lines it owns — `waiting-on` and, as question 1 in #0088 is answered, the since date\n- [ ] The picker writes the quoted form, handles one value and several, and adds the `@` when it is left out\n- [ ] The list view filters by \"Waiting on\" — anyone, or one value; the filter lives in the URL, so it can be saved as a view\n- [ ] Tests cover the picker's write (one value, a list, clearing) and the filter's query round-trip; an e2e test sets a person and finds the issue under the filter; spec § 4 and § 13 gain the scenarios\n\n## Out of scope\n\n- Reading and showing the field, `check`, and the questions about \"since\" and \"Needs you\" — #0088\n- Names from people's files, and creating a person from the picker — loopboard has no people or organisations (ADR-0009)\n- Typing `@` in the editor to pick a person — a follow-up\n\n## Notes\n\n- PRD story 29. Split from #0088 in the review round. It waits on #0088,\n  and through it on the maintainer's answers there.\n- The inline property pickers (#0052) are the prior art for the control and\n  for line-level writes.\n- In a workspace where no issue waits on anyone yet, the picker shows only\n  the"},{"id":"0108","title":"Add a folder tree from the switcher","status":"backlog","assignee":"agent","project":"04-harness-tree","labels":["ui","workspaces"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer who lives in the board, not the terminal**, I want **\"Add\nfolder tree…\" in the workspace switcher**, so that **I register a tree of\nharnesses the same way I add a single workspace**.\n\n## Acceptance criteria\n\n- [ ] \"Add folder tree…\" in the switcher asks for a folder, shows the nodes the scan found — name, id, kind, parent, and whether each is new or already registered — and registers the new ones after a confirmation\n- [ ] The dialog goes through the scan from #0095 and follows its rules: the home directory and a file-system root are refused with the same sentence, only identity files are read, and nothing is registered before the confirmation\n- [ ] The scan runs only when the user asks — never on page load or in the background — and its route is guarded like the other workspace writes\n- [ ] Spec § 7 gains the scenario; an e2e test adds a fixture tree and finds its nodes in the switcher\n\n## Out of scope\n\n- The ADR and the CLI command — #0095\n- A \"Rescan\" action on a registered tree — deferred in `wip.md`; add the folder again instead\n- A native folder picker — the path is typed or pasted, as in \"Add workspace\"\n\n## Notes\n\n- PRD story 44. Split from #0095 in the review round: the ADR and the\n  command are one slice, the dialog is another.\n- The \"Add workspace\" dialog is the prior art for the path field and its\n  error messages.\n"},{"id":"0109","title":"Keep a log at the top of the tree of what was done where","status":"wontfix","assignee":"human","project":"04-harness-tree","labels":["cli","workflow","conventions"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## Why rejected\n\nMoved out of loopboard on 2026-10-14\n([ADR-0009](../architecture/decisions/0009-views-over-a-tree-live-outside-loopboard.md)).\nA log at the top of the tree — like every view over a whole tree of harnesses — belongs to a\ntool built on the same files, not to the board. loopboard stays a board per\nharness, for code and for documents, and keeps those files readable for\nsuch tools: the identity file, the reserved fields, `workspaces --json` and\nstable URLs (#0113). The text below stays as the record of what was\nplanned.\n\n## User story\n\nAs a **maintainer whose agents work in many harnesses**, I want **one file\nat the top of my tree that keeps book of what was last done where**, so that\n**I, and any agent starting a session, can pick up the thread without\nopening every harness**.\n\n## Acceptance criteria\n\nWritten for the proposals under \"Questions\"; adjust them to the answers.\n\n- [ ] `loopboard recent [--all] [--json]` prints the newest dated session entries — date, harness, project, first line — for the current harness or, with `--all`, for every registered one; it needs no running board\n- [ ] `loopboard log \"<what was done>\" [--issue <ref>]` appends one dated line — date, harness id, the issue or project it belongs to, the text — to the log file of the tree's top node. It works from any harness of the tree and without git, and never rewrites earlier lines\n- [ ] Both workflow blocks, code and docs, gain one step: after a session, append a line with `loopboard log` — also for standalone issues and for work that belongs to no project\n- [ ] The Overview's \"Recent\" s"},{"id":"0110","title":"Open and reveal linked documents with the system's apps","status":"backlog","assignee":"agent","project":"04-harness-tree","labels":["ui","server","security"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **person whose work results are documents — a contract, a spreadsheet,\na scan**, I want **a link in an issue to open the document in its app or\nshow it in the file manager**, so that **the issue is the way to the file**.\n\n## Acceptance criteria\n\n- [ ] A relative link or a `<id>:<path>` reference to a file that isn't markdown offers \"Open\" (the system's default app) and \"Reveal\" (the file manager)\n- [ ] Both are POST routes that require an `Origin` header matching the app's own origin. A request without the header is refused — today's guard lets such a request through — and a test pins that\n- [ ] They accept only a path whose real path lies inside a registered harness folder; `..`, an absolute path and a symlink that leads out are refused\n- [ ] \"Open\" only runs for an allow-list of document types; anything that would execute can only be revealed\n- [ ] The server starts one fixed command per platform, without a shell, and never puts the path into a command line as text\n- [ ] Tests cover path traversal, a symlink that leads out, a foreign origin, a missing origin and a file type that isn't allowed; an e2e test shows both actions on a linked PDF without launching anything\n- [ ] Spec § 5 gains the scenarios, and the architecture docs name the route next to the server's other guards\n\n## Out of scope\n\n- The in-app view for markdown files and broken-link marking — #0097\n- Rendering PDFs, images or office files inside the board\n- Opening files outside every registered harness folder\n- Choosing the app — the system's default decides\n\n## Notes\n\n- PRD story 47. Spl"},{"id":"0111","title":"A test run registers the checkout as a workspace","status":"done","assignee":"agent","project":null,"labels":["testing","workspaces"],"created":"2026-10-13","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. Check the repo out a second time (a git worktree or a fresh clone) and\n   install.\n2. Run `pnpm verify` (or `pnpm test`, or `pnpm exec vitest run` on one file)\n   in it. Don't set `LOOPBOARD_CONFIG_DIR`.\n3. Run `loopboard workspaces`, or open the workspace switcher of a running\n   board.\n\n## Current behavior\n\nThe checkout is in the registry and is the last-used workspace. Every test\nrun adds or re-selects it, so a board opened without a path lands in a\nworktree instead of the repo the user worked in last, and `workspaces forget`\nonly helps until the next run. This is how throwaway worktrees end up in the\nregistry (#0099 added the command that removes them).\n\nVitest reads [`vite.config.ts`](../../vite.config.ts) and starts a Vite\nserver of its own from it. The config lists the dev plugin\n([`server/plugin.ts`](../../server/plugin.ts)), whose `configureServer` hook\nregisters the checkout in the user's config directory, as `pnpm dev` is meant\nto. The hook runs in Vitest's main process, before any test and outside the\nconfig directory a test sets for itself.\n\n## Expected behavior\n\nOnly `pnpm dev` and the CLI register a workspace. Running tests or a\ntype-check never writes to the user's registry.\n\n## Acceptance criteria (verification)\n\n- [x] Reproduction steps no longer reproduce the bug\n- [x] Regression test added at the right seam (or absence of seam documented)\n- [x] No `[DEBUG-...]` instrumentation left behind\n- [x] A test that sets no config directory of its own can't reach the user's registry either\n- [x] CONTRIBUTING and the architecture overview"},{"id":"0112","title":"The inbox visual baselines no longer match the board","status":"todo","assignee":"agent","project":null,"labels":["testing","ui"],"created":"2026-10-13","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. On macOS, run `pnpm test:e2e` (or only `pnpm exec playwright test visual.spec.ts`).\n\n## Current behavior\n\nThe run ends red: \"inbox and board — light\" and \"inbox and board — dark\" in\n[`visual.spec.ts`](../../tests/e2e/visual.spec.ts) fail against\n`inbox-light-darwin.png` and `inbox-dark-darwin.png`. In the last full run,\nmade when the six issues that precede project 04 were brought together,\nthese two failed and the other 94 tests passed; the same two failed before\nthat work. What that session recorded as the causes:\n\n- At the test's 1440 px width the board toolbar wraps onto a second line\n  since the You and Agent filters got avatars; the baselines show it on one.\n- The demo fixture keeps a malformed issue file, so since #0071 the rail of\n  every workspace screen ends with \"1 file skipped\". The inbox baselines\n  don't show that row either.\n\nA red suite hides the next real regression, and nobody owned this one: it was\nonly mentioned in project 04's activity log and in #0071's notes.\n\n## Expected behavior\n\n`pnpm test:e2e` is green on macOS, and the inbox baselines show the screen as\nit is meant to look.\n\n## Acceptance criteria (verification)\n\n- [ ] It is decided whether the toolbar may wrap at 1440 px. If not, the toolbar is fixed; the baselines are not bent around a layout bug\n- [ ] `inbox-light-darwin.png` and `inbox-dark-darwin.png` are refreshed and show the \"1 file skipped\" row\n- [ ] The other baselines with the board in view (panel, menu, editor, palette) are compared with the current screens and refreshed where they differ\n- [ ] `pnpm test:e2"},{"id":"0113","title":"Link into the board from other tools with stable URLs","status":"todo","assignee":"agent","project":"04-harness-tree","labels":["ui","workspaces","docs"],"created":"2026-10-14","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **person who builds their own view over several harnesses — a script,\na dashboard, a note with links**, I want **a documented URL for a\nworkspace, an issue and a project that opens the board right there**, so\nthat **my tool links into loopboard instead of copying it** (ADR-0009).\n\n## Acceptance criteria\n\n- [ ] Three URLs are documented as stable: `/w/<id>` (the workspace), `/w/<id>/issues/<NNNN>` (one issue, also an archived one) and a new `/w/<id>/projects/<slug>` that opens one project's board with the project selected; a project can also be addressed by number, `/w/<id>/projects/P04`\n- [ ] Each URL works on a cold start — a new tab, no stored selection — and wins over the selection the browser remembers for that workspace\n- [ ] An id that isn't registered, an issue or a project that doesn't exist, show one sentence in the board with a link to the workspace or to `/` — never a blank page and never a silent redirect\n- [ ] `loopboard workspaces --json` — today `id`, `name`, `path` (the root, e.g. `…/.agents`) and `exists` — also lists the harness folder as `folder` and, while a board runs, its base URL as `url` (from `server.json` and `/api/health`), so a tool maps a folder to a link without reading the registry file. Existing keys keep their meaning\n- [ ] The README's CLI section and Help → Reference gain \"Link into loopboard\": the three URLs, the JSON shape, and that the shape only grows\n- [ ] Spec § 7 gains the scenarios; an e2e test opens each URL in a fresh context and checks the selected item; a Vitest test pins the JSON shape of `workspaces --jso"},{"id":"0114","title":"See a harness's routines and their next slot with loopboard routines list","status":"done","assignee":"agent","project":"05-routines","labels":["cli","routines"],"created":"2026-10-27","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want **each routine to be a folder with a `routine.md`\nin `.agents/scheduled/`, and `loopboard routines list` to show its schedule in\nwords, its next slot and its last run**, so that **I see what runs in a\nharness, and when, without an agent platform**.\n\n## Acceptance criteria\n\n- [x] `routine.md` is read from its raw frontmatter lines (PRD \"Files\"): `title`, `schedule`, `at`, `timezone`, `enabled`, `expires-after`, `timeout`, `host`, `writes-to`, `created`, `creates` and the `issue-` fields; a folder starting with `_` or `.` is no routine\n- [x] A shared cron module computes the next and the previous occurrence in an IANA zone — `*`, numbers, ranges, steps, lists, month and day names, `7` = Sunday, `L` in the day of month, the five `@` macros, day of month OR day of week — with the PRD's DST rules, and describes a schedule in words (\"Weekdays at 07:30\", \"Every 15 minutes\", \"On the last day of every month at 18:00\", \"Once on 3 Nov 2026 at 09:00\")\n- [x] `runs.md` is parsed into runs and entries exactly as the PRD specifies; an unreadable entry is skipped\n- [x] `loopboard routines [list] [path]` prints each routine with its schedule in words (and its zone when it has one), the next slot, and the last run's status and time; a paused routine says so; `--under <dir>` covers every harness under the folder, grouped by harness, skipping symlinks, hidden folders, `node_modules` and macOS packages\n- [x] `--json` prints the documented `version: 1` shape: host, now, and per harness its id, name, path, root and routines with their fields, next slot, "},{"id":"0115","title":"loopboard check validates routines","status":"done","assignee":"agent","project":"05-routines","labels":["cli","routines","check"],"created":"2026-10-27","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want **`loopboard check` to say what is wrong with a\nroutine**, so that **a routine with a typo in its schedule doesn't silently\nnever run**.\n\n## Acceptance criteria\n\n- [x] Errors (✗, exit 1): a routine folder without `routine.md` or frontmatter; neither or both of `schedule` and `at`; a cron expression that doesn't parse, with the field and the reason; an `at` that isn't `YYYY-MM-DD HH:MM`; an unknown time zone; a duration that isn't `30m`/`6h`/`2d`; `enabled` other than true or false; `creates` other than `issue`; for `creates: issue` a missing or unknown `period`, an unknown `issue-category`/`issue-status`/`issue-assignee`, an `issue-due-after` that isn't whole days; a `writes-to` id that breaks ADR-0008\n- [x] Warnings (!, exit 1 only with `--strict`): an unknown field; a `writes-to` id that is no registered workspace's id, identity id or alias; an `issue-project` that doesn't exist; an entry of `runs.md` that can't be read\n- [x] Every line names the file relative to the root, like the other `check` lines; a valid harness adds the number of routines to the closing \"✓\" line\n- [x] `routines list` shows an invalid routine with its first problem and never as due\n- [x] Spec § 10 and § 15 gain the scenario; Vitest covers each error and warning\n\n## Out of scope\n\n- Duplicate `recurrence:` values (#0118)\n\n## Notes\n\n- PRD \"Commands\" (`check`) and story 3. The registered names come from the\n  registry and each workspace's identity file, as `init` collects them.\n"},{"id":"0116","title":"Record runs with routines start and finish","status":"done","assignee":"agent","project":"05-routines","labels":["cli","routines"],"created":"2026-10-27","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **dispatcher (and the maintainer reading after it)**, I want **`loopboard\nroutines start` to record that a run began and `finish` to record how it\nended with a short note, in the routine's `runs.md`**, so that **a second\nstart is refused while a run is in progress, and every run leaves a trace\nthe next one can read**.\n\n## Acceptance criteria\n\n- [x] `start <routine>` (a folder path, or a slug with `--path`) appends a `running` entry with `started`, `slot` (when the routine is due) and `host`, creating `runs.md` with its header; it holds a file lock, so two starts at once record one run\n- [x] `start` refuses (exit 1, naming the start time and host) while a `running` entry of the routine is younger than its `timeout` (default 2h)\n- [x] `finish <routine> --status ok|failed --note <text>` appends the final entry with `started`, `finished`, `slot`, `host` and the note as a block quote; `--note -` reads stdin; without an open run it refuses; an `aborted` run that reports late is closed too\n- [x] A one-time routine (`at:`) gets `enabled: false` in `routine.md` when it finishes; nothing else in the file changes\n- [x] `--json` on `start` prints the run; `--dry-run` prints what would be written and writes nothing\n- [x] `routines list` shows the last run's status, time and note\n- [x] Spec § 15 gains the scenarios; Vitest covers the round trip of every status, a note with `##` lines, the lock, the timeout refusal, the late finish and the one-time switch-off\n\n## Out of scope\n\n- Turning stale runs into `aborted` and catching up missed slots (#0117)\n\n## Notes\n\n- PRD \"r"},{"id":"0117","title":"Ask what is due with loopboard routines due","status":"done","assignee":"agent","project":"05-routines","labels":["cli","routines"],"created":"2026-10-27","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **dispatcher**, I want **one command that says which routines are due\nnow — in this harness or in every harness under a folder — and does the\nbookkeeping that needs no agent**, so that **I only start sub-agents for\nroutines that really have a slot to run**.\n\n## Acceptance criteria\n\n- [x] A routine is due when it is enabled, valid, not pinned to another `host`, nothing of it is running, and its slot — the latest occurrence ≤ now, ignoring occurrences before its `created` day — is later than its last handled time (PRD \"Schedules and due\")\n- [x] A `running` entry older than `timeout` becomes `aborted` (a note says so) and the routine is evaluated again\n- [x] With `expires-after`, a slot older than that is recorded as `expired`, not run; a one-time routine then switches itself off\n- [x] A catch-up run covers several missed occurrences once; its `start` records them as one `missed` entry with `from`, `to` and `slots`\n- [x] `loopboard routines due [path]` and `--under <dir>` print what's due, what is running, what expired or was aborted, and which routines have problems; `--json` prints the documented shape; `--dry-run` writes nothing\n- [x] Spec § 15 gains the scenarios; Vitest covers a fresh routine, `created`, catch-up, expiry, a run younger and older than `timeout`, `host`, paused and invalid routines, nested harnesses under `--under`\n\n## Out of scope\n\n- How a `creates: issue` routine files its issue (#0118) — `due` calls it\n\n## Notes\n\n- PRD stories 7–11 and 19. \"Now\" is a parameter, so the tests set it.\n"},{"id":"0118","title":"File the period's issue with a creates: issue routine","status":"done","assignee":"agent","project":"05-routines","labels":["cli","routines","workflow"],"created":"2026-10-27","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer with duties that come back every month, quarter or year**, I\nwant **a routine with `creates: issue` to file the period's issue with its due\ndate — exactly once, without an agent**, so that **nobody has to remember to\nfile it, and the dispatcher can ask as often as it likes** (supersedes #0090).\n\n## Acceptance criteria\n\n- [x] `period` (`day`, `week`, `month`, `quarter`, `year`) labels the slot's local day: `2026-11-03`, `2026-W45` (ISO), `2026-11`, `2026-Q4`, `2026`; `{period}`, `{previous}` and `{date}` fill `issue-title` and the body\n- [x] `start` files the issue (`due` calls the same in #0117) with the next free number, the `issue-` fields, `due:` from `issue-due-after`, `recurrence: <slug>@<period>` and `created:`, and record an `ok` run whose note names it; a one-time routine then switches itself off\n- [x] An issue with the same `recurrence:` in `issues/` or `issues/_archive/` means nothing is filed; the run is still `ok` and names that issue\n- [x] Missed periods are recorded as `missed`, never back-filled; `--dry-run` names the issue it would file\n- [x] `loopboard check` reports two issues with the same `recurrence:` as an error\n- [x] The issues README (both scaffolds) moves `recurrence` out of the reserved fields; the glossary's Issue entry names the field; spec § 15 gains the scenarios\n- [x] Vitest: the 31st and `L` in February, 29 February, quarter starts, ISO weeks 52/53 and `{previous}` at the turn of the year, idempotence across live and archived issues, the duplicate in `check`\n\n## Out of scope\n\n- Closing or rolling over last pe"},{"id":"0119","title":"Brief each run and print the dispatcher prompt","status":"done","assignee":"agent","project":"05-routines","labels":["cli","routines","docs"],"created":"2026-10-27","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **sub-agent running a routine**, I want **a brief with the routine's\nsteps, the harness, the notes of the last three runs, the rules and the exact\n`finish` command**, and as a **maintainer** I want **a ready dispatcher prompt\nwith setup examples**, so that **every run starts informed and ends recorded,\non whichever platform I use**.\n\n## Acceptance criteria\n\n- [x] `loopboard routines prompt <routine>` prints the brief: routine title, schedule in words, the slot of the open run (or \"manual\"), working directory, harness id, name and purpose paragraph, `AGENTS.md`, the steps, the last three run notes newest first (or \"first run\"), the fixed rules (only this harness and `writes-to`, never commit/push/send unless the steps say so, don't touch the routine's files, fail instead of faking, end with a short note) and the exact `finish` commands for ok and failed\n- [x] `loopboard routines dispatcher-prompt [path]` / `--under <dir>` prints the dispatcher prompt with the scope filled in: `due --json`, then per routine one after another `start`, a fresh sub-agent in the harness with the brief, a `finish` if the sub-agent didn't, a push notification where the platform can, never any other message\n- [x] The prompt lives in `docs/dispatcher-prompt.md`, ships with the package, and the docs show setup for a Claude Code scheduled task, Codex and cron with `claude -p`\n- [x] Spec § 15 gains the scenarios; Vitest covers the brief's parts and the filled-in scope\n\n## Out of scope\n\n- Running anything — the platform runs the dispatcher (ADR-0010)\n\n## Notes\n\n- PRD \"The brief\", \"Th"},{"id":"0120","title":"See routines and their runs in a Routines view","status":"done","assignee":"agent","project":"05-routines","labels":["ui","routines"],"created":"2026-10-27","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want **a Routines view in each workspace that lists\nevery routine with its schedule in words, next slot and last run, and a page\nper routine with its steps and runs**, so that **I see what runs and whether\nit worked without opening files**.\n\n## Acceptance criteria\n\n- [x] `GET /api/w/:id/routines` returns what `routines list --json` returns for that harness; `/data` carries the number of routines\n- [x] `/w/:ws/routines` lists each routine: title, schedule in words with its zone, next slot, last run with a status pill and relative time, paused and invalid routines marked; an empty state says how to create one\n- [x] `/w/:ws/routines/:slug` shows the settings (schedule, zone, expiry, timeout, host, writes-to, creates), the rendered steps and every run newest first with status, times and note\n- [x] The rail lists Routines under Workspace in a harness with at least one routine; ⌘K \"Go to Routines\" always works; the view follows file changes live\n- [x] Read-only: nothing in the view writes\n- [x] Spec § 15 scenarios with Playwright tests against a temp harness served by the built binary; the demo fixture stays without routines\n\n## Out of scope\n\n- The graphs (#0121); pause or run buttons (PRD out of scope)\n\n## Notes\n\n- PRD \"Board\", stories 24 and 25.\n"},{"id":"0121","title":"See a year of runs as a contribution graph","status":"done","assignee":"agent","project":"05-routines","labels":["ui","routines"],"created":"2026-10-27","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want **a GitHub-style graph per routine and one for the\nwhole workspace — a cell per day for a year — that shows runs, failures and\nmissed slots**, so that **gaps and failures stand out at a glance**.\n\n## Acceptance criteria\n\n- [x] The server computes each routine's days for 53 weeks ending today in the routine's zone: red when a run failed or was aborted, else green in four shades relative to the busiest day when runs finished, else grey when a slot was missed or expired — recorded, or a past slot of an enabled routine since its `created` day without an entry — else empty; `list --json` carries the days\n- [x] The Routines view shows the workspace graph on top (every routine summed the same way) and each routine's graph on its page; 53 columns × 7 rows, Monday on top, month labels, a legend\n- [x] Hovering or focusing a cell names the day and its runs with time, status and note; cells have accessible labels\n- [x] The graph colors are tokens in both themes, and the contrast script checks the state colors at 3:1 against the background in light and dark\n- [x] Vitest for the day states; Playwright for the cells and their hover text\n\n## Out of scope\n\n- A graph across harnesses — that's the private dashboard (ADR-0009)\n\n## Notes\n\n- PRD \"Board\" (graphs), stories 26 and 27.\n"},{"id":"0122","title":"Scaffold routines, add the routine skill and the AGENTS rule, migrate with M003","status":"done","assignee":"agent","project":"05-routines","labels":["conventions","skills","workflow"],"created":"2026-10-27","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want **every harness to come with `.agents/scheduled/`,\na skill that writes routines and a rule that sends recurring work there**, so\nthat **an agent asked to \"remind me on Friday\" writes a routine instead of a\ntask of its platform — in new harnesses and, after an upgrade, in old ones**.\n\n## Acceptance criteria\n\n- [x] `.agents/scheduled/README.md` and `scheduled/_templates/routine.md` exist in a code version (this repo's, shipped) and a docs version (`scaffold/docs/`); `loopboard init` creates them, `init --upgrade` adds them, and the manifest tracks them\n- [x] Skill `routine` ships as a core skill: create, change, pause and show a routine; schedule in words → cron and back; asks for steps, `expires-after` and `writes-to`; copies the template, sets `created`; runs `loopboard check`; never creates a platform task\n- [x] The code AGENTS block gains the rule with the skill, the docs block with the folder's README; this repo's managed block stays identical to `scaffold/AGENTS.block.md`\n- [x] `MIGRATIONS.md` M003 names the folder, the skill, the rule, the reworded issues README, and — confirm first — moving the harness's platform tasks into routines; this repo's marker moves to M003\n- [x] Spec § 8 and § 15 gain the scenarios; Vitest covers init, upgrade and the docs scaffold\n\n## Out of scope\n\n- Moving the maintainer's existing platform tasks (later sessions)\n\n## Notes\n\n- PRD \"Agents and setup\", stories 28–30.\n"},{"id":"0123","title":"Document routines for users","status":"done","assignee":"agent","project":"05-routines","labels":["docs","routines"],"created":"2026-10-27","category":"task","archived":false,"body":"\n## What needs to change\n\nA user guide for routines and their place in every list of what loopboard\ndoes: `docs/routines.md` (files, fields, schedules in words, due, runs,\nrecurring issues, dispatcher setup, the `--json` shapes field by field),\nthe README's CLI table, `docs/folder-map.md`, the Help Center (Set up and\nReference) and the CHANGELOG.\n\n## Why\n\nThe private dashboard and other people's tools read `list --json`; they need\nthe contract written down. And a feature that only exists in `--help` isn't\nfound.\n\n## Acceptance criteria\n\n- [x] `docs/routines.md` covers the format, the commands, the dispatcher with its three setups, and documents `list --json` and `due --json` (`version: 1`) field by field\n- [x] The README's CLI table has a row per `routines` command; `docs/folder-map.md` shows `scheduled/`; Help → Reference renders the guide's overview; Help → Set up lists the commands\n- [x] CHANGELOG `[Unreleased]` has a Routines section\n- [x] A test keeps the documented JSON keys in step with what `list --json` prints\n\n## Out of scope\n\n- Videos or course chapters\n\n## Notes\n\n- PRD story 31 and decision 16.\n"},{"id":"0124","title":"Let a routine's run commit and push the paths it names with commits","status":"backlog","assignee":"agent","project":"05-routines","labels":["routines","cli","git"],"created":"2026-10-27","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer whose routine feeds something that reads only committed\nfiles** — a GitHub Action, a deploy, a teammate's checkout — I want **a routine\nto name the paths its run may commit and push**, so that **its results arrive\nthe same day without me committing by hand, while everything else a run\ntouches stays uncommitted**.\n\n## Why now\n\nFiled on 2026-10-27 from the prodapps session that set up the routine\n`email-check`. It logs makers' replies in the partner records under\n`packages/partners/data/`. prodapps' outreach GitHub Action (13:30 UTC daily)\nreads only committed records, so a reply logged at 07:30 and left uncommitted\ngets the maker another sequence mail. Today the brief's rule 2\n(`server/brief.ts`, \"Never commit, push or publish\") is unconditional, so a\nstep that says \"commit\" contradicts the brief. Marius commits by hand for\nnow and wants a scoped exception.\n\n## Acceptance criteria\n\n- [ ] `routine.md` takes `commits: [<glob>, …]`, globs relative to the harness folder (`packages/partners/data/**`); `loopboard check` reports a glob that doesn't parse, points outside the harness or matches nothing tracked (a warning)\n- [ ] With `commits:` the brief's rule 2 allows exactly this: commit the changes under those paths and push them; everything else stays forbidden, and a run that changed other files leaves them uncommitted and says so in its note\n- [ ] The commit never happens in the maintainer's checkout: it is built from a fresh worktree or a temporary index on top of `origin/<default branch>` and pushed as that commit, so his unfinished local com"},{"id":"0125","title":"writes-to warns about a harness that is registered under another workspace id","status":"todo","assignee":"agent","project":"05-routines","labels":["routines","check"],"created":"2026-10-27","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. Register `~/repos/webhighlights` on a machine where the registry gave it\n   the workspace id `webhighlights-2` (name `webhighlights`), and give the\n   repo no `.agents/harness.md`.\n2. In another harness, write a routine with `writes-to: [webhighlights]`.\n3. Run `loopboard check` there.\n\n## Current behavior\n\n`! scheduled/<slug>/routine.md: writes-to \"webhighlights\" is no registered\nharness here`. `workspaceNames()` (`server/workspaces.ts`) only collects the\nworkspace id, the identity file's id and its aliases — not the workspace's\nname or its folder's slug. Meanwhile `routines list` and `due` name the same\nharness `webhighlights` (`harnessFor()` falls back to the folder's slug), so\nthe two disagree. Seen on 2026-10-27 in the prodapps session that set up the\nroutine `email-check`.\n\n## Expected behavior\n\nA harness counts as known by every name loopboard itself shows for it: the\nidentity file's id and aliases, the workspace id, and — for a workspace\nwithout an identity file — its folder's slug, the id `routines list`\nreports. When none matches, the warning says how to fix it: give that\nharness an identity file (`.agents/harness.md`) with the id.\n\n## Acceptance criteria\n\n- [ ] `writes-to: [webhighlights]` is known when the registered workspace's folder slugs to `webhighlights`, whatever its workspace id\n- [ ] The warning names the fix: \"… no registered harness here — register it, or give it an identity file with that id\"\n- [ ] Vitest: a registry entry `webhighlights-2` without an identity file; one with an identity file whose id differs from the slug ("},{"id":"0126","title":"init --upgrade appends a second workflow block to a customized AGENTS.md","status":"todo","assignee":"agent","project":null,"labels":["cli","init","upgrades"],"created":"2026-10-27","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. Take a harness whose AGENTS.md has its own workflow section and a\n   migration marker (`<!-- loopboard:migration M002 -->`), but no\n   `<!-- loopboard:start -->` / `<!-- loopboard:end -->` markers — as\n   `~/repos/webhighlights` had on 2026-10-27.\n2. Run `loopboard init --upgrade --dry-run` there.\n\n## Current behavior\n\nThe plan says `AGENTS.md — appended the workflow block`: a real run adds a\nsecond, complete workflow block below the customized one. It also plans\nseed READMEs (`architecture/_architecture.md`, `rules/README.md`, …) that\nsuch a harness doesn't use. On 2026-10-27 the routine pieces of M003 were\napplied by hand instead (project 05).\n\n## Expected behavior\n\n`init --upgrade` treats an AGENTS.md with a migration marker but no managed\nmarkers as a customized harness: it leaves AGENTS.md alone, says so, and\npoints at the upgrade-harness skill (\"ask your agent to upgrade my loopboard\nharness\") for the block's changes. It adds no seed files on `--upgrade`\nthat a first run would create.\n\n## Acceptance criteria\n\n- [ ] `init --upgrade` on such an AGENTS.md plans `keep` for it, with a note naming the upgrade-harness skill\n- [ ] `init --upgrade` plans no seeds (specs, architecture, rules, design, SETUP.md) — shipped skills, READMEs and templates only\n- [ ] A first `init` (no marker, no block) still appends the block, as today\n- [ ] Spec § 8 \"Upgrade an existing harness\" names both; Vitest covers both\n\n## Out of scope\n\n- Merging the block's new paragraphs into a customized AGENTS.md — that is\n  the upgrade-harness skill's job\n\n## Notes\n\n- `planInit"},{"id":"0127","title":"Groom the board — week 44","status":"todo","assignee":"agent","project":null,"labels":["grooming"],"created":"2026-10-26","category":"chore","archived":false,"body":"Filed by the **Weekly grooming issue** routine (`recurrence: weekly-grooming@2026-W44`).\n\n## What to do\n\n- [ ] Run the issue-grooming skill over the whole board\n- [ ] Close what shipped since week 43 and archive finished issues\n- [ ] Ask about anything in review for more than 10 days (#0099, #0101)\n"}],"projects":[{"slug":"01-open-source-launch","title":"loopboard 1.0 — Open-source launch","status":"active","lastSession":"2026-10-05","focus":"All agent work is done; what's left needs the maintainer. Every spec scenario now has an e2e test, the CLI included (#0043), and a visual review pass landed (#0044). Waiting on you: reserve the name (#0001), push + CI (#0006, #0035), the fresh-agent prompt check (#0013), a real upgrade-harness run (#0041), then launch (#0036) — after project 02's UX overhaul. The README demo is recorded and re-records itself (#0036 notes); what's left of #0036 is going public. Read \"Questions for the maintainer\" below first.","sessions":[{"date":"2026-10-05","note":"The maintainer created MariusBongarts/loopboard under their personal account and pushed main; it's public from the start (the PRD planned private until #0036). CI and the README demo workflow ran on the first push. package.json now has repository, homepage and bugs. Still open in #0001: the npm placeholder."},{"date":"2026-10-04","note":"#0042: one parseFrontmatter helper bypasses gray-matter's cache; Vitest regression + § 1 e2e with a malformed fixture file."}]},{"slug":"02-linear-like-ux","title":"A Linear-like loopboard","status":"active","lastSession":"2026-10-05","focus":"All 14 issues are done; the project waits on your review before it ships (set Status to shipped, archive the issues). Read \"Questions for the maintainer\" first — especially 3 and 4.","sessions":[{"date":"2026-10-05","note":"Direction decided with the maintainer: Linear-like neutral (cool grays, violet accent, Inter), mark + sans wordmark, resizable issue panel + full page, inline property pickers, right-click menus, resizable panes and a collapsible rail, feed filters only in the rail. Also: Settings with an editor choice (VS Code / Cursor) and headings-only quick-create bodies."}]},{"slug":"03-help-center","title":"A Help Center that teaches the loop","status":"active","lastSession":"2026-10-05","focus":"Everything is built and verified; three issues wait on you: watch the six course videos (#0065), check Safari and read the course copy (#0066), and watch the overview film before posting it (#0068). Then ship: archive the issues and set the status to shipped.","sessions":[{"date":"2026-10-05","note":"#0060: /help is now a layout with child pages (overview, learn, setup, upgrade, reference), a sidebar that lists the active page's sections with a scroll-spy, and ?from= kept on every link. #app is the page's scroller, so the layout handles hash jumps itself. SetupPrompt became CopyPrompt."}]},{"slug":"04-harness-tree","title":"Harnesses across folders","status":"active","lastSession":"2026-10-14","focus":"Narrowed on 2026-10-14 (ADR-0009). Views over a whole tree — index nodes, people and organisations, the Overview, the switcher as a tree, the Home tab and a log — moved out of loopboard into tools built on the same files. Ten issues are wontfix with a \"Why rejected\" section; #0113 is new and gives such tools stable URLs and the folder and URL of each workspace. Nothing that was built changes.","sessions":[{"date":"2026-10-14","note":"The maintainer decided to keep loopboard a board per harness and to leave views over a whole tree to tools built on the same files. ADR-0009 records it and amends ADR-0007 (kind: index stays valid in the file but is never registered, --kind index is gone, objects is kept and ignored, the identity file is no second way into root detection) and ADR-0008 (@id stays plain text)."},{"date":"2026-10-13","note":"Two reviewers went through #0078 by running the built CLI; 22 findings, three of them major. Each is fixed in #0078's code or its documents, with a test where there is code; three points are decisions and went to the maintainer, listed below. #0078's notes say what changed."}]},{"slug":"05-routines","title":"Routines","status":"active","lastSession":"2026-10-27","focus":"All ten issues are done (2026-10-27): routines are files in .agents/scheduled/, loopboard routines list|due|start|finish|prompt|dispatcher-prompt run them end to end, check validates them, recurring issues file themselves (#0090 is superseded), the board has a read-only Routines view with contribution graphs, and init, the routine skill, the AGENTS rule and M003 bring them to every harness. What's left for the ship gate is the maintainer's: a look at the Routines view and a first real dispatcher run on a platform, then an issue-grooming run that archives #0114–#0123. Later, in other sessions: the private dashboard reads routines list --json (documented in docs/routines.md), and existing plat","sessions":[{"date":"2026-10-27","note":"Kickoff. The sixteen decisions of the grill are the frame (German copy in the maintainer's own tree). Written: PRD, ADR-0010 (routines are files, a dispatcher outside loopboard runs them, --under amends ADR-0002), the glossary's Routine, Run, Slot, Dispatcher and Brief, and #0114–#0123. #0090 is wontfix, superseded by this project; project 04's WIP and PRD point here."}]}]}</script>

const TONES = ['orange', 'blue', 'green', 'red', 'pink', 'amber', 'teal'];
function tone(slug) {
  let h = 5381;
  for (let i = 0; i < slug.length; i++) h = ((h << 5) + h + slug.charCodeAt(i)) | 0;
  return 'tone-' + TONES[Math.abs(h) % TONES.length];
}
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fromYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MOL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function dayLabel(key) {
  const today = ymd(M.now);
  const y = new Date(M.now); y.setDate(y.getDate() - 1);
  if (key === today) return 'Today';
  if (key === ymd(y)) return 'Yesterday';
  const d = fromYmd(key);
  return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`;
}
const when = (d) => `${dayLabel(ymd(d))} ${hhmm(d)}`;
function plural(n, one, many = one + 's') { return `${n} ${n === 1 ? one : many}`; }

};
const statusIcon = (s, size = 14) => `<svg class="status-icon st-${esc(s)}" width="${size}" height="${size}" viewBox="0 0 14 14" aria-label="${esc(STATUS_LABEL[s] || s)}">${STATUS_SVG[s] || STATUS_SVG.todo}</svg>`;

};
const ICON = {
  link: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',

// ── Markdown-lite (briefs, notes, bodies) ───────────────────
function inline(text, proto) {
  const codes = [];
  let s = esc(text).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '$1');
  s = s.replace(/(^|[^\p{L}\p{N}&#\/])#(\d{4})\b/gu, (_, pre, id) => `${pre}<a class="ref" href="#${proto}/issue/${id}" data-issue="${id}">#${id}</a>`);
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src, proto) {
  const out = [];
  let list = null, para = [], fence = null;
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(' '), proto)}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } };
  for (const raw of String(src || '').split('\n')) {
    const line = raw.replace(/\s+$/, '');
    if (fence !== null) {
      if (/^```/.test(line)) { out.push(`<pre>${esc(fence.join('\n'))}</pre>`); fence = null; } else fence.push(raw);
      continue;
    }
    if (/^```/.test(line)) { flushPara(); flushList(); fence = []; continue; }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushPara(); flushList(); out.push(`<h4>${inline(h[2], proto)}</h4>`); continue; }
    const li = line.match(/^\s*(?:[-*+]|\d+\.)\s+(.*)$/);
    if (li) {
      flushPara();
      list = list || [];
      const task = li[1].match(/^\[([ xX])\]\s+(.*)$/);
      list.push(task
        ? `<li class="task"><span>${task[1] === ' ' ? '☐' : '☑'}</span><span>${inline(task[2], proto)}</span></li>`
        : `<li>${inline(li[1], proto)}</li>`);
      continue;
    }
    if (/^>\s?/.test(line)) { flushList(); para.push(line.replace(/^>\s?/, '')); continue; }
    if (/^\|/.test(line) || /^---+$/.test(line)) continue;
    flushList();
    para.push(line.trim());
  }
  flushPara(); flushList();
  if (fence) out.push(`<pre>${esc(fence.join('\n'))}</pre>`);
  return out.join('');
}
const plain = (s) => String(s || '').replace(/\*\*|`|^#+\s*/gm, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
// The brief is the note's first line; a short heading-like first line takes the next one along.
function splitHead(note) {

  if (i < 0) return { head: '', rest: '' };
  let head = lines[i].trim();
  if (head.length < 40 && lines[i + 1]?.trim()) { i++; head += ' · ' + lines[i].trim().replace(/^(?:[-*+]|\d+\.)\s+/, ''); }
  return { head, rest: lines.slice(i + 1).join('\n').replace(/^\s*\n/, '') };
}

  const lines = [];
  for (const l of String(note || '').split('\n')) { if (!l.trim()) { if (lines.length) break; continue; } lines.push(l.trim()); }

}

}

// ── Model ───────────────────────────────────────────────────
let M = null;            // normalized data
let SOURCES = [];        // [{id, name, live}]
const DEMO = JSON.parse(document.getElementById('demo').textContent);
const CLOSED = new Set(['done', 'backlog', 'wontfix']);
const needsYou = (i) => i.assignee === 'human' && !i.archived && !CLOSED.has(i.status);
const runKey = (r) => r.at.slice(0, 16).replace(':', '');

function normalize(raw, live) {
  const issues = new Map(raw.issues.map((i) => [i.id, { ...i, labels: Array.isArray(i.labels) ? i.labels : [] }]));
  const filedBy = new Map();
  const mentionedIn = new Map();
  const routines = raw.routines.map((rt) => {
    const runs = [...(rt.runs || [])].map((r) => {
      const at = new Date(r.at);
      const ids = refIds(r.note);
      const day = ymd(at);
      const filed = ids.filter((id) => issues.get(id)?.created === day);
      const mentioned = ids.filter((id) => issues.has(id) && !filed.includes(id));
      const { head, rest } = splitHead(r.note);
      const brief = r.status === 'running' && !head ? `Running since ${hhmm(at)}` : clip(plain(head) || RUN_LABEL[r.status], 170);
      const mins = r.started && r.finished ? Math.round((Date.parse(r.finished) - Date.parse(r.started)) / 60000) : null;
      return { ...r, at, key: runKey(r), day, brief, head, rest, filed, mentioned, mins, slug: rt.slug };
    }).sort((a, b) => b.at - a.at);
    return { ...rt, runs, last: runs[0] || null };
  });
  for (const rt of routines) for (const r of [...rt.runs].reverse()) {
    for (const id of r.filed) if (!filedBy.has(id)) filedBy.set(id, { rt, r });
    for (const id of r.mentioned) { if (!mentionedIn.has(id)) mentionedIn.set(id, []); mentionedIn.get(id).push({ rt, r }); }
  }
  const projects = (raw.projects || []).map((p) => ({
    ...p,
    sessions: [...(p.sessions || [])].sort((a, b) => (b.date || '').localeCompare(a.date || '')),
  })).sort((a, b) => (b.lastSession || '').localeCompare(a.lastSession || ''));
  return {
    live, ws: raw.ws, now: raw.now ? new Date(raw.now) : new Date(),
    lastVisit: raw.lastVisit ? new Date(raw.lastVisit) : null,
    routines, issues, projects, filedBy, mentionedIn,
  };
}

function windowStart() {
  const d = new Date(M.now);
  if (state.win === 'today') { d.setHours(0, 0, 0, 0); return d; }
  d.setDate(d.getDate() - (state.win === '30d' ? 30 : 7)); d.setHours(0, 0, 0, 0);
  return d;
}
function derive() {
  const start = windowStart();
  const startDay = ymd(start);
  const runs = M.routines.flatMap((rt) => rt.runs.filter((r) => r.at >= start).map((r) => ({ rt, r }))).sort((a, b) => b.r.at - a.r.at);
  const issues = [...M.issues.values()];
  const filed = issues.filter((i) => !i.archived && (i.created || '') >= startDay)
    .sort((a, b) => (b.created || '').localeCompare(a.created || '') || b.id.localeCompare(a.id));
  const needs = issues.filter(needsYou).sort((a, b) =>
    (a.status === 'in-review' ? 0 : 1) - (b.status === 'in-review' ? 0 : 1) || (b.created || '').localeCompare(a.created || ''));
  const moved = M.projects.filter((p) => (p.lastSession || '') >= startDay);
  const recentProjects = M.projects.filter((p) => p.status !== 'shipped').slice(0, 4);
  const failed = runs.filter(({ r }) => runTone(r.status) === 'failed');
  const byRoutines = filed.filter((i) => M.filedBy.has(i.id));
  const upcoming = M.routines.filter((rt) => rt.next && rt.enabled !== false).sort((a, b) => Date.parse(a.next) - Date.parse(b.next));
  return { start, startDay, runs, filed, needs, moved, recentProjects, failed, byRoutines, upcoming };
}
const isNew = (d) => M.lastVisit && d > M.lastVisit;

// ── Shared fragments ────────────────────────────────────────
const P = () => state.proto;
const hrefIssue = (id) => `#${P()}/issue/${id}`;

function chip(id, mention) {
  const i = M.issues.get(id);
  if (!i) return `<span class="chip mention"><span class="id">#${id}</span></span>`;
  return `<a class="chip${mention ? ' mention' : ''}" href="${hrefIssue(id)}" data-issue="${id}">${statusIcon(i.status, 12)}<span class="id">#${id}</span><span class="t">${esc(i.title)}</span></a>`;
}
function runChips(r, opts = {}) {
  if (!r.filed.length && !r.mentioned.length) return '';
  const parts = [];
  if (r.filed.length) parts.push(`<span class="chip-label">Filed</span>` + r.filed.map((id) => chip(id)).join(''));
  if (r.mentioned.length && !opts.filedOnly) {
    const shown = r.mentioned.slice(0, opts.max ?? 3);
    const more = r.mentioned.length - shown.length;
    parts.push(`<span class="chip-label">Mentions</span>` + shown.map((id) => chip(id, true)).join('') + (more > 0 ? `<a class="link" href="${hrefRun(r)}">+${more}</a>` : ''));
  }
  return `<div class="chips">${parts.join('')}</div>`;
}
function strip(rt, n = 14, cur) {
  const runs = rt.runs.slice(0, n).reverse();

  return `<span class="strip" aria-label="Last ${runs.length} runs">${runs.map((r) =>
    `<a class="tick ${runTone(r.status)}${cur && r === cur ? ' cur' : ''}" href="${hrefRun(r)}" title="${esc(when(r.at))} · ${RUN_LABEL[r.status]}"></a>`).join('')}</span>`;
}
function rtState(rt) {

  if (rt.last?.status === 'running' || rt.state === 'running') return { cls: 'running', label: 'Running' };
  return { cls: rt.last ? runTone(rt.last.status) : 'missed', label: rt.last ? RUN_LABEL[rt.last.status] : 'No runs' };
}
function nextText(rt) {
  if (rt.enabled === false || rt.state === 'paused') return 'Paused';
  if (!rt.next) return '—';
  const d = new Date(rt.next);
  return `Next ${dayLabel(ymd(d)).replace('Today', 'today')} ${hhmm(d)}`;
}
function issueRow(i, aside = '') {

}

}
function counts(slug) {

// ── B · Timeline ────────────────────────────────────────────
function renderB(D) {
