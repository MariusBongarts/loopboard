 board tools wrapped \"Backlog N\" onto a second row at 1440 px with the\n  feed open. The filter box now gives up width first.\n- Visual baselines were stale yet passing: the 1% tolerance hid a stray\n  bullet and a changed count. Tolerance is 0.2% and the baselines are fresh.\n\n## Acceptance criteria\n\n- [x] Spec § 3 \"Columns out of view are hinted\" + e2e\n- [x] Baselines regenerated and reviewed in both themes\n\n## Notes\n\n- The fade is a CSS mask driven by `src/overflow.ts`.\n"},{"id":"0045","title":"Adopt neutral tokens, Inter and a rewritten Brand Kit","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui","design"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want a neutral gray UI with one violet accent and Inter, in light and dark, so that loopboard feels calm and current.\n\n## Acceptance criteria\n\n- [x] Semantic tokens (backgrounds, surfaces, borders, 4 text levels, accent set, focus ring, status colors, 7 tones, radii, shadows, motion) replace paper/ink/ember everywhere; no old token names remain\n- [x] Inter Variable and JetBrains Mono self-hosted; Fraunces and Geist removed from deps and CSS\n- [x] Base elements restyled: buttons (primary, secondary, ghost, danger), inputs, selects, segmented, kbd, focus rings\n- [x] Wordmark = loop mark + \"loopboard\" in Inter; favicon in the accent\n- [x] `scripts/contrast.mjs` checks the new pairs in both themes and passes\n- [x] Brand Kit rewritten (tokens, type, components, rules); components rule and spec § 14 updated\n- [x] Visual baselines regenerated and reviewed\n\n## Out of scope\n\n- Per-component layout restyles (later issues)\n\n## Notes\n\n- Global stylesheet keeps tokens, base elements and shared primitives; component styles move into SFCs as each is restyled.\n"},{"id":"0046","title":"Show status icons, assignee avatars, label pills and project badges everywhere","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want statuses as small Linear-style icons and assignees as avatars, with quiet label pills and project badges, so that I can scan state and ownership at a glance.\n\n## Acceptance criteria\n\n- [x] `StatusIcon` draws backlog, todo, in progress, in review, done, blocked and wontfix by shape and color\n- [x] `Avatar` for agent and human; `LabelPill` (dot + name); `ProjectBadge` (tone square + name)\n- [x] Cards, list rows, feed rows, the issue view, Needs you and the palette use them instead of text chips\n- [x] lucide icons bundled and credited in CREDITS.md\n\n## Out of scope\n\n- Layout changes of cards/rows (Phase 4)\n\n## Notes\n\n- Status icons are our own SVG; lucide covers UI glyphs.\n"},{"id":"0047","title":"Rebuild the rail: feed views, workspace destinations, icons and collapse","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui","navigation"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want the rail to be the one place to filter the feed and reach every destination, with icons and a collapsed mode, so that navigation is fast and the board gets room.\n\n## Acceptance criteria\n\n- [x] Feed views Inbox, Needs you, Sessions, Issues with counts; the feed's chip row is gone\n- [x] Workspace section: All issues (list view), Projects, Specs; then Views and Projects\n- [x] Every entry has an icon; the rail collapses to icons and expands again, remembered\n- [x] Footer: Help, Settings; the theme toggle moves into Settings\n- [x] Specs § 2 and § 13 updated; e2e cover the rail views and collapse\n\n## Out of scope\n\n- Resizing beyond the existing rail drag (#0048)\n"},{"id":"0048","title":"Resize the rail, feed and issue panel","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want to drag-resize the rail, the feed and the issue panel, each remembered and reset by double-click, so that I can fit my screen.\n\n## Acceptance criteria\n\n- [x] One resize composable used by the rail, the feed and the issue panel\n- [x] Pointer drag, arrow keys on a focused separator, double-click resets; widths clamped and stored per browser\n- [x] Spec § 2 resize scenario generalized; e2e for feed and panel resize\n\n## Notes\n\n- Replaces the rail's own resize code.\n"},{"id":"0049","title":"Add Settings (theme, editor) and open issues in VS Code or Cursor","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want to pick my editor once and open any issue file in it with one click, so that I jump straight to the source.\n\n## Acceptance criteria\n\n- [x] Settings dialog from the rail and ⌘K: Theme (System / Light / Dark) and Editor (None / VS Code / Cursor)\n- [x] \"Open in editor\" in the issue view (the context menu gets it in #0055) links to `vscode://file/…` or `cursor://file/…` with the absolute path\n- [x] Hidden when Editor is None; a ⌘K command exists when set\n- [x] Vitest for the URL builder; spec § 14 (settings) and § 5 (open in editor) with e2e\n"},{"id":"0050","title":"Turn the issue drawer into a resizable panel with previous / next","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want issues to open in a side panel I can resize and step through, so that I can review a column or list without closing it.\n\n## Acceptance criteria\n\n- [x] The panel replaces the drawer; restyled header (status icon, id, title), properties row, relations, history, body\n- [x] Opening from the board, list or feed passes that order; ‹ › buttons and `j`/`k` step through it\n- [x] Width resizable and remembered (#0048); Esc closes; no backdrop dims the board\n- [x] Spec § 5 updated; e2e for prev/next and resize\n\n## Out of scope\n\n- Full page (#0051)\n"},{"id":"0051","title":"Open an issue as a full page with its own URL","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui","navigation"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want to expand an issue into a full page at its own URL, so that I can focus on it or share the link.\n\n## Acceptance criteria\n\n- [x] `/w/:ws/issues/:id` renders the same issue view: body left, properties right\n- [x] Expand button in the panel; back returns to where I was; ⌘K and Needs you can open it\n- [x] Unknown ids show a clear \"No issue #NNNN\" state with a way back\n- [x] Spec § 5 scenario and e2e\n"},{"id":"0052","title":"Change status, assignee, labels, project and parent in place","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui","server"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want small pickers for an issue's properties, so that I change metadata without Edit mode.\n\n## Acceptance criteria\n\n- [x] One `Menu` primitive: anchored, arrow keys, type-to-filter, Esc; used for every picker\n- [x] Status, assignee, labels (multi, create new), project, parent pickers in the issue view\n- [x] The issue PATCH accepts `labels`, `project`, `parent`; line-level edits keep comments and order; invalid values are 400\n- [x] Optimistic updates, rolled back with the error banner on failure\n- [x] Vitest for PATCH validation/edits; spec § 4 scenarios and e2e that check the file on disk\n\n## Out of scope\n\n- Context menus (#0055)\n\n## Notes\n\n- `priority` stays board order — no priority picker.\n"},{"id":"0053","title":"Restyle the board: cards and columns","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want compact Linear-like cards and columns, so that the board is scannable.\n\n## Acceptance criteria\n\n- [x] Cards: status icon, id, title, labels, assignee avatar, markers; no file path\n- [x] Columns: status icon, name, count; quieter empty strips; drag targets unchanged\n- [x] Project pane header, tabs and board tools restyled\n- [x] Spec § 3 card scenario updated; visual baselines\n"},{"id":"0054","title":"Restyle list, feed and Needs you rows","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want dense, consistent rows across the list, the feed and Needs you, so that the app feels like one tool.\n\n## Acceptance criteria\n\n- [x] One issue row component for the list view, project list layout and Needs you\n- [x] Feed rows: session vs issue icon, title, quiet meta; day headers restyled\n- [x] List view header and filters restyled\n- [x] Visual baselines\n"},{"id":"0055","title":"Right-click menus on cards and rows","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want a right-click menu on any issue card or row, so that common actions are one click away.\n\n## Acceptance criteria\n\n- [x] Cards, list rows and feed issue rows open the `Menu` at the pointer\n- [x] Items: Status ▸, Assignee ▸, Labels ▸, Project ▸, Open page, Open in editor, Copy agent prompt, Copy path, Copy link, Send to backlog / Mark reviewed\n- [x] Keyboard accessible (context-menu key / Shift+F10 on a focused card or row)\n- [x] Spec § 4 scenario and e2e\n"},{"id":"0056","title":"Restyle every remaining screen","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want every screen to match the new look, so that nothing feels like the old app.\n\n## Acceptance criteria\n\n- [x] Projects overview, specs view, Help, welcome/home, Needs you page, workspace dialogs, create dialogs, command palette, toasts, editor, backlog drawer\n- [x] No leftover old classes or tokens; Brand Kit components section matches\n- [x] Visual baselines for every screen in both themes\n"},{"id":"0057","title":"Start quick-created issues from a headings-only skeleton","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["server"],"created":"2026-10-05","category":"task","archived":false,"body":"\n## What needs to change\n\nStart quick-created issues from a headings-only skeleton.\n\n## Acceptance criteria\n\n- [x] Created issues keep the category template's headings and empty checklist items; guidance prose is dropped\n- [x] Vitest for the skeleton; spec § 11 updated; e2e checks the file\n\n## Notes\n\n- Decided with the maintainer (project 01, question 17).\n"},{"id":"0058","title":"Review the new UI end to end and refresh specs, docs and baselines","status":"done","assignee":"agent","project":"02-linear-like-ux","labels":["ui","testing"],"created":"2026-10-05","category":"task","archived":false,"body":"\n## What needs to change\n\nReview the new UI end to end and refresh specs, docs and baselines.\n\n## Acceptance criteria\n\n- [x] Visual review of every screen in both themes; findings fixed or logged in wip.md\n- [x] Every spec row ✅/🟡 with a named test; architecture docs (client, overview) updated\n- [x] `pnpm verify`, `pnpm test:e2e`, `pnpm smoke` pass\n"},{"id":"0059","title":"Parent ids made of digits 0–7 point at the wrong issue","status":"done","assignee":"agent","project":null,"labels":["data"],"created":"2026-10-05","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. Give an issue `parent: 0016` (unquoted) in its frontmatter.\n2. Open it on the board.\n\n## Current behavior\n\nThe card's \"waiting on\" marker is missing and the issue view shows the\nrelation as `#0014`. js-yaml (YAML 1.1) reads an unquoted `0016` as octal 14,\nso every parent whose digits are all 0–7 is wrong — in this repo #0036 pointed\nat #0029 instead of #0035. Found while recording the README demo (#0036).\n\n## Expected behavior\n\n`parent:` is the four-digit id written in the file, quoted or not.\n\n## Acceptance criteria (verification)\n\n- [x] Reproduction steps no longer reproduce the bug\n- [x] Regression test added at the right seam (or absence of seam documented)\n- [x] No `[DEBUG-...]` instrumentation left behind\n\n## Out of scope\n\n- `id:` — already taken from the filename for the same reason.\n\n## Notes\n\n- Fixed by reading `parent` from the raw frontmatter line (`readField`), not\n  the parsed YAML. Vitest: `tests/issues.test.ts` \"parent ids\".\n"},{"id":"0060","title":"Turn Help into a Help Center with its own navigation","status":"done","assignee":"agent","project":"03-help-center","labels":["ui","help"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want Help to have its own navigation (Overview,\nWorking with AI agents, Set up a repo, Upgrade a harness, Reference), so that\nI can go straight to what I need instead of scrolling one long page.\n\n## Acceptance criteria\n\n- [x] `/help` is a layout with a sidebar (top nav on narrow screens) and child pages `/help`, `/help/learn`, `/help/setup`, `/help/upgrade`, `/help/reference`\n- [x] Every Help link keeps `?from=`; \"← Back to the board\" returns to that workspace from any Help page\n- [x] `?`, the rail's Help link and the ⌘K command still open `/help`\n- [x] Set up a repo holds the setup prompt, what `init` creates and the \"already set up?\" note; Reference holds the loop, folder map, statuses and keyboard shortcuts\n- [x] The setup prompt component is generalized into one copyable prompt component (text + button label)\n- [x] Help styles move out of `styles.css` into the Help components; light and dark both pass `pnpm contrast`\n- [x] Spec § 9 and its e2e tests updated\n\n## Out of scope\n\n- The overview's diagram (#0063), the course (#0066), the upgrade page's content (#0061, #0062)\n\n## Notes\n\n- PRD stories 1–4, 7, 8.\n- The app scrolls inside `#app`, not the window, so the Help layout handles hash jumps and scroll-to-top itself; the router's `scrollBehavior` can't reach it.\n"},{"id":"0061","title":"Put the upgrade guide and its prompts in the Help Center","status":"done","assignee":"agent","project":"03-help-center","labels":["ui","help","server"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want the upgrade prompts in the Help Center, each with\na copy button and filled in with the path of the loopboard I'm running, so\nthat I don't have to find them in the README and edit a placeholder.\n\n## Acceptance criteria\n\n- [x] The full upgrade prompt lives in `docs/upgrade-prompt.md`; the README quotes it verbatim and a unit test fails if either README prompt drifts from its doc\n- [x] `/help/upgrade` shows the short request (\"upgrade my loopboard harness\") and the full prompt, each copyable\n- [x] The full prompt names the running package's path instead of `<path-to-loopboard>`\n- [x] The page explains `npx loopboard init --upgrade` and its `--force` / `--dry-run` flags, and what the skill does that the CLI doesn't\n- [x] e2e: copying the full prompt puts the doc text with the real path on the clipboard\n\n## Out of scope\n\n- Per-repo harness levels (#0062)\n\n## Notes\n\n- PRD stories 9–11. The path comes from `GET /api/harness` (#0062 adds the workspace part).\n"},{"id":"0062","title":"Show which repos' harnesses are behind the latest migration","status":"done","assignee":"agent","project":"03-help-center","labels":["ui","help","server"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer**, I want to see every registered repo's harness level next\nto the latest migration, so that I know which repos to upgrade and what an\nupgrade will change.\n\n## Acceptance criteria\n\n- [x] `GET /api/harness` returns version, package path, latest migration, the migration list (id, title, date) and per workspace its level (marker in AGENTS.md, none → M000), legacy `ai/` root and missing folder\n- [x] Migration parsing lives in one server module that `init` uses too\n- [x] `/help/upgrade` lists each workspace with a status: Up to date, N behind, No marker, Legacy `ai/` root, Folder missing\n- [x] The migrations list shows each migration's id, title and date\n- [x] Vitest on real temp repos for every level case; handler test for the route; e2e against the fixture repos; spec § 9, server architecture doc and glossary updated\n\n## Notes\n\n- PRD stories 12–13.\n"},{"id":"0063","title":"Show the loop as an interactive diagram on the Help overview","status":"done","assignee":"agent","project":"03-help-center","labels":["ui","help"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **newcomer**, I want an overview page that shows the loop as a diagram\nI can click — each step telling me what I say to my agent and which skill\nruns — so that I understand the whole workflow in one glance.\n\n## Acceptance criteria\n\n- [x] The overview shows the loop (Decide → Plan → Slice → Build → Verify → Steer) as a native SVG in theme tokens\n- [x] Each step is a focusable button; selecting one (click, Enter, arrow keys) shows what you say, which skill answers and what it writes\n- [x] An accent arc shows how far round the loop the selected step is; the intro animation is off under reduced motion\n- [x] The overview links to every Help page with a one-line description each, and credits Matt Pocock's skills\n- [x] Step content comes from one typed content module shared with the course\n- [x] e2e: selecting a step shows its details; visual baseline refreshed for both themes\n\n## Notes\n\n- PRD stories 5–6.\n- Built an accent arc that moves to the selected step (plus a short intro animation) instead of a marker that orbits forever: perpetual motion would need a pause control (WCAG 2.2.2).\n"},{"id":"0064","title":"Render explainer videos from code with Remotion","status":"done","assignee":"agent","project":"03-help-center","labels":["videos","build"],"created":"2026-10-05","category":"task","archived":false,"body":"\n## What needs to change\n\nA standalone `videos/` package (outside the pnpm workspace and the published\nfiles) holds Remotion compositions in the app's tokens and fonts, and one\ncommand renders every composition in light and dark to MP4 plus a poster each,\ninto the app's public media folder. The CLI's static server serves those files\nwith the right types and `Range` support.\n\n## Why\n\nThe course (#0066) needs motion graphics that match the app and can be\nchanged without re-recording. Keeping Remotion a maintainer tool keeps\nloopboard's install and bundle light and keeps Remotion's license off\nloopboard's users.\n\n## Acceptance criteria\n\n- [x] `pnpm videos` installs the video package on demand and renders all compositions × 2 themes + posters; `pnpm videos:studio` opens Remotion Studio\n- [x] Video tokens (colors, fonts) match `styles.css`; a unit test checks the values\n- [x] The static server serves `.mp4`, `.jpg`, `.webp` with correct types and answers `Range` with 206; unit-tested\n- [x] ADR records \"Remotion renders, MP4s ship\"; release architecture doc explains the pipeline\n- [x] Remotion, React and the video sources are absent from `npm pack`\n\n## Notes\n\n- PRD stories 23, 24, 26.\n- Pinned Remotion 4.0.532: 4.0.533 was published the same day and pnpm's minimum-release-age policy rejects it.\n- The SSR build copied `public/` into `build/server/` too, shipping every video twice (9.3 MB package); `copyPublicDir` is now client-only (5.0 MB).\n"},{"id":"0065","title":"Make the six explainer videos for the course","status":"in-review","assignee":"human","project":"03-help-center","labels":["videos","content"],"created":"2026-10-05","category":"task","archived":false,"body":"\n## What needs to change\n\nSix short compositions (12–25 s each): files are the agent's memory, what a\nskill is, grill me, vertical slices, the issue loop, steering from the board.\nEach renders in both themes with a poster.\n\n## Why\n\nEach course chapter (#0066) gets a visual that explains its idea before the\nprose does.\n\n## Acceptance criteria\n\n- [x] Six compositions, on-screen text in plain words (Brand Kit voice), eased motion, nothing bounces\n- [x] Rendered MP4 + poster for each in light and dark; the set stays under 6 MB\n- [x] A unit test checks every course chapter's video exists in both themes with a poster\n\n## Notes\n\n- PRD stories 15–16.\n\n## Review\n\nWatch the six videos (Help → Working with AI agents, both themes — Settings\ntoggles the theme). Check that the on-screen copy says what you'd say, that\nthe pacing is calm enough to read at the size the page shows them, and\nnothing looks off. To change one: `pnpm videos:studio`, edit\n`videos/src/scenes/`, then `pnpm videos` and look at the new posters.\n"},{"id":"0066","title":"Teach working with AI agents in a course page","status":"in-review","assignee":"human","project":"03-help-center","labels":["ui","help","content"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **newcomer**, I want a course page that explains, chapter by chapter,\nwhy agents need a harness, skills, grilling, PRDs, vertical-slice issues, the\nissue loop, feedback loops and steering from the board — each with a short\nvideo and what to say to my agent — so that I learn how to work with agents,\nnot just how to use loopboard.\n\n## Acceptance criteria\n\n- [x] `/help/learn` has a chapter list and one section per chapter, each with prose, \"you say\" / skill, and a video (where one exists)\n- [x] The player follows the theme, shows the poster, autoplays muted and looped only while on screen, has controls, and never autoplays under reduced motion\n- [x] Matt Pocock is credited at the top and in the skills chapter, with links to his skills repo and writing\n- [x] e2e: chapters render with a video per video chapter; reduced motion keeps videos paused; spec § 9 updated\n\n## Notes\n\n- PRD stories 14–20.\n\n## Review\n\nTwo things the agent couldn't check:\n\n- **Safari.** Open the course with `pnpm build && pnpm start` (the CLI\n  server, which now answers `Range` requests) and in `pnpm dev`; the videos\n  should play when scrolled into view. Playwright's WebKit wasn't installed\n  for this version, so only Chromium is tested.\n- **The copy.** Read the eight chapters in `docs/learn/` (also readable on\n  GitHub). They're your public explanation of the workflow and credit Matt\n  Pocock; adjust tone or claims as you like.\n"},{"id":"0067","title":"Link Matt Pocock's videos with click-to-load embeds","status":"done","assignee":"agent","project":"03-help-center","labels":["ui","help","content"],"created":"2026-10-05","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **reader**, I want to watch Matt Pocock's videos on skills and AI coding\nfrom the course, without anything loading from YouTube until I click, so that\nI can go deeper and loopboard still doesn't call out on its own.\n\n## Acceptance criteria\n\n- [x] A \"Learn from the source\" section lists verified videos (oEmbed-checked IDs) as local cards: title, what it covers\n- [x] Clicking a card swaps in a `youtube-nocookie.com` embed; \"Open on YouTube\" opens it in a new tab\n- [x] e2e: no request to YouTube before a click; the iframe appears after it\n\n## Notes\n\n- PRD stories 21–22.\n- Six videos, each oEmbed-verified on 2026-10-05 (author \"Matt Pocock\"). A walkthrough on the AI Engineer channel was left out: its oEmbed author isn't Matt.\n"},{"id":"0068","title":"Render a shareable overview film of how I work with AI","status":"in-review","assignee":"human","project":"03-help-center","labels":["videos","content"],"created":"2026-10-05","category":"task","archived":false,"body":"\n## What needs to change\n\nA composition that plays the course scenes in sequence with an intro and\noutro (credit to Matt Pocock, loopboard link), in 1920×1080 and 1080×1080,\nrendered on demand to `videos/out/` (not shipped).\n\n## Why\n\nThe maintainer wants to post about their AI setup; the film reuses the\ncourse scenes instead of a separate edit.\n\n## Acceptance criteria\n\n- [x] `pnpm videos:film` renders landscape and square MP4s to `videos/out/`\n- [x] Intro names the workflow; outro credits Matt Pocock and links loopboard\n- [x] `videos/out/` is git-ignored\n\n## Notes\n\n- PRD story 25.\n\n## Review\n\nWatch `videos/out/loopboard-landscape.mp4` (1920×1080) and\n`videos/out/loopboard-square.mp4` (1080×1080), about two minutes each, before\nposting. On a phone the scenes' small UI text gets tiny — if that matters for\nthe platform, post single chapters (`public/media/learn-*-dark.mp4`) instead,\nor ask for a larger-type cut. The outro credits Matt Pocock and links\nmattpocock/skills.\n"},{"id":"0069","title":"Filter and sort the Projects view","status":"done","assignee":"agent","project":null,"labels":["ui"],"created":"2026-10-06","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer** with dozens of projects, I want to filter the Projects\nview by text and sort it by last activity, progress and more, so that I can\nfind a project without scrolling the whole list.\n\n## Acceptance criteria\n\n- [x] A \"Filter projects\" box narrows the list to projects whose number,\n  title, slug or current focus match every word; the header count follows\n  the filter, and a filter that matches nothing says so\n- [x] The filter lives in the URL (`?q=`), so Back from a project's board\n  restores it\n- [x] A sort menu orders projects inside each group by Last active\n  (default), Newest, Progress, Needs you or Name; the choice is remembered\n  per browser\n- [x] Spec 03 and an e2e test cover it\n\n## Out of scope\n\n- Filtering by status (the Active / Paused / Shipped groups already do that)\n- Saved views for projects\n\n## Notes\n\n- Reuses the feed's project search and the list view's toolbar, whose\n  styles move to shared primitives.\n"},{"id":"0070","title":"Groom the board with an issue-grooming skill","status":"done","assignee":"agent","project":null,"labels":["workflow","skills"],"created":"2026-10-06","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer whose boards fill up with issues stuck in review (80% in one\nrepo), stale work and old duplicates**, I want **to say \"groom the issues\" and\nhave my agent check every live issue against git, merged PRs and releases,\nclose what shipped, archive what's finished and ask me about the rest with a\nrecommendation**, so that **the board shows what's really open without me\ntriaging issue by issue**.\n\n## Acceptance criteria\n\n- [x] An `issue-grooming` skill covers every live issue (not `_archive/`), any status, including `done` ones left on the board\n- [x] It gathers evidence from commits that reference the issue, release tags, CHANGELOG, GitHub releases and merged PRs, `deployed:`, ticked criteria and `wip.md`; and detects duplicates, outdated, stale and unblocked issues\n- [x] Clear cases apply without a question: released + fully ticked → `done` (with `deployed:` when missing), cleared parent → `todo`, finished → archived; each move leaves a one-line `## Groomed (date)` note; it never sets `reviewed:`\n- [x] Everything else is asked in the chat's question UI (`AskUserQuestion` in Claude Code), grouped by cause, recommendation first; delete only on an explicit choice, otherwise `wontfix` + archive with `## Why rejected`\n- [x] A report mode lists what would change without writing\n- [x] It's a core skill: installed by `loopboard init`, linked into `.claude/` and `.cursor/`, credited as original, listed in the README, Help → Set up, the skills chapter and the folder map\n- [x] The managed AGENTS.md block (and `scaffold/AGENTS.block.md`), the issues and pro"},{"id":"0071","title":"Skipped and unreadable issue files vanish without a trace","status":"done","assignee":"agent","project":null,"labels":["server","data"],"created":"2026-10-13","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. In a workspace, add `.agents/issues/0002-Tax-Return.md` (capital letters in\n   the slug) and `.agents/issues/0003-broken.md` whose frontmatter has an\n   unquoted colon in `title:`.\n2. Open the board.\n3. Separately: make one issue file unreadable (`chmod 000`, or a cloud-only\n   placeholder on a synced folder that fails to hydrate) and reload.\n\n## Current behavior\n\n- Steps 1–2: both files are missing from every view. The only trace is a\n  `console.warn` in the server log for the malformed one; the mis-named one\n  is dropped silently because it fails the filename pattern. `next-id` still\n  counts them, so the board and the allocator disagree about what exists.\n- Step 3: `stat`/`readFile` throw outside the try block, so the whole\n  `/api/w/:id/data` response is a 500 and the workspace shows nothing.\n\nSeen on a real workspace with ~950 live issues: 7 issues were invisible (6\nwith broken YAML, 1 with capitals in the filename) and nobody noticed.\n\n## Expected behavior\n\nA file the reader can't show is reported, never dropped: the board says how\nmany files it skipped and why, and one bad file never takes the workspace\ndown.\n\n## Acceptance criteria (verification)\n\n- [x] `/api/w/:id/data` returns `skipped: [{ file, reason }]` covering\n  malformed frontmatter, filenames that look like issues but fail the\n  pattern, and files that can't be read\n- [x] An unreadable file is skipped and reported instead of failing the\n  request\n- [x] The rail shows \"N files skipped\"; opening it lists each file with its\n  reason and a copyable prompt asking the agent to fix them\n"},{"id":"0072","title":"Live updates stop silently when the file watcher fails","status":"done","assignee":"agent","project":null,"labels":["server","ui"],"created":"2026-10-13","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. Open a workspace on the board; the rail shows \"Live\".\n2. Make the recursive watcher emit an error (e.g. the watched root is\n   replaced or briefly unavailable, as happens on synced or network folders).\n3. Edit an issue file.\n\nAlso: register a workspace whose `issues/` folder is a symlink and edit an\nissue through the link target.\n\n## Current behavior\n\nOn a watcher error the hub closes the watcher and forgets the root. Nothing\nre-subscribes and the client is never told, so the indicator keeps saying\n\"Live\" while no events arrive until the page is reloaded. A symlinked\n`issues/` folder never produces events at all.\n\n## Expected behavior\n\nThe board either is live or says it isn't. After a watcher failure it\nrecovers on its own, and a manual refresh is always one action away.\n\n## Acceptance criteria (verification)\n\n- [x] On a watcher error the client is notified (state is no longer \"live\"\n  and one refetch runs) and the server re-watches with backoff\n- [x] Optional polling (`LOOPBOARD_POLL_MS`) compares mtime and file count of\n  `issues/` and `projects/` and emits the same change event\n- [x] A symlinked `issues/` or `projects/` folder is detected and falls back\n  to polling\n- [x] \"Refresh\" is always reachable (⌘K and a click on the live indicator)\n- [x] A test simulates the watcher error and checks the re-subscription\n\n## Out of scope\n\n- Per-file change events (the board refetches the workspace today)\n- Detecting conflict copies written by sync clients (see #0071)\n\n## Notes\n\n- Related: #0071 reports files the reader had to skip.\n- The stream gained a "},{"id":"0073","title":"Relative links in issue and PRD bodies throw you back to the start page","status":"todo","assignee":"agent","project":null,"labels":["ui","navigation"],"created":"2026-10-13","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. Open an issue whose body contains a relative markdown link, e.g.\n   `[the PRD](../projects/01-open-source-launch/prd.md)` or\n   `[#0012](0012-some-issue.md)`.\n2. Click the link.\n\n## Current behavior\n\nThe browser follows the relative href, the server's SPA fallback answers,\nand you land on `/` — the issue you were reading is gone. The issue body only\nhandles `#NNNN` reference buttons and task checkboxes; ordinary anchors are\nnot intercepted. Rendered markdown is also inserted unsanitised.\n\nOn a real workspace 430 issues contain relative links; in document-heavy\nworkspaces most issues will.\n\n## Expected behavior\n\nA click on a link inside rendered markdown never loses your place: links to\nissues open the issue, other relative links resolve to a file path you can\ncopy or open in your editor, and external links open in a new tab.\n\n## Acceptance criteria (verification)\n\n- [ ] Clicking a relative link never navigates away from the current view\n- [ ] Links that point at an issue file open that issue, from issue bodies\n  as well as from PRD/WIP documents\n- [ ] Other relative links show the resolved path with \"Copy path\" and\n  \"Open in editor\"\n- [ ] External `http(s)` links open in a new tab with `rel=\"noopener\"`\n- [ ] Rendered markdown is sanitised (no script, no inline event handlers)\n- [ ] An e2e test covers an issue link, a non-issue relative link and an\n  external link\n\n## Out of scope\n\n- Rendering non-issue documents inside the board\n- Rewriting existing links in files\n\n## Notes\n\n- PRD/WIP documents already resolve issue links through a shared click\n "},{"id":"0074","title":"Declutter the rail and lists, and count \"Needs you\" one way","status":"todo","assignee":"agent","project":null,"labels":["ui","structure"],"created":"2026-10-13","category":"task","archived":false,"body":"\n## What needs to change\n\nThe board reads clearly with a handful of issues and loses that at real size\n(~950 live issues, 40+ unshipped projects). Tidy the parts that grow without\nbound, and make \"Needs you\" mean one thing:\n\n- **Needs you** is computed twice with different rules: the rail excludes\n  `backlog` and ignores `blocked`, the cross-workspace `/needs-you` view\n  includes human-assigned `backlog` issues and every `blocked` issue. The\n  same workspace shows 102 in one place and 110 in the other.\n- **\"Issues\" and \"All issues\"** sit in the rail with the same count but lead\n  to different places (a feed filter and the list view).\n- **\"Inbox\"** is an activity feed whose count is the total number of feed\n  entries; it never goes down.\n- **The list view** opens with every status, so hundreds of done issues are\n  expanded by default.\n- **The Done column** has no limit and includes archived issues.\n- **The rail** lists every unshipped project and its sections can't be\n  collapsed.\n\n## Why\n\n\"What's waiting on me?\" is the board's main promise; two numbers for it\nundermine that. The rest is noise that hides the active work on any\nworkspace older than a few weeks.\n\n## Acceptance criteria\n\n- [ ] One `needsYou` definition lives in `shared/` and is used by the rail,\n  the board and `/needs-you`; a test pins the rule\n- [ ] \"Issues\" (feed filter) and \"All issues\" (list) are merged or renamed\n  so their difference is obvious\n- [ ] The Inbox count shows what's new since the last visit, or the entry is\n  renamed \"Activity\" and carries no count\n- [ ] The list view opens on open issues; \""},{"id":"0075","title":"Keep large boards fast","status":"todo","assignee":"agent","project":null,"labels":["server","data"],"created":"2026-10-13","category":"task","archived":false,"body":"\n## What needs to change\n\nMeasured on a real workspace with ~950 live and ~200 archived issues:\n\n- `/api/w/:id/data` answers in ~0.2 s but returns 10.9 MB uncompressed —\n  every issue with its full body — and the client refetches it on every file\n  change.\n- Creating an issue blocks the server for 3.6 s: the ID allocator walks\n  every git ref (191 here) synchronously.\n- Nothing is virtualised: pickers and lists render every row.\n\nSend less, cache what didn't change, and take ID allocation off the hot\npath.\n\n## Why\n\nIssue #0010 deferred optimisation until there was a measurement. This is the\nmeasurement. It also bounds how well the board copes once several large\nworkspaces are registered.\n\n## Acceptance criteria\n\n- [ ] `/data` returns issues without bodies; the body loads when an issue\n  opens. The reference workspace's payload is under 1.5 MB\n- [ ] Parsed issues are cached per file (path, mtime, size); the archive is\n  read only when a view needs it\n- [ ] Creating an issue blocks the server for at most 300 ms (cache per refs\n  fingerprint, or allocate asynchronously)\n- [ ] Parent pickers and lists render at most 100 rows at a time or\n  virtualise\n- [ ] Responses are compressed\n- [ ] A benchmark script against a generated 1,000-issue fixture records\n  payload size and create latency\n\n## Out of scope\n\n- A database or index file on disk — files stay the source of truth\n- Pagination of the board columns (see #0074 for the Done column)\n\n## Notes\n\n- Search currently relies on bodies being in memory on the client; move it\n  to a server endpoint or load bodies lazily when the searc"},{"id":"0076","title":"Make the CLI callable everywhere","status":"in-review","assignee":"human","project":null,"labels":["cli"],"created":"2026-10-13","category":"task","archived":false,"body":"\n## What needs to change\n\nThe CLI is only usable inside a clone of this repo, and it guesses where it\nshould refuse.\n\n**It only runs inside a clone.** The README, the scaffold and the skills\nsay `npx loopboard …`, but the package isn't on npm yet (#0001, #0035;\n`npm view loopboard` answered 404 on 2026-10-13), so that command fails\neverywhere. What works is `node bin/loopboard.js` from this repo. From\nanother folder there is no `loopboard` on the PATH, and when `build/` is\nmissing the binary dies with a raw `ERR_MODULE_NOT_FOUND` stack instead of\nsaying what to do.\n\n**A flag it doesn't know is read as a path.**\n`loopboard renumber 0042 --path ../repo` takes the path for the new number\nand stops with \"the new number must have 4 digits\"; `--path` only works when\nthe new number is given too. And `loopboard init --kind docs` — the command\nproject 04 is going to add — today ignores `--kind`, takes `docs` for the\ntarget and scaffolds a full code harness, skills and eight symlinks included,\ninto a new `docs/` folder.\n\nMake the CLI usable from any folder without the published package, and make\nit refuse what it doesn't understand.\n\n## Why\n\nProject 04 puts harnesses in many folders, most of them outside this repo,\nand its agents call `loopboard next-id`, `check` and later `where` and\n`resolve` from wherever they work. That has to work before a tree of\nharnesses is created. What makes `npx loopboard` itself work is publishing\nthe package — the maintainer's step, part of the launch (#0001, #0035,\n#0036).\n\n## Acceptance criteria\n\n- [x] Run without `build/`, the binary prints one senten"},{"id":"0077","title":"Slugs replace umlauts with a dash","status":"done","assignee":"agent","project":null,"labels":["server","data"],"created":"2026-10-13","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. Create an issue from the board titled \"Größe der Übersicht ändern\".\n2. Create a project with the same title.\n3. Register a folder named \"Büro\" as a workspace.\n\n## Current behavior\n\n- The issue file is `NNNN-gr-e-der-bersicht-ndern.md` and the project folder\n  `NN-gr-e-der-bersicht-ndern`.\n- The workspace id is `b-ro`, and so is its URL (`/w/b-ro`). If the folder\n  name arrives decomposed (`u` plus a combining diaeresis), the id is `bu-ro`\n  instead — two ids for the same name.\n\nThe slug function lowercases the text and turns every run of characters\noutside `a-z0-9` into one dash, so `ä`, `ö`, `ü`, `ß` and every other\naccented letter disappear. The slugs are valid, but unreadable — and file\nnames and ids are what people and agents search for.\n\n## Expected behavior\n\nSlugs stay readable: `NNNN-groesse-der-uebersicht-aendern.md`,\n`NN-groesse-der-uebersicht-aendern`, `buero`.\n\n## Acceptance criteria (verification)\n\n- [x] `ä` → `ae`, `ö` → `oe`, `ü` → `ue`, `ß` → `ss`, in either case, for issue file names, project folders and workspace ids\n- [x] Other accented Latin letters keep their base letter (`é` → `e`, `ñ` → `n`) instead of becoming a dash\n- [x] Precomposed and decomposed input give the same slug (macOS hands out folder names in either form)\n- [x] The slug function stays the single implementation behind issue file names, project folders, workspace ids and the `id` that `init` writes into an identity file (#0078); the 60-character cut for issue and project slugs is applied after transliteration and never ends on a dash\n- [x] Nothing that exists is "},{"id":"0078","title":"Set up a harness without code with loopboard init --kind docs","status":"in-review","assignee":"human","project":"04-harness-tree","labels":["cli","setup"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **person organising work that isn't code — a company's paperwork, taxes,\na wedding — in a plain, cloud-synced folder**, I want **`loopboard init --kind\ndocs` to set up issues and projects without specs, a verify command, skill\ncopies or symlinks**, so that **I get a board for that folder without deleting\nhalf the scaffold first**.\n\n## Acceptance criteria\n\n- [x] `loopboard init --kind docs [path]` creates exactly: `.agents/harness.md`, `.agents/issues/` with its README, its templates and `_archive/.gitkeep`, `.agents/projects/` with its README and templates, `.agents/.loopboard/manifest.json`, `AGENTS.md` and `CLAUDE.md`\n- [x] It creates no `specs/`, `architecture/`, `rules/`, `design/` or `SETUP.md`, copies no skills and creates no links under `.claude/` or `.cursor/`\n- [x] The identity file has `schema: 1`, `id`, `name` = the folder's name, `kind: harness`, `type: docs`, `parent: null`, `created` = today and a placeholder purpose paragraph; `--id`, `--name` and `--parent` override those three. `name` is written as a YAML-safe scalar — tested with a folder name that contains `:` and `#`\n- [x] The id is settled before anything is written: a folder that is already registered gets its workspace id, any other the folder's slug. `init` stops with one sentence asking for `--id` when the id breaks the pattern of the ADR (#0101), when the slug fell back to `workspace`, or when the id or an alias already belongs to a workspace registered at another path\n- [x] `--kind`, `--id`, `--name` and `--parent` take a value, and `init --kind docs` without a path sets up th"},{"id":"0079","title":"Take a harness's id, name and parent from its identity file","status":"todo","assignee":"agent","project":"04-harness-tree","labels":["server","workspaces","conventions"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer of several harnesses**, I want **loopboard to take a\nharness's id, name, kind and parent from `.agents/harness.md`**, so that **a\nharness is the same harness wherever its folder sits, two folders with the\nsame name can be told apart, and a harness can name the one it belongs\nto**.\n\n## Acceptance criteria\n\n- [ ] One module reads and validates the identity file — `schema`, `id`, `name`, `kind`, `parent`, `created`, and the optional `aliases`, `type` and `objects` (kept, never resolved — ADR-0009) — as the PRD and the ADRs from #0101 define them. `id`, `parent` and `aliases` are read from the raw line, so a value like `true`, `null` or `2026` stays the text it is; unknown fields are ignored and survive every write loopboard makes to the file\n- [ ] The file is looked for at `.agents/harness.md` in the node's folder, also when the issue root is a legacy `ai/`; root detection is unchanged\n- [ ] Registering a folder with a valid file uses its `id` as the workspace id and its `name` as the display name; `kind`, `type`, `parent` and `aliases` come back with the workspace from the API. The file is read at registration and again on every load of the workspace\n- [ ] A folder that never had a valid identity file registers under its slug id and works as today\n- [ ] Once the registry has taken an id from the file, a missing, unreadable or invalid file keeps the last known id, name, kind and parent, which the registry remembers — it never falls back to the slug. A sync client's conflict copy of `harness.md` is ignored\n- [ ] Each of those problems — an inva"},{"id":"0080","title":"A moved or symlinked harness shows up as a second workspace","status":"todo","assignee":"agent","project":"04-harness-tree","labels":["server","workspaces"],"created":"2026-10-13","category":"bug","archived":false,"body":"\n## Steps to reproduce\n\n1. Register a harness at `~/work/shop`.\n2. Register the same folder again through a symlink, e.g. `~/links/shop`.\n3. Separately: move a registered harness to another folder (or move its root\n   from `ai/` to `.agents/`), then open loopboard and register the new\n   location.\n\n## Current behavior\n\n- Step 2 creates a second workspace under the symlink's name. Both show the\n  same issues, and the cross-workspace \"Needs you\" lists each item twice.\n  Registration compares path strings, not real paths.\n- Step 3 leaves the old entry behind as \"folder missing\" and adds the new\n  location under a new id (`shop-2`). The workspace's URL, its saved views\n  and its pins and selection in the browser all hang on the old id, so they\n  are gone. On a synced folder this is routine: the same folder is reachable\n  through the sync client's real path and through a shortcut to it.\n\n## Expected behavior\n\nOne harness is one workspace. Reaching it another way re-selects it; moving\nit keeps its id and everything keyed by it. A second checkout of the same\nrepo still opens.\n\n## Acceptance criteria (verification)\n\n- [ ] Registration compares real paths: a symlinked path to a registered harness re-selects that workspace and adds no entry\n- [ ] A harness whose identity file carries a registered id, found at a new path while the old path no longer exists, updates the entry in place — same id, same URL, saved views intact\n- [ ] A git worktree or second clone of a registered harness — same id, both paths exist, the new one is a git checkout — is not refused: it opens as a secondary ch"},{"id":"0081","title":"Register index nodes — folders that group harnesses but hold no issues","status":"wontfix","assignee":"agent","project":"04-harness-tree","labels":["server","workspaces","ui"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## Why rejected\n\nMoved out of loopboard on 2026-10-14\n([ADR-0009](../architecture/decisions/0009-views-over-a-tree-live-outside-loopboard.md)).\nIndex nodes — like every view over a whole tree of harnesses — belong to a\ntool built on the same files, not to the board. loopboard stays a board per\nharness, for code and for documents, and keeps those files readable for\nsuch tools: the identity file, the reserved fields, `workspaces --json` and\nstable URLs (#0113). The text below stays as the record of what was\nplanned.\n\n## User story\n\nAs a **maintainer building a tree — a company above two code repos, a\n\"private\" node above taxes and a wedding**, I want **a folder with only an\nidentity file and an `INDEX.md` to be registrable**, so that **the tree has\nnamed inner nodes without an empty issues folder pretending to be a board**.\n\n## Acceptance criteria\n\n- [ ] A folder whose `.agents/harness.md` says `kind: index` registers without an `issues/` folder (today: \"No .agents/ or ai/ folder with issues/ found\")\n- [ ] Root detection keeps its order — `.agents/issues`, then `ai/issues` — and an identity file never wins over an existing root. Only when neither exists does a `kind: harness` folder register, with an empty board at `.agents/`\n- [ ] Opening an index node shows its name, its purpose paragraph, its parent and the registered nodes that name it as `parent` — no board, no feed, no create-issue action\n- [ ] Index nodes are never errors elsewhere: the cross-workspace \"Needs you\" leaves them out, and the harness table in Help → Upgrade lists them as index nodes instead of \"No AGENTS."},{"id":"0082","title":"Reference issues, projects and files in other harnesses and check them","status":"todo","assignee":"agent","project":"04-harness-tree","labels":["cli","ids","conventions"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer and as an agent working across harnesses**, I want **one\nway to write a reference to an issue, a project or a file in another harness,\nand `loopboard check` to tell me when it points nowhere**, so that\n**references are unambiguous although every harness counts from 0001, and\nstay valid as things move**.\n\n## Acceptance criteria\n\n- [ ] One parser, shared by server, CLI and client, implements the syntax of the ADR from #0101 — `<id>#NNNN` for an issue, `<id>#PNN` for a project by number, `<id>:<relative/path>` for a file, aliases resolving like ids — and leaves fenced code, inline code, markdown link targets, URLs, email addresses and an issue's `source:` line alone\n- [ ] A table-driven test pins what is and isn't a reference, including `github#1234`, a URL, a `mailto:` address, a Windows drive path, a YAML keyword in front of `#`, and `word:word` in ordinary prose\n- [ ] `<word>:<path>` counts as a reference only when the word is a registered id or alias; the `#` forms count whenever the word is a valid id\n- [ ] `loopboard check` resolves every qualified reference in `issues/`, `projects/` and `specs/` against the registered harnesses and prints one line per problem with file and reference: no such issue, no such project number, no such file\n- [ ] `--strict` exits 1 for those. For the `#` forms, an id no registered harness has is listed as \"not registered on this machine\" and does not fail `--strict`; a registered harness whose folder is missing is listed as unreachable\n- [ ] A qualified reference is never reported as a dangling local `#NNNN`,"},{"id":"0083","title":"Turn an id or a reference into a path with loopboard where and resolve","status":"todo","assignee":"agent","project":"04-harness-tree","labels":["cli","ids"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs an **agent working in one harness that needs something from another**, I\nwant **`loopboard where <id>` and `loopboard resolve <ref>` to print absolute\npaths, and `loopboard next-id --harness <id>` to allocate a number there**,\nso that **I follow a reference or file an issue in another harness without\nguessing where it lives or which number is free**.\n\n## Acceptance criteria\n\n- [ ] `loopboard where <id|alias>` prints the absolute path of that node's folder; `--json` adds id, name, kind, type, parent, aliases, and the root loopboard reads there (`.agents/` or a legacy `ai/`); an unknown id exits 1 and lists the ids that are registered\n- [ ] `loopboard resolve <ref>` prints the absolute path for `<id>#NNNN` (the issue file, live or archived), `<id>#PNN` (the project folder) and `<id>:<path>` (the file); an unqualified `#NNNN` resolves in the harness of the current folder; `--json` adds the kind of target and, for an issue, its title and status\n- [ ] A reference that doesn't resolve exits 1 with one line saying why: unknown id, no such issue, no such project, no such file, folder missing\n- [ ] `<id>:<path>` never resolves outside the harness folder: `..`, absolute paths and symlinks that lead out are refused\n- [ ] `loopboard next-id <issue|project> --harness <id>` prints the next free number of that harness from any folder\n- [ ] All three work without git and without a running board, appear in `--help`, and are tested from a foreign working directory against two temp harnesses\n- [ ] The issues README and the implement and to-issues skills say to follow a qual"},{"id":"0084","title":"Follow references to other harnesses in the board","status":"todo","assignee":"agent","project":"04-harness-tree","labels":["ui","navigation","server"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer reading an issue, a PRD or a WIP**, I want **a reference\nlike `shop#0412` to be a link that shows the target's status and title and\nopens it**, so that **I see whether the other side moved, and get there in\none click, without knowing where that harness lives**.\n\n## Acceptance criteria\n\n- [ ] `<id>#NNNN` in issue bodies, PRD and WIP documents and feed notes renders as a link with the target's status icon and title; clicking it opens that issue in its workspace\n- [ ] `<id>#PNN` opens that harness with the project selected; `<id>:<path>` shows the resolved path with \"Copy path\"\n- [ ] A reference that doesn't resolve — unknown id, no such number, folder missing — renders as plain text with an \"unresolved\" hint; clicking it does nothing and never navigates\n- [ ] Targets come from the **harness index**: one light server read per harness that returns rows of frontmatter fields — id, title, status and path to start with — and never a body. Later issues add fields to it instead of adding routes, and rendering a link never loads another workspace's full data\n- [ ] Plain `#NNNN` becomes a link in PRD and WIP documents too. Today only issue bodies and feed notes link it, and a document would otherwise show a linked foreign reference next to an unlinked local one\n- [ ] In issue bodies and feed notes unqualified `#NNNN` behaves exactly as before; text in code, in existing links and in URLs is left alone; aliases work like ids\n- [ ] Spec § 3 and § 5 gain the scenarios; an e2e test with two fixture workspaces covers an issue reference, a project reference "},{"id":"0085","title":"Give issues a due date and see what's overdue","status":"backlog","assignee":"agent","project":"04-harness-tree","labels":["ui","data","conventions"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer whose work has deadlines — a reply that is owed, a\nrenewal, an event with a date**, I want **an issue to carry a due date that\nthe board shows**, so that **work with a deadline doesn't look like every\nother todo and I notice it before the date passes**.\n\n## Acceptance criteria\n\n- [ ] An optional `due: YYYY-MM-DD` is read from the frontmatter (normalised like `created`) and returned by the API; today the field survives in the file but the reader drops it\n- [ ] A value that isn't a date never breaks anything: the issue loads without a due date, `loopboard check` prints the file with \"due is not a date\", and the issue view shows the raw value marked as invalid\n- [ ] The issue view has a date field in its properties; setting and clearing it writes only the `due:` line\n- [ ] Cards, list rows and the issue view show the date; an open issue past its date reads \"overdue\", one due within the next 14 days \"due soon\", and a closed issue shows the plain date. The 14 days are one constant in `shared/` that every due view uses\n- [ ] The issue templates, the issues README (where the field loses its \"reserved\" marker), `docs/statuses.md` and the glossary's \"Issue\" entry document the field. No migration entry: an existing harness has nothing to do\n- [ ] Vitest covers reading, patching and the overdue boundary (due today is not overdue); an e2e test sets a date in the past and sees \"overdue\" on the card; spec § 3, § 4 and § 5 gain the scenarios\n\n## Out of scope\n\n- Sorting, grouping and filtering by due date, and the order of the \"Needs you\" feed — #0105\n- Th"},{"id":"0086","title":"See what's due across all harnesses","status":"backlog","assignee":"agent","project":"04-harness-tree","labels":["ui","workspaces"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer with deadlines spread over a company, a taxes workspace\nand a few code repos**, I want **everything overdue or due in the next 14\ndays from every harness in one list**, so that **a deadline in a harness I\ndidn't open today can't hide**.\n\n## Acceptance criteria\n\n- [ ] The cross-workspace page gains a \"Due\" section next to \"Needs you\": every open issue with a due date that is overdue or due within the next 14 days, from every registered harness, soonest first\n- [ ] Each row shows the harness, the id, the title, the date with the overdue or due-soon styling from #0085, and who drives it; agent-assigned issues are included — a deadline is a deadline\n- [ ] The section reads the harness index from #0084, extended by `due` and the assignee — no issue bodies, no second route; harnesses whose folder is missing are listed as skipped\n- [ ] Clicking a row opens the issue in its workspace, selected, like a \"Needs you\" row does\n- [ ] The switcher entry reads \"All workspaces · Needs you and due\", and the page's heading and title read \"Needs you and due\"\n- [ ] A test for the index fields; e2e with two fixture workspaces, one with an overdue issue and one with a due-soon issue; spec § 7's \"See what needs me across all workspaces\" is updated\n\n## Out of scope\n\n- What's due per harness on an overview of the tree — not loopboard's (ADR-0009)\n- Live-watching every harness — the page refetches on open and on window focus, as today\n- Changing the window from 14 days — a fixed number until someone needs another\n\n## Notes\n\n- PRD story 24. Today the page reads every "},{"id":"0087","title":"Keep people and organisations as files every harness can reach","status":"wontfix","assignee":"agent","project":"04-harness-tree","labels":["server","cli","data","conventions"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## Why rejected\n\nMoved out of loopboard on 2026-10-14\n([ADR-0009](../architecture/decisions/0009-views-over-a-tree-live-outside-loopboard.md)).\nPeople and organisations as files — like every view over a whole tree of harnesses — belong to a\ntool built on the same files, not to the board. loopboard stays a board per\nharness, for code and for documents, and keeps those files readable for\nsuch tools: the identity file, the reserved fields, `workspaces --json` and\nstable URLs (#0113). The text below stays as the record of what was\nplanned.\n\n## User story\n\nAs a **maintainer who deals with the same people in several harnesses — the\naccountant in the company's and in the private taxes workspace**, I want **a\nperson or an organisation to be one markdown file with notes that every\nharness of my tree, and every agent working in one, can find**, so that\n**what we know about someone is a memory in one place instead of being\nscattered over issues**.\n\n## Acceptance criteria\n\n- [ ] Object files — markdown with frontmatter `type: person` or `type: organisation`, `id`, `name`, and on a person an optional `org: \"@id\"` — are read from the folder the tree's top node names in `objects:`, however that folder is organised below; the type comes from the frontmatter, never from a folder name\n- [ ] A harness finds its objects by following `parent` up to the top node; a harness whose top node isn't registered, or names no objects folder, simply has none. An `objects:` value that resolves outside the node's own folder — `..`, an absolute path, a symlink leading out — is refused and reported by `loopb"},{"id":"0088","title":"Say who owes a reply with waiting-on","status":"backlog","assignee":"human","project":"04-harness-tree","labels":["ui","data","conventions"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer whose work often waits on someone outside — the\naccountant, a customer**, I want **an issue to say\n`waiting-on: \"@accountant\"` and the board to show \"Waiting on the accountant\nsince 2 Oct\"**, so that **I see who owes me a reply and for how long,\nwithout inventing an assignee the board doesn't know**.\n\n## Acceptance criteria\n\n- [ ] An optional `waiting-on: \"@id\"`, or a list of them, is read from the frontmatter and returned by the API\n- [ ] Cards, list rows and the issue view show \"Waiting on\" with the value as written, without the leading `@`, and the date it has been waiting since. loopboard doesn't look the id up — it has no people or organisations (ADR-0009)\n- [ ] \"Waiting on\" means someone outside the board — a person or an organisation, written as `@id`. The badge and the board toggle for an unfinished parent issue are renamed from \"waiting on\" and \"Hide waiting\" to \"blocked by\" and \"Hide blocked\", and \"Hide blocked\" doesn't hide an issue that only waits on a person\n- [ ] The assignee is untouched: `waiting-on` neither changes who drives the issue nor adds a value to the assignee vocabulary. How such an issue shows under \"Needs you\" follows the answer to question 3\n- [ ] The issue templates, the issues README (where the field loses its \"reserved\" marker), `docs/statuses.md` and the glossary — \"Issue\", \"Waiting on\", \"Blocked by\" — document the field in its quoted form. No migration entry\n- [ ] Tests cover reading one value and a list, the unknown id and the renamed toggle; spec § 3 and § 5 gain the scenarios, and \"Hide issues that are w"},{"id":"0089","title":"Link @mentions and show backlinks on a person's page","status":"wontfix","assignee":"agent","project":"04-harness-tree","labels":["ui","navigation","data"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## Why rejected\n\nMoved out of loopboard on 2026-10-14\n([ADR-0009](../architecture/decisions/0009-views-over-a-tree-live-outside-loopboard.md)).\nMentions and backlinks on a person's page — like every view over a whole tree of harnesses — belong to a\ntool built on the same files, not to the board. loopboard stays a board per\nharness, for code and for documents, and keeps those files readable for\nsuch tools: the identity file, the reserved fields, `workspaces --json` and\nstable URLs (#0113). The text below stays as the record of what was\nplanned.\n\n## User story\n\nAs a **maintainer about to call the accountant**, I want **`@accountant` in\nany issue to link to their page, and that page to list every issue that\nmentions them or waits on them, across my harnesses**, so that **I see all\nopen threads with one person in one place**.\n\n## Acceptance criteria\n\n- [ ] `@id` in issue bodies, PRD and WIP documents and feed notes becomes a link to that object's page when the id belongs to a person or organisation of the tree; any other `@word`, and anything in code, in links or in an email address, stays as it is\n- [ ] An object's page lists its backlinks: every issue that mentions `@id` in its body or names it in `waiting-on`, from every harness of the tree, grouped by harness, each with status, title and — for waiting issues — since when\n- [ ] Open issues come first and closed ones sit behind a \"Show closed\" toggle; clicking a backlink opens the issue in its workspace\n- [ ] Backlinks come from the server as rows of id, title, status and harness — the browser never loads every workspace to "},{"id":"0090","title":"Create recurring issues with loopboard recur","status":"wontfix","assignee":"agent","project":"04-harness-tree","labels":["cli","workflow","conventions"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer with duties that come back every month, quarter or year —\na report to the accountant, a backup check, a renewal**, I want **one\ncommand to create this period's issue with its due date, exactly once**, so\nthat **nobody has to remember to file it, and a scheduled agent task can run\nthe command as often as it likes**.\n\n## Acceptance criteria\n\n- [ ] A recurring duty is described once in the harness — how often (month, quarter, year), on which day it is due, how many days ahead its issue should exist, a title pattern with the period in it, the usual issue fields, and the issue body\n- [ ] `loopboard recur [path]`, with `--harness <id>` or `--all` for every registered harness, creates for each duty the issue of the current period if it doesn't exist yet: next free number, `due:` set, `recurrence:` naming the duty and the period; it prints what it created\n- [ ] It is idempotent: a second run creates nothing, and an issue that was closed or archived in the meantime is not created again — the match is the `recurrence:` value across live and archived issues\n- [ ] `loopboard check` reports two issues that carry the same `recurrence:` value — two devices on one synced folder can each create the period's issue before the sync catches up\n- [ ] Periods that were missed are listed, not back-filled; `--dry-run` prints what would be created and writes nothing\n- [ ] The server never runs it: no timer and no route creates issues; the docs show how to call it from a scheduled agent task or from cron\n- [ ] Unit tests cover the period maths: a day that doesn't exi"},{"id":"0091","title":"Block an issue on several issues, also in other harnesses","status":"backlog","assignee":"agent","project":"04-harness-tree","labels":["ui","structure","conventions"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer whose work crosses harnesses — the company's announcement\nwaits on the shop's release and on two local issues**, I want **an issue to\nlist all its blockers, wherever they live, and to show what it blocks in\nturn**, so that **I and my agents pick work that is really unblocked, and I\nknow what finishing something unlocks**.\n\n## Acceptance criteria\n\n- [ ] An optional `blocked-by: [0029, shop#0412, shop#P04]`, written flow-style on one line, is read from the raw frontmatter line, so local numbers keep their leading zeros (#0059), and returned by the API; `parent:` stays valid and counts as one more blocker. `loopboard check` reports a `blocked-by` written any other way — in a block-style list YAML reads `0042` as 34\n- [ ] The issue view lists every blocker with status and title — foreign ones with their harness's name — and a \"Blocks\" list of the issues that name this one, including issues in other harnesses\n- [ ] \"Blocked\" — the badge on the card and in the issue view, and the board's \"Hide blocked\" toggle, both renamed in #0088 — considers all blockers: an issue is blocked while any of them is open\n- [ ] A blocker loopboard can't reach (id not registered, folder missing, no such issue) counts as unknown: shown as such, and the issue stays blocked; a project as blocker counts as done when its WIP says shipped\n- [ ] `loopboard check` validates every entry — local numbers against this harness, qualified ones like any other reference — and reports a cycle\n- [ ] `loopboard renumber` rewrites the number in the `blocked-by:` lists of the same harnes"},{"id":"0092","title":"See every harness on one Overview page","status":"wontfix","assignee":"agent","project":"04-harness-tree","labels":["ui","workspaces","server"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## Why rejected\n\nMoved out of loopboard on 2026-10-14\n([ADR-0009](../architecture/decisions/0009-views-over-a-tree-live-outside-loopboard.md)).\nAn Overview of the whole tree — like every view over a whole tree of harnesses — belongs to a\ntool built on the same files, not to the board. loopboard stays a board per\nharness, for code and for documents, and keeps those files readable for\nsuch tools: the identity file, the reserved fields, `workspaces --json` and\nstable URLs (#0113). The text below stays as the record of what was\nplanned.\n\n## User story\n\nAs a **maintainer running code repos, a company and private paperwork with\nthe same agents**, I want **one page that shows every harness as a tree with\nwhat needs me, what's due, who I'm waiting on, which projects are active and\nwhat was last done where**, so that **I see everything I run on one screen\nand know where to look next**.\n\n## Acceptance criteria\n\n- [ ] An Overview page shows every registered node as a tree by `parent`: index nodes as group rows, harnesses below them; a node whose parent isn't registered sits at the top level, and a node whose folder is missing is greyed out\n- [ ] Each harness row shows its open issues, \"Needs you\" (the single rule from #0074), overdue issues and the next due date, whom it waits on — the names, longest wait first, with the count — and its active projects with progress and their last session: the date and the first line of the entry\n- [ ] A \"Recent\" section lists the newest dated session entries of all harnesses — date, harness, project, first line — newest first, so \"what was last done"},{"id":"0093","title":"Show how harnesses depend on each other on the Overview","status":"wontfix","assignee":"agent","project":"04-harness-tree","labels":["ui","structure"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## Why rejected\n\nMoved out of loopboard on 2026-10-14\n([ADR-0009](../architecture/decisions/0009-views-over-a-tree-live-outside-loopboard.md)).\nConnections between harnesses on the Overview — like every view over a whole tree of harnesses — belong to a\ntool built on the same files, not to the board. loopboard stays a board per\nharness, for code and for documents, and keeps those files readable for\nsuch tools: the identity file, the reserved fields, `workspaces --json` and\nstable URLs (#0113). The text below stays as the record of what was\nplanned.\n\n## User story\n\nAs a **maintainer**, I want **a Connections section on the Overview that\nlists every dependency crossing a harness or project boundary, with the\nstatus of both sides**, so that **I see what holds up what without opening\neach issue**.\n\n## Acceptance criteria\n\n- [ ] The Overview gains a \"Connections\" section: one row per `blocked-by` entry (and `parent:`) whose two ends lie in different harnesses or in different projects of one harness\n- [ ] Each row shows both ends — harness, id, title, status — and which one is blocked by which; a project as blocker shows its project status\n- [ ] \"Open only\" is the default and hides connections whose blocker is done; an end loopboard can't reach is shown as unknown and never hidden\n- [ ] Rows are grouped by the harness that is blocked, and clicking either end opens it in its workspace\n- [ ] The data comes from the harness index the Overview already reads (#0084, with the `blocked-by` field from #0091) — no additional read of any harness\n- [ ] Spec § 7 gains the scenario; an e2e te"},{"id":"0094","title":"Show the workspace switcher as a tree","status":"wontfix","assignee":"agent","project":"04-harness-tree","labels":["ui","workspaces","navigation"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## Why rejected\n\nMoved out of loopboard on 2026-10-14\n([ADR-0009](../architecture/decisions/0009-views-over-a-tree-live-outside-loopboard.md)).\nThe switcher as a tree — like every view over a whole tree of harnesses — belongs to a\ntool built on the same files, not to the board. loopboard stays a board per\nharness, for code and for documents, and keeps those files readable for\nsuch tools: the identity file, the reserved fields, `workspaces --json` and\nstable URLs (#0113). The text below stays as the record of what was\nplanned.\n\n## User story\n\nAs a **maintainer with ten harnesses, two of them called \"taxes\"**, I want\n**the switcher to show the tree, tell same-named nodes apart and count what's\nopen**, so that **changing context stays one glance and one click**.\n\n## Acceptance criteria\n\n- [ ] The switcher indents nodes by `parent`; index nodes are rows you can open; the order follows the tree, then the name, and doesn't change between openings\n- [ ] Two nodes with the same display name show their parent's name next to it\n- [ ] Each harness shows its open issues and \"Needs you\" instead of the number of issue files; the counts come from the harness index (#0084) and the menu opens without waiting for them\n- [ ] A secondary checkout (#0080) sits under its harness, labelled with its branch or folder\n- [ ] Nodes whose folder is missing sit at the bottom, marked as today; the menu keeps the keyboard behaviour it has today\n- [ ] Spec § 7 scenario \"Switch workspace from the top-left\" is updated; e2e on the fixture tree; visual baselines refreshed in both themes\n\n## Out of scope\n\n- Re"},{"id":"0095","title":"Register a whole folder tree in one step","status":"backlog","assignee":"agent","project":"04-harness-tree","labels":["cli","workspaces","docs"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **maintainer whose harnesses sit under one folder**, I want **to name\nthat folder once and have loopboard register every harness below it — and, when I run it again, notice which moved or vanished**, so\nthat **I don't add ten harnesses by hand, while loopboard still never looks\nanywhere I didn't point it at**.\n\n## Acceptance criteria\n\n- [ ] A new ADR amends ADR-0002: loopboard still never crawls the home directory or discovers anything on its own; scanning one folder the user names, when the user asks, is allowed — with the depth limit and the skipped folder names written down\n- [ ] `loopboard add --tree <folder>` finds every `.agents/harness.md` below that folder (bounded depth; skipping `.git`, `node_modules`, build output and agent-tool worktree folders), prints what it found and registers it after a confirmation; `--dry-run` only lists and `--yes` skips the question\n- [ ] The home directory and a file-system root are refused as the folder to scan\n- [ ] Only folders with an identity file that says `kind: harness` are registered; a harness without one still needs an explicit add, and a folder whose file says `kind: index` is listed as skipped with the reason (ADR-0009)\n- [ ] Running it again on the same folder re-attaches nodes that moved (by id, as in #0080), offers the new ones and lists the ones that vanished; a scan never forgets anything\n- [ ] A scan reads identity files only — no issue content — and a test on a temp tree covers a nested harness, an index node that is skipped, a worktree folder that must be skipped and a symlink loop\n- [ ] Spec §"},{"id":"0096","title":"Search every harness from ⌘K and jump to a qualified reference","status":"backlog","assignee":"agent","project":"04-harness-tree","labels":["ui","navigation"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **keyboard user who remembers a title but not the harness it lives in**,\nI want **⌘K to find issues and projects in every harness, and typing\n`shop#0412` to jump straight there**, so that **I never have to switch\nworkspace first to find something**.\n\n## Acceptance criteria\n\n- [ ] ⌘K finds issues and projects from every registered harness, grouped by harness, with the current workspace's results first\n- [ ] Typing a qualified reference offers a direct jump as the first result: `<id>#NNNN` to the issue, `<id>#PNN` to the project; aliases work\n- [ ] Choosing a result from another harness switches workspace with that issue or project selected\n- [ ] Results from other harnesses come from the harness index (#0084: id, title, status, labels — no bodies); the palette opens at once and adds them when they arrive\n- [ ] Commands, the current workspace's results and their ranking stay as they are; other harnesses add at most a handful of rows each until the query narrows\n- [ ] Unit tests for ranking with foreign results; an e2e test with two fixture workspaces; spec § 11 updated\n\n## Out of scope\n\n- Searching issue bodies across harnesses — titles, ids and labels only; body search is per workspace (#0075 moves it to the server)\n- Actions on a foreign issue (change status, copy prompt) — open it first\n\n## Notes\n\n- PRD story 46. Today the palette offers \"Switch to …\" for other workspaces\n  and searches issues, projects and specs of the open one only.\n- Also needs #0082: the direct jump recognises a reference with the shared\n  parser.\n- Archived issues stay out, as the"},{"id":"0097","title":"Read linked markdown files inside loopboard and see which links are broken","status":"backlog","assignee":"agent","project":"04-harness-tree","labels":["ui","server","navigation"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## User story\n\nAs a **person whose work results are documents — notes, a checklist, a\ndraft**, I want **a link in an issue to a markdown file to open inside\nloopboard, and a link that points nowhere to say so**, so that **the issue\nis the way to the file and reading it doesn't lose my place**.\n\n## Acceptance criteria\n\n- [ ] A relative link in an issue, a PRD or a WIP is resolved relative to the file that contains it; a markdown target inside the harness folder opens in a read-only document view in loopboard, with a way back to where you were\n- [ ] A `<id>:<path>` reference to a markdown file opens the same view for that harness\n- [ ] A target that is missing or lies outside the harness folder is marked as broken, shows its resolved path, and offers no action\n- [ ] Rendering a link checks that the file exists without reading it, so a cloud placeholder isn't downloaded just because an issue was opened\n- [ ] The read path for files next to `.agents/` serves markdown only, and only when the file's real path lies inside a registered harness folder: `..`, an absolute path and a symlink that leads out are refused, each with a test\n- [ ] `loopboard check` warns about relative links in issues, PRDs, WIPs and `INDEX.md` that point at no file\n- [ ] An e2e test opens a linked markdown file and shows a broken link as broken; spec § 5 gains the scenarios\n\n## Out of scope\n\n- \"Open\" and \"Reveal\" for files that aren't markdown — #0110\n- Rendering PDFs, images or office files inside the board — they open in the system's app\n- Editing the opened markdown file — the document view is read-only"},{"id":"0098","title":"Add a Home tab with INDEX.md, AGENTS.md and the identity","status":"wontfix","assignee":"agent","project":"04-harness-tree","labels":["ui","workspaces"],"created":"2026-10-13","category":"user-story","archived":false,"body":"\n## Why rejected\n\nMoved out of loopboard on 2026-10-14\n([ADR-0009](../architecture/decisions/0009-views-over-a-tree-live-outside-loopboard.md)).\nA Home tab with INDEX.md and the identity — like every view over a whole tree of harnesses — belongs to a\ntool built on the same files, not to the board. loopboard stays a board per\nharness, for code and for documents, and keeps those files readable for\nsuch tools: the identity file, the reserved fields, `workspaces --json` and\nstable URLs (#0113). The text below stays as the record of what was\nplanned.\n\n## User story\n\nAs a **ma
