    <section class="sec">
      <div class="c-cols">
        <div class="card" id="j-you"><h4>Needs you · ${D.needs.length}${D.needs.length > 7 ? `<a class="link" href="${M.live ? '/needs-you' : '#'}">All →</a>` : ''}</h4>${D.needs.slice(0, 7).map((i) => issueRow(i)).join('') || empty('Nothing waits on you.')}</div>
        <div class="card" id="j-new"><h4>New issues · ${D.filed.length}</h4>${D.filed.slice(0, 7).map((i) => issueRow(i, M.filedBy.has(i.id) ? `<span class="via" title="Filed by ${esc(M.filedBy.get(i.id).rt.title)}">${ICON.routine}</span>` : '')).join('') || empty('No new issues in this period.')}</div>
        <div class="card" id="j-proj"><h4>Projects</h4>${D.recentProjects.map((p) => `<a class="c-pj" href="${hrefProject(p.slug)}"><div class="c-pj-h">${isNewDay(p.lastSession || '') ? '<span class="new"></span>' : ''}<span class="pbadge-mark ${tone(p.slug)}"></span>${esc(p.title)}<span class="when">${esc(p.lastSession ? dayLabel(p.lastSession) : '')}</span></div><p>${esc(clip(plain(firstPara(p.sessions[0]?.note || p.focus)), 140))}</p></a>`).join('') || empty('No projects yet.')}</div>
      </div>
    </section>
  </div>`;
}

// ── Preview dialog ──────────────────────────────────────────
function boardUrl(path) { return M.live ? path : null; }
function sheet({ crumb, url, body }) {
  const out = url ? `<a class="icon-btn" href="${url}" target="_blank" rel="noopener">${ICON.out}Open in loopboard</a>` : `<span class="icon-btn" aria-disabled="true" title="Demo data">${ICON.out}Open in loopboard</span>`;
  return `<div class="sheet-h">
      ${chain?.trail.length ? `<button class="icon-btn" data-act="back" title="Back">${ICON.back}</button>` : ''}
      <div class="crumb">${crumb}</div><span class="spacer"></span>
      <button class="icon-btn" data-act="copy" title="Copy link">${ICON.link}Copy link</button>${out}
      <button class="icon-btn" data-act="close" title="Close (Esc)" aria-label="Close">${ICON.x}</button>
    </div><div class="sheet-b">${body}</div>`;
}
function runSheet(slug, key) {
  const rt = M.routines.find((x) => x.slug === slug);
  const idx = rt ? rt.runs.findIndex((r) => r.key === key) : -1;
  if (idx < 0) return notFound('This run is no longer recorded.');
  const r = rt.runs[idx];
  const st = runTone(r.status);
  const end = r.finished ? hhmm(new Date(r.finished)) : '';
  const iss = [...r.filed.map((id) => [id, 'Filed']), ...r.mentioned.map((id) => [id, 'Mentioned'])].map(([id, how]) => [M.issues.get(id), how]).filter(([i]) => i);
  const older = rt.runs[idx + 1], newer = rt.runs[idx - 1];
  return sheet({
    crumb: `${ICON.routine}<a href="${hrefRoutine(slug)}"><b>${esc(rt.title)}</b></a><span>›</span><span>Run</span>`,
    url: boardUrl(`/w/${M.ws.id}/routines/${slug}`),
    body: `<h2 id="sheet-title">${inline(clip(plain(r.head), 220) || RUN_LABEL[r.status], P())}</h2>
      <div class="props"><span class="tag ${st}">${RUN_LABEL[r.status]}</span><span>${esc(when(r.at))}${end ? `–${end}` : ''}</span>${r.mins !== null ? `<span>${r.mins < 1 ? 'under a minute' : r.mins + ' min'}</span>` : ''}${r.host ? `<span class="mono">${esc(r.host)}</span>` : ''}${rt.kind === 'issue' ? '<span>files an issue</span>' : ''}</div>
      ${iss.length ? `<div class="box"><div class="box-h">Issues from this run</div>${iss.map(([i, how]) => issueRow(i, `<span class="tag ${how === 'Filed' ? 'ok' : 'missed'}">${how}</span>${pbadge(i.project)}`)).join('')}</div>` : ''}
      ${r.rest.trim() ? `<div class="prose">${md(r.head.length > 220 ? r.note : r.rest, P())}</div>` : ''}
      <div class="runnav">${older ? `<a class="icon-btn" href="${hrefRun(older)}">${ICON.back}Older</a>` : ''}<span class="spacer"></span>${strip(rt, 21, r)}<span class="spacer"></span>${newer ? `<a class="icon-btn" href="${hrefRun(newer)}">Newer <span style="transform:scaleX(-1);display:inline-flex">${ICON.back}</span></a>` : ''}</div>`,
  });
}
function routineSheet(slug) {
  const rt = M.routines.find((x) => x.slug === slug);
  if (!rt) return notFound('No routine with this name.');
  const st = rtState(rt);
  return sheet({
    crumb: `${ICON.routine}<span>Routine</span>`,
    url: boardUrl(`/w/${M.ws.id}/routines/${slug}`),
    body: `<h2 id="sheet-title">${esc(rt.title)}</h2>
      <div class="props"><span><span class="dot ${st.cls}"></span>${st.label}</span><span>${esc(rt.words || '')}</span><span>${esc(nextText(rt))}</span><span class="mono">${esc(slug)}</span>${rt.kind === 'issue' ? '<span>files an issue each period</span>' : ''}</div>
      <div style="margin:4px 0 14px">${strip(rt, 30)}</div>
      <div class="box-h" style="padding-bottom:4px">Runs</div>
      <div class="runlist">${rt.runs.slice(0, 12).map((r) => `<a href="${hrefRun(r)}"><span class="dot ${runTone(r.status)}"></span><span class="when">${esc(when(r.at))}</span><span class="brief">${esc(r.brief)}</span></a>`).join('') || empty('No runs yet.')}</div>`,
  });
}
function issueSheet(id) {
  const i = M.issues.get(id);
  if (!i) return notFound(`#${id} isn’t on this board.`);
  const f = M.filedBy.get(id);
  const ms = M.mentionedIn.get(id) || [];
  const labels = i.labels.map((l) => `<span class="pill ${tone(l)}"><span class="pill-dot"></span>${esc(l)}</span>`).join('');
  return sheet({
    crumb: `<span class="mono">#${esc(id)}</span>${i.project ? `<span>·</span>${pbadge(i.project)}` : ''}`,
    url: boardUrl(`/w/${M.ws.id}/issues/${id}`),
    body: `<h2 id="sheet-title">${esc(i.title)}</h2>
      <div class="props"><span>${statusIcon(i.status)}${STATUS_LABEL[i.status] || esc(i.status)}</span><span>${AV[i.assignee] || ''}${i.assignee === 'human' ? 'You' : 'Agent'}</span>${i.category ? `<span>${esc(i.category)}</span>` : ''}${i.created ? `<span>Filed ${esc(dayLabel(i.created))}</span>` : ''}${labels}</div>
      ${f || ms.length ? `<div class="box">${f ? `<div class="box-h">Filed by a routine</div><a class="irow" href="${hrefRun(f.r)}">${ICON.routine}<span class="t">${esc(f.rt.title)} · ${esc(when(f.r.at))}</span><span class="aside">${esc(clip(f.r.brief, 60))}</span></a>` : ''}
        ${ms.length ? `<div class="box-h">Mentioned in runs</div>${ms.slice(-4).reverse().map(({ rt, r }) => `<a class="irow" href="${hrefRun(r)}"><span class="dot ${runTone(r.status)}"></span><span class="t">${esc(rt.title)} · ${esc(when(r.at))}</span></a>`).join('')}` : ''}</div>` : ''}
      <div class="prose">${i.body ? md(i.body, P()) : '<p style="color:var(--text-4)">No description.</p>'}</div>`,
  });
}
function projectSheet(slug) {
  const p = M.projects.find((x) => x.slug === slug);
  if (!p) return notFound('No project with this name.');
  const open = [...M.issues.values()].filter((i) => i.project === slug && !i.archived && !['done', 'wontfix'].includes(i.status))
    .sort((a, b) => (a.status === 'in-review' ? 0 : 1) - (b.status === 'in-review' ? 0 : 1) || b.id.localeCompare(a.id));
  return sheet({
    crumb: `${pbadge(slug)}<span>·</span><span>Project</span>`,
    url: boardUrl(`/w/${M.ws.id}/projects`),
    body: `<h2 id="sheet-title">${esc(p.title)}</h2>
      <div class="props"><span>${esc(p.status)}</span><span>${esc(counts(slug))}</span>${p.lastSession ? `<span>Last session ${esc(dayLabel(p.lastSession))}</span>` : ''}<span class="mono">${esc(slug)}/prd.md</span></div>
      <div class="box-h">Current focus</div><div class="prose">${md(p.focus, P())}</div>
      ${open.length ? `<div class="box"><div class="box-h">Open issues</div>${open.slice(0, 6).map((i) => issueRow(i, i.assignee === 'human' ? AV.human : '')).join('')}</div>` : ''}
      ${p.sessions.length ? `<div class="box-h" style="margin-top:14px">Sessions</div>${p.sessions.slice(0, 3).map((s) => `<div class="prose"><p style="margin:8px 0 2px"><strong>${esc(dayLabel(s.date))}</strong></p>${md(s.note, P())}</div>`).join('')}` : ''}`,
  });
}
function notFound(msg) { return sheet({ crumb: '<span>Not found</span>', url: null, body: `<h2 id="sheet-title">Nothing here</h2><p class="empty">${esc(msg)}</p>` }); }

// ── Routing: #<proto>[/<kind>/<id>[/<key>]] ─────────────────
const state = {
  proto: 'a',
  win: store.get('win', '7d'),
  theme: store.get('theme', 'auto'),
  source: store.get('source', null),
};
// The dialogs opened in a row: whether the first came from the page (Close
// then rewinds history) and the hashes Back returns to.
let chain = null;
let lastProto = null;
let lastFocus = null;

function parseHash() {
  const [proto, kind, a, b] = location.hash.replace(/^#/, '').split('/');
  return { proto: PROTOS.some((p) => p.id === proto) ? proto : null, kind, a, b };
}
function route() {
  const h = parseHash();
  if (!h.proto) { history.replaceState(null, '', `#${store.get('proto', 'a')}`); return route(); }
  state.proto = h.proto;
  store.set('proto', h.proto);
  if (lastProto !== h.proto) { renderStage(); lastProto = h.proto; }
  const scrim = $('#scrim');
  if (!h.kind) { scrim.hidden = true; chain = null; lastFocus?.focus?.(); return; }
  chain = chain || { fromPage: false, n: 0, trail: [] };
  if (chain.trail.at(-1) === location.hash) { chain.trail.pop(); chain.n--; }
  const html = h.kind === 'run' ? runSheet(h.a, h.b)
    : h.kind === 'issue' ? issueSheet(h.a)
    : h.kind === 'project' ? projectSheet(h.a)
    : h.kind === 'routine' ? routineSheet(h.a) : notFound('Unknown link.');
  if (scrim.hidden) lastFocus = document.activeElement;
  $('#sheet').innerHTML = html;
  scrim.hidden = false;
  $('#sheet .sheet-b').scrollTop = 0;
  ($('#sheet [data-act="close"]'))?.focus({ preventScroll: true });
}
function closeSheet() {
  const c = chain; chain = null;
  if (c?.fromPage && c.n > 0) { history.go(-c.n); return; }
  history.pushState(null, '', `#${state.proto}`);
  route();
}

// ── Rendering ───────────────────────────────────────────────
function renderStage() {
  hideHover();
  const D = derive();
  $('#stage').innerHTML = state.proto === 'a' ? renderA(D) : state.proto === 'b' ? renderB(D) : renderC(D);
  $('#thesis').textContent = PROTOS.find((p) => p.id === state.proto).thesis;
  for (const b of $('#protos').children) b.classList.toggle('on', b.dataset.v === state.proto);
  renderRail(D);
}
function renderRail(D) {
  const ws = M.ws.name;
  const base = M.live ? `/w/${M.ws.id}` : '#';
  const nav = (icon, label, href, count, on, hot) => `<a class="rail-nav${on ? ' on' : ''}" href="${href}">${icon}<span>${label}</span>${count != null ? `<span class="count${hot ? ' hot' : ''}">${count}</span>` : ''}</a>`;
  const fresh = D.runs.filter(({ r }) => isNew(r.at)).length + D.filed.filter((i) => isNewDay(i.created)).length;
  $('#rail').innerHTML = `<div class="rail-ws"><span class="rail-logo">${ICON.routine.replace('width="14" height="14"', 'width="11" height="11"')}</span>${esc(ws)}</div>
    ${nav(ICON.home, 'Home', `#${state.proto}`, fresh || null, true, fresh > 0)}
    ${nav(ICON.inbox, 'Inbox', M.live ? base : '#', null)}
    ${nav(ICON.you, 'Needs you', M.live ? '/needs-you' : '#', D.needs.length)}
    ${nav(ICON.issues, 'Issues', M.live ? `${base}/issues` : '#', M.issues.size)}
    <div class="rail-h">Workspace</div>
    ${nav(ICON.projects, 'Projects', M.live ? `${base}/projects` : '#', M.projects.length)}
    ${nav(ICON.routine, 'Routines', M.live ? `${base}/routines` : '#', M.routines.length)}
    <div class="rail-h">Projects · last session</div>
    ${M.projects.slice(0, 8).map((p) => `<a class="rail-proj" href="${hrefProject(p.slug)}"><span class="pbadge-mark ${tone(p.slug)}"></span><span>${esc(p.title)}</span></a>`).join('')}`;
}

// ── Hover card for issue links ──────────────────────────────
let hoverTimer = 0, hoverEl = null;
function hideHover() { clearTimeout(hoverTimer); hoverEl?.remove(); hoverEl = null; }
document.addEventListener('pointerover', (e) => {
  if (e.pointerType === 'touch') return;
  const a = e.target.closest?.('[data-issue]');
  if (!a) return;
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => {
    const i = M.issues.get(a.dataset.issue);
    if (!i || !a.isConnected) return;
    hideHover();
    hoverEl = document.createElement('div');
    hoverEl.className = 'hover';
    const body = plain(i.body || '').replace(/\s+/g, ' ').trim();
    hoverEl.innerHTML = `<div class="h-m">${statusIcon(i.status)}<span class="mono">#${i.id}</span><span>${STATUS_LABEL[i.status] || ''}</span>${AV[i.assignee] || ''}${pbadge(i.project)}</div>
      <div class="h-t">${esc(i.title)}</div>${body ? `<div class="h-b">${esc(clip(body, 220))}</div>` : ''}`;
    document.body.appendChild(hoverEl);
    const r = a.getBoundingClientRect();
    const w = hoverEl.offsetWidth, h = hoverEl.offsetHeight;
    const top = r.bottom + 6 + h > innerHeight ? r.top - h - 6 : r.bottom + 6;
    hoverEl.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
    hoverEl.style.top = `${Math.max(8, top)}px`;
  }, 350);
});
document.addEventListener('pointerout', (e) => { if (e.target.closest?.('[data-issue]')) hideHover(); });

// ── Events ──────────────────────────────────────────────────
function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1600);
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href^="#"]');
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') return closeSheet();
  if (act === 'back') return history.back();
  if (act === 'copy') {
    const url = location.href;
    (navigator.clipboard?.writeText(url) ?? Promise.reject()).then(() => toast('Link copied'), () => toast(url));
    return;
  }
  const jump = e.target.closest('[data-jump]')?.dataset.jump;
  if (jump) { e.preventDefault(); document.getElementById('j-' + jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (a && a.getAttribute('href') === '#') { e.preventDefault(); toast('Opens in loopboard (demo data)'); return; }
  const href = a?.getAttribute('href');
  if (href && href.split('/').length > 1 && href !== location.hash) {
    if ($('#scrim').hidden || !chain) chain = { fromPage: $('#scrim').hidden, n: 1, trail: [] };
    else { chain.n++; chain.trail.push(location.hash); }
  }
  hideHover();
});
$('#scrim').addEventListener('mousedown', (e) => { if (e.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#scrim').hidden) { e.preventDefault(); closeSheet(); }
  if ($('#scrim').hidden && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) {
    const i = ['1', '2', '3'].indexOf(e.key);
    if (i >= 0) location.hash = PROTOS[i].id;
  }
});
window.addEventListener('hashchange', route);

$('#protos').innerHTML = PROTOS.map((p) => `<button data-v="${p.id}" role="radio">${p.name}</button>`).join('');
$('#protos').addEventListener('click', (e) => { const v = e.target.closest('button')?.dataset.v; if (v) location.hash = v; });
$('#win').addEventListener('click', (e) => {
  const v = e.target.closest('button')?.dataset.v; if (!v) return;
  state.win = v; store.set('win', v); syncSeg('#win', v); renderStage();
});
$('#seen').addEventListener('click', () => {
  M.lastVisit = new Date(M.live ? Date.now() : M.now);
  if (M.live) store.set('seen:' + M.ws.id, M.lastVisit.toISOString());
  renderStage(); toast('Marked as seen');
});
$('#theme').addEventListener('click', (e) => { const v = e.target.closest('button')?.dataset.v; if (v) { state.theme = v; store.set('theme', v); applyTheme(); } });
$('#source').addEventListener('change', (e) => { state.source = e.target.value; store.set('source', state.source); load(); });
function syncSeg(sel, v) { for (const b of $(sel).children) b.classList.toggle('on', b.dataset.v === v); }
function applyTheme() {
  const dark = state.theme === 'dark' || (state.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = state.theme;
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  syncSeg('#theme', state.theme);
}
const ro = new ResizeObserver(() => document.documentElement.style.setProperty('--lab-h', `${$('#lab').offsetHeight}px`));
ro.observe($('#lab'));

// ── Data sources: live workspaces when served by loopboard, else demo ──
async function getJson(url) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 4000);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok || !(res.headers.get('content-type') || '').includes('json')) return null;
    return await res.json();
  } catch { return null; } finally { clearTimeout(t); }
}
async function discover() {
  const ws = await getJson('/api/workspaces');
  SOURCES = [{ id: 'demo', name: 'Demo · loopboard', live: false }];
  if (ws?.workspaces) for (const w of ws.workspaces.filter((x) => x.available)) SOURCES.push({ id: w.id, name: `Live · ${w.name}`, live: true });
  if (!SOURCES.some((s) => s.id === state.source)) state.source = ws?.lastUsed && SOURCES.some((s) => s.id === ws.lastUsed) ? ws.lastUsed : 'demo';
  $('#source').innerHTML = SOURCES.map((s) => `<option value="${esc(s.id)}"${s.id === state.source ? ' selected' : ''}>${esc(s.name)}</option>`).join('');
  $('#source').hidden = SOURCES.length === 1;
}
async function load() {
  const src = SOURCES.find((s) => s.id === state.source) || SOURCES[0];
  if (!src.live) { M = normalize(DEMO, false); }
  else {
    $('#stage').innerHTML = '<div class="a">' + empty('Loading ' + esc(src.name) + '…') + '</div>';
    const id = encodeURIComponent(src.id);
    const [rt, data] = await Promise.all([getJson(`/api/w/${id}/routines`), getJson(`/api/w/${id}/data`)]);
    if (!data) { M = normalize(DEMO, false); toast('Couldn’t load the workspace; showing demo data'); }
    else {
      const seen = store.get('seen:' + src.id, null);
      M = normalize({
        ws: { id: src.id, name: data.workspace?.name || src.name.replace('Live · ', '') },
        now: null,
        lastVisit: seen || new Date(Date.now() - 86400000).toISOString(),
        routines: rt?.routines || [], issues: data.issues || [], projects: data.projects || [],
      }, true);
    }
  }
  lastProto = null;
  route();
}

applyTheme();
syncSeg('#win', state.win);
discover().then(load);
})();
</script>
